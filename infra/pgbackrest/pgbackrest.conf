# =============================================================================
# infra/pgbackrest/pgbackrest.conf — sauvegarde physique PostgreSQL (lot L0)
# Applique : 02 §11.4 (WAL archiving + full hebdo/incrémental quotidien,
# rétention 30 j, dépôt CHIFFRÉ), 02 §30.4-1/5 (aucune valeur de secret dans un
# fichier versionné), 07 ligne L0 (« restauration Postgres testée depuis zéro »).
# =============================================================================
#
# SECRETS ET VALEURS VARIABLES — jamais ici, TOUJOURS par l'environnement :
# pgBackRest lit toute option `xxx-yyy` dans la variable `PGBACKREST_XXX_YYY`.
# docker-compose.yml injecte, depuis le .env :
#   PGBACKREST_STANZA                     ← ${PGBACKREST_STANZA}
#   PGBACKREST_REPO1_PATH                 ← ${PGBACKREST_REPO_PATH}
#   PGBACKREST_REPO1_CIPHER_PASS          ← ${PGBACKREST_CIPHER_PASS}   (SECRET)
#   PGBACKREST_REPO1_RETENTION_FULL       ← ${BACKUP_RETENTION_DAYS}
#   PGBACKREST_REPO1_RETENTION_FULL_TYPE  ← time
# L’ENVIRONNEMENT PRIME SUR CE FICHIER. Les options qu’il porte sont donc
# COMMENTÉES ici plutôt que dupliquées : une valeur morte mais lisible fait
# croire à un futur lecteur qu’elle fait foi, et il ira la corriger sans effet.
# Ne décommentez rien : vous créeriez une seconde source de vérité (mineur de
# revue croisée du 2026-08-27).

[global]

# --- Dépôt : volume nommé `pgbackrest_repo` ----------------------------------
# repo1-path : PORTÉ PAR L’ENVIRONNEMENT (PGBACKREST_REPO1_PATH ← ${PGBACKREST_REPO_PATH}).
# repo1-path=/var/lib/pgbackrest
#
# QUI SORT CE DÉPÔT DE LA MACHINE — RECTIFIÉ LE 2026-08-29, MESURÉ.
# Ces lignes annonçaient « sauvegardé hors serveur par infra/scripts/
# backup-postgres.sh — règle 3-2-1 ». Les deux moitiés étaient fausses là où ce
# fichier est réellement déployé, et il l’est : `infra/postgres/Dockerfile` le
# COPIE dans l’image (`COPY pgbackrest/pgbackrest.conf /etc/pgbackrest/…`).
#
#   · DEUX CHAÎNES coexistent dans ce dépôt (voir l’avertissement §11 du
#     `.env.example`). `backup-postgres.sh` appartient à celle du **VPS dédié** :
#     `cron` sur l’HÔTE, posé par `infra/scripts/install-cron.sh`, variables
#     `STORAGE_BOX_*` / `OFFSITE_RCLONE_*`. Le `.env.example` la qualifie lui-même
#     de « **JAMAIS JOUÉ** à ce jour », et le seul environnement déployé est le
#     staging **Coolify**, qui n’a pas d’accès à l’hôte — donc pas de `cron`,
#     donc pas d’exécution possible de ce script.
#   · Ce qui expédie RÉELLEMENT ce volume, c’est le service `sauvegarde`
#     (`infra/postgres/sauvegarde.sh`, `docker-compose.coolify.yml`), par
#     `mc mirror` vers **Cloudflare R2** — amendement au 02 §11.4 tracé dans
#     `DECISIONS.md` du 2026-08-28, à ratifier par Williams.
#   · **La règle 3-2-1 n’est PAS tenue aujourd’hui**, et l’écrire ici serait
#     reproduire le défaut qu’on corrige : il y a DEUX copies (serveur + R2),
#     pas trois. La troisième destination (Storage Box, décision D-1) est
#     implémentée dans `sauvegarde.sh` mais **démarre INACTIVE** tant que les
#     `BACKUP_STORAGEBOX_*` ne sont pas posées — elles sont vides.

# --- CHIFFREMENT DU DÉPÔT (02 §11.4 « copie chiffrée ») ----------------------
# La passphrase N'EST PAS ICI : PGBACKREST_REPO1_CIPHER_PASS (02 §30.4-1).
# Perdre cette passphrase = perdre les sauvegardes.
#
# OÙ ELLE SURVIT À LA MACHINE — RECTIFIÉ LE 2026-08-29, MESURÉ.
# Cette ligne affirmait qu’elle est « sauvegardée chiffrée dans la Storage Box
# avec le .env ». C’était faux dans les deux termes, et
# `infra/docker-compose.prod.yml` l’avait déjà relevé en toutes lettres :
# « RIEN NE LE FAIT ». **Aucune Storage Box n’est provisionnée** :
# `BACKUP_STORAGEBOX_HOST`, `_USER` et `_SSH_KEY_B64` sont vides dans
# `.env.example`, aucune clé SSH n’est générée, et `sauvegarde.sh` journalise
# « TROISIÈME COPIE INACTIVE » dans cet état.
#
# CE QUI EST VRAI AUJOURD’HUI, sur le seul chemin déployé (Coolify) : cette
# passphrase est une variable de la pile (`PGBACKREST_CIPHER_PASS`), elle est
# donc capturée par le **coffre des secrets** que `sauvegarde.sh` produit à
# partir de l’environnement de son propre processus (`secrets-*.coffre.gpg`,
# chiffré GPG AES256), et ce coffre part vers **Cloudflare R2** avec les
# archives. Sur le chemin « VPS dédié », en revanche, **rien ne la sauvegarde**
# — aucun des quatre scripts d’`infra/scripts/` ne copie le `.env` de l’hôte.
#
# ⚠️ Et le coffre ne se rouvre qu’avec `BACKUP_SECRETS_PASSPHRASE`, qui vit
# **hors de toute machine** (décision D-3, option A : gestionnaire de mots de
# passe de Williams). Perdre celle-là, c’est perdre celle-ci.
repo1-cipher-type=aes-256-cbc

# --- Rétention : 30 jours (02 §11.4), pilotée par ${BACKUP_RETENTION_DAYS} ----
# repo1-retention-full-type : PORTÉE PAR L’ENVIRONNEMENT (« time »).
# repo1-retention-full-type=time
# repo1-retention-full : PORTÉE PAR L’ENVIRONNEMENT
# (PGBACKREST_REPO1_RETENTION_FULL ← ${BACKUP_RETENTION_DAYS}, 30 j par défaut).
# Écrire 30 en dur ici ferait croire que c’est la valeur appliquée : ce n’est pas
# le cas, et changer BACKUP_RETENTION_DAYS n’aurait laissé aucune trace ici.
# repo1-retention-full=30
# Les incrémentales suivent la rétention des complètes dont elles dépendent.
repo1-retention-archive-type=full

# --- Performances / robustesse ----------------------------------------------
compress-type=zst
compress-level=3
process-max=2
start-fast=y
# Restauration différentielle : ne réécrit que les blocs modifiés.
delta=y
# Archivage asynchrone : `archive_command` ne bloque jamais un COMMIT.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=1GiB

# --- Journalisation ----------------------------------------------------------
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

# =============================================================================
# STANZA — le nom de section DOIT être identique à ${PGBACKREST_STANZA}.
# Contrairement aux options ci-dessus, un NOM DE SECTION ne peut pas venir de
# l’environnement : pgBackRest le lit dans le fichier. C’est donc la SEULE
# duplication inévitable avec le .env (valeur par défaut : `axion`).
# Si vous changez PGBACKREST_STANZA, changez aussi ce nom de section — sinon
# `stanza-create` échouera.
# =============================================================================
[axion]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql

# RÔLE ET BASE DE CONNEXION — trouvé à l'EXÉCUTION, pas à la lecture.
#
# pgBackRest se connecte par défaut au rôle `postgres` et à la base `postgres`.
# Or l'image officielle initialise le cluster avec POSTGRES_USER : ni ce rôle ni
# cette base n'existent ici. `stanza-create` échouait donc sur
# « role "postgres" does not exist », et avec lui TOUTE la chaîne de sauvegarde —
# `archive_command` compris. Les WAL se seraient accumulés dans pg_wal sans qu'aucune
# sauvegarde ne soit restaurable, et le test de restauration nocturne n'aurait jamais
# eu de quoi restaurer.
#
# C'est le point de contrôle n°1 de la porte P-A côté sauvegardes, et il ne se
# vérifie qu'en démarrant réellement la pile.
# Portés par l'environnement (PGBACKREST_PG1_USER / PGBACKREST_PG1_DATABASE) dans
# infra/docker-compose.yml, comme les autres options : ce fichier ne fait AUCUNE
# interpolation de variable, un ${...} y resterait littéral.
