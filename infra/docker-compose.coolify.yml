# =============================================================================
# infra/docker-compose.coolify.yml — PILE DE STAGING DÉPLOYÉE PAR COOLIFY
# sur le serveur `axionia-web`, DERRIÈRE le Traefik de Coolify.
#
# Applique : DECISIONS.md 2026-08-28 « Le staging s'insère derrière le Traefik de
# Coolify » (option 4, à RATIFIER à la porte P-A), 11 §2 (pas de CORS : domaine
# unique, `/` → terrain, `/hq` → console, `/api` → API, servis par NOTRE Caddy),
# 06 §10.3 (Postgres/Redis/MinIO jamais exposés), 02 §30.4-4 (séparation stricte),
# infra/COHABITATION_AXIONIA_WEB.md §5 (les quatre conditions de cohabitation).
# =============================================================================
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ POURQUOI CE FICHIER EXISTE ALORS QUE docker-compose.staging.yml EXISTE    │
# │ Coolify ne prend qu'UN SEUL chemin de compose et n'applique AUCUNE        │
# │ surcharge : il n'y a pas de `-f base.yml -f surcharge.yml`. Ce fichier    │
# │ est donc AUTOPORTANT. Il reprend fidèlement les définitions de            │
# │ infra/docker-compose.yml (images, commandes, sondes, variables) au lieu   │
# │ de s'appuyer dessus.                                                      │
# │                                                                           │
# │ CONSÉQUENCE ASSUMÉE : c'est une DUPLICATION. Toute modification de        │
# │ infra/docker-compose.yml qui touche une image, une commande, une sonde ou │
# │ une variable doit être reportée ICI dans le même commit. Rien dans la     │
# │ chaîne d'outils ne le vérifie à notre place aujourd'hui.                  │
# │                                                                           │
# │ COROLLAIRE : les balises `!reset` / `!override` de docker-compose.staging │
# │ .yml n'ont PAS d'équivalent ici et n'en ont pas besoin. Elles servent à   │
# │ EFFACER une clé héritée d'un fichier de base (`ports: !reset []` supprime │
# │ les publications de ports du fichier de dev). Sans fichier de base, la    │
# │ bonne façon de ne rien publier est de NE PAS ÉCRIRE de clé `ports:` —     │
# │ c'est ce qui est fait ci-dessous, sur tous les services sans exception.   │
# └───────────────────────────────────────────────────────────────────────────┘
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ ⚠️ RÉPERTOIRE DE PROJET — TOUS LES CHEMINS RELATIFS DE CE FICHIER PARTENT │
# │    DE LA RACINE DU DÉPÔT, PAS DE `infra/`.                                │
# │                                                                           │
# │ C'EST L'INVERSE DES TROIS AUTRES FICHIERS COMPOSE DU DÉPÔT. Ne « corrigez │
# │ pas » cette divergence : elle est la CONDITION du déploiement.            │
# │                                                                           │
# │ POURQUOI. Compose résout les chemins relatifs depuis le RÉPERTOIRE DE     │
# │ PROJET. Par défaut c'est le dossier du fichier `-f` — d'où le `context:   │
# │ ..` de infra/docker-compose.yml. Mais Coolify FIXE ce répertoire lui-même │
# │ et le met à la racine du dépôt cloné :                                    │
# │                                                                           │
# │   docker compose --project-directory /artifacts/<uuid> \                  │
# │     -f /artifacts/<uuid>/infra/docker-compose.coolify.yml build …         │
# │                                                                           │
# │ Avec `context: ..`, Compose remontait alors AU-DESSUS de la racine et     │
# │ cherchait `/artifacts/apps` au lieu de `/artifacts/<uuid>/apps` :         │
# │   « resolve : lstat /artifacts/apps: no such file or directory »          │
# │ (échec du déploiement wrunr6mwq2oxqq392i4myzjn, 2026-08-28).              │
# │ Ce fichier suit donc LA CONVENTION DE COOLIFY. `docker-compose.yml`,      │
# │ `.staging.yml` et `.prod.yml` gardent la leur et restent INCHANGÉS : ils  │
# │ sont lancés à la main, avec le répertoire de projet par défaut.           │
# │                                                                           │
# │ CONSÉQUENCE À CONNAÎTRE — LA VALIDATION LOCALE CHANGE DE COMMANDE.        │
# │ La commande habituelle prendrait `infra/` comme répertoire de projet et   │
# │ casserait tous les chemins, soit exactement le bug corrigé ici, à         │
# │ l'envers. Depuis la RACINE du dépôt, valider avec :                       │
# │                                                                           │
# │   docker compose --project-directory . \                                  │
# │     -f infra/docker-compose.coolify.yml config -q                         │
# │                                                                           │
# │ `--project-directory .` reproduit ce que fait Coolify. Sans ce drapeau,   │
# │ un échec de validation ne prouve RIEN sur le déploiement réel — et un     │
# │ succès non plus.                                                          │
# │                                                                           │
# │ `dockerfile:` reste relatif au `context:` et n'est donc PAS concerné :    │
# │ `apps/api/Dockerfile` s'écrit à l'identique dans les quatre fichiers.     │
# └───────────────────────────────────────────────────────────────────────────┘
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ ⚠️ CONFIGURATION EMBARQUÉE — AUCUN FICHIER DU DÉPÔT N'EST MONTÉ.          │
# │    QUATRIÈME convention propre à Coolify, et la plus lourde : elle change │
# │    la façon dont la configuration VOYAGE.                                 │
# │                                                                           │
# │ CE QUI EST INTERDIT ICI, ET QUI MARCHE PARTOUT AILLEURS :                 │
# │     - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro                     │
# │ N'ÉCRIVEZ JAMAIS CELA DANS CE FICHIER. Ce n'est pas une préférence.       │
# │                                                                           │
# │ POURQUOI. Coolify ne monte PAS depuis le dépôt cloné : il réécrit tout    │
# │ montage relatif vers son propre dossier persistant                        │
# │ `/data/coolify/applications/<uuid>/`, où il ne dépose que                 │
# │ `docker-compose.yaml` et `.env` — jamais les fichiers du dépôt.           │
# │                                                                           │
# │ PREUVE, relevée sur le serveur (déploiement wrunr6mwq2oxqq392i4myzjn,     │
# │ 2026-08-28). Le montage réel :                                            │
# │   bind /data/coolify/applications/<uuid>/infra/postgres/                  │
# │        postgresql.custom.conf  ->  /etc/postgresql/postgresql.custom.conf │
# │ et, à cette source, sur l'hôte :                                          │
# │   drwxr-xr-x 2 root root 4096 …  .        ← un RÉPERTOIRE VIDE            │
# │ Quand la source n'existe pas, Docker CRÉE UN RÉPERTOIRE à sa place. Le    │
# │ conteneur ne voit donc pas un fichier vide — il voit un DOSSIER :         │
# │   LOG:   input in flex scanner failed at file "…custom.conf" line 1       │
# │   FATAL: configuration file "…custom.conf" contains errors                │
# │ postgres bouclait en `Restarting (1)`. Les quatre fichiers de config      │
# │ auraient subi le même sort.                                               │
# │                                                                           │
# │ CE QUI EST FAIT À LA PLACE — la config entre dans les IMAGES :            │
# │   postgresql.custom.conf ─┐                                               │
# │   pgbackrest.conf        ─┴→ infra/postgres/Dockerfile, cible             │
# │                              `config-embarquee` (contexte `infra/`)       │
# │   Caddyfile              ─┐                                               │
# │   fronts.static.caddy    ─┴→ infra/caddy/Dockerfile (contexte             │
# │                              `infra/caddy/`, base `caddy:2-alpine`)       │
# │   fronts.dev.caddy       ─→  VOLONTAIREMENT ABSENT (serveurs Vite         │
# │                              inexistants ici — il ne servirait qu'à       │
# │                              mettre le site en 502).                      │
# │                                                                           │
# │ CE QUI N'EST PAS CONCERNÉ : les VOLUMES NOMMÉS (données PostgreSQL,       │
# │ MinIO, Redis, `dist` des fronts, état de Caddy). Coolify les gère         │
# │ normalement. Seuls les montages de FICHIERS DU DÉPÔT sont impossibles.    │
# │                                                                           │
# │ ⚠️ CE QUE ÇA COÛTE, À SAVOIR AVANT D'EN AVOIR BESOIN EN URGENCE :         │
# │ LA CONFIGURATION N'EST PLUS MODIFIABLE SANS RECONSTRUIRE L'IMAGE. Il n'y  │
# │ a plus de « je corrige le Caddyfile et je redémarre le conteneur » : tout │
# │ changement de ces quatre fichiers exige un redéploiement complet, donc    │
# │ une reconstruction des images (plusieurs minutes, CPU du serveur de       │
# │ production). Un correctif de configuration en pleine démo n'est plus une  │
# │ manœuvre de trente secondes.                                              │
# └───────────────────────────────────────────────────────────────────────────┘
#
# -----------------------------------------------------------------------------
# CE QUE CE FICHIER FAIT, ET CE QU'IL NE FAIT PAS
# -----------------------------------------------------------------------------
# IL FAIT :
#   · construire toutes les images DEPUIS LE DÉPÔT (aucune image tirée d'un
#     registre privé), CONFIGURATION COMPRISE (encadré « CONFIGURATION
#     EMBARQUÉE ») ;
#   · ne publier AUCUN port sur l'hôte, pour AUCUN service ;
#   · exposer notre Caddy au seul Traefik de Coolify, par un réseau Docker
#     partagé, en HTTP simple sur 8080 ;
#   · plafonner CPU, mémoire ET SWAP de TOUS les conteneurs (COHABITATION §5.4 ;
#     voir l'encadré « DEUX MÉCANISMES DE PLAFOND » ci-dessous) ;
#   · nommer réseau et volumes de façon distincte de la pile de dev, de la pile
#     `docker-compose.staging.yml` et du projet voisin `Axion-IA`.
#
# IL NE FAIT PAS :
#   · il ne termine PAS TLS et n'obtient AUCUN certificat — c'est Traefik qui le
#     fait pour le sous-domaine (DECISIONS.md 2026-08-28) ;
#   · il ne pose AUCUN label Traefik. Le routeur (Host + TLS) est généré par
#     Coolify à partir du domaine posé sur le service `caddy`. Deux routeurs
#     concurrents pour le même hôte seraient pires que pas de routeur du tout ;
#   · les plafonds mémoire s'appliquent aux conteneurs EN EXÉCUTION. Ils ne
#     plafonnent PAS la CONSTRUCTION des images (pnpm install + build Vite), qui
#     tourne dans le démon Docker, hors de ces limites. Ne pas déclencher un
#     déploiement pendant une pointe de trafic sur axion-ia.com ;
#   · il ne durcit ni SSH ni le pare-feu — `provision-vps.sh` NE DOIT PAS être
#     exécuté sur cette machine (COHABITATION §2) ;
#   · il ne crée pas la stanza pgBackRest. L'archivage WAL est actif
#     (postgresql.custom.conf) mais `stanza-create` reste une commande manuelle
#     à passer une fois, sinon les WAL s'accumulent dans pg_wal (voir
#     infra/README.md).
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ DEUX MÉCANISMES DE PLAFOND MÉMOIRE — ILS NE FONT PAS LA MÊME CHOSE.       │
# │ N'EN SUPPRIMEZ AUCUN. Chaque service porte TROIS clés, et il en faut      │
# │ trois :                                                                   │
# │                                                                           │
# │   deploy.resources.limits.cpus     → plafond CPU                          │
# │   deploy.resources.limits.memory   → plafond de RAM                       │
# │   mem_limit                        → plafond de RAM (clé de service)      │
# │   memswap_limit                    → plafond RAM + SWAP CUMULÉS           │
# │                                                                           │
# │ POURQUOI `memswap_limit` — MESURE, PAS SUPPOSITION (A54, 2026-08-28).     │
# │ Lecture des cgroups du seul conteneur plafonné de la machine :            │
# │     memory.max      = 1073741824   (1 Gio)                                │
# │     memory.swap.max = 1073741824   (1 Gio)                                │
# │ Docker applique par défaut `--memory-swap = 2 × --memory`, et en cgroup   │
# │ v2 `memory.swap.max` S'AJOUTE à `memory.max`. Un service plafonné à       │
# │ 768 Mio pouvait donc occuper 768 Mio de RAM PLUS 768 Mio de swap : les    │
# │ 4 096 Mio annoncés par ce fichier étaient en réalité un engagement de     │
# │ 8 192 Mio de RAM+swap.                                                    │
# │ Le swap disponible (~7 Go) l'absorberait — mais un staging qui swappe     │
# │ plusieurs Go SATURE LES ENTRÉES-SORTIES DE /dev/sda1, que le site de      │
# │ production et ses sauvegardes horaires PARTAGENT. On aurait échangé un    │
# │ risque d'OOM, que les plafonds maîtrisent, contre un risque de lenteur    │
# │ du site, qu'ils ne maîtrisent pas.                                        │
# │ `memswap_limit == mem_limit` met `memory.swap.max` à 0 : le conteneur ne  │
# │ swappe plus du tout, et le plafond annoncé est le plafond réel.           │
# │                                                                           │
# │ POURQUOI PAS SOUS `deploy:` — `deploy.resources.limits` NE SAIT PAS       │
# │ régler le swap ; il n'existe aucune clé pour cela. `mem_limit` et         │
# │ `memswap_limit` sont des clés de service de PREMIER NIVEAU. Elles         │
# │ COHABITENT avec `deploy.resources.limits` sans le remplacer : la première │
# │ paire porte le swap, la seconde porte le CPU. Supprimer l'une des deux    │
# │ familles rouvre exactement le trou décrit ci-dessus.                      │
# │ `mem_limit` est requis pour que `memswap_limit` ait un sens : Docker      │
# │ refuse un plafond de swap sans plafond de mémoire. Il vaut donc TOUJOURS  │
# │ la même valeur que `deploy.resources.limits.memory` — trois valeurs à     │
# │ garder identiques par service.                                            │
# └───────────────────────────────────────────────────────────────────────────┘
#
# -----------------------------------------------------------------------------
# PRÉREQUIS SUR LE SERVEUR — À VÉRIFIER AVANT LE PREMIER DÉPLOIEMENT
# -----------------------------------------------------------------------------
# Le réseau du proxy de Coolify doit exister et le proxy doit y être attaché.
# Deux commandes de LECTURE, elles ne modifient rien :
#
#   docker network inspect coolify --format '{{.Name}}'
#   docker network inspect coolify --format '{{range .Containers}}{{.Name}} {{end}}'
#
# La seconde doit citer `coolify-proxy`. Si le réseau porte un autre nom sur
# cette installation, posez ce nom dans COOLIFY_PROXY_NETWORK (voir plus bas).
# Le réseau est déclaré `external` : s'il n'existe pas, le déploiement échoue
# immédiatement et bruyamment — ce qui vaut mieux qu'une pile démarrée que le
# proxy ne peut pas joindre.
#
# -----------------------------------------------------------------------------
# VARIABLES D'ENVIRONNEMENT ATTENDUES DE COOLIFY — LISTE EXACTE
# -----------------------------------------------------------------------------
# A. OBLIGATOIRES. Déclarées `${VAR:?…}` : si l'une manque ou est vide, le
#    déploiement S'ARRÊTE avec un message nommant la variable. Aucune ne prend
#    de valeur par défaut, et AUCUN secret n'est écrit dans ce fichier.
#
#   PUBLIC_BASE_URL              URL publique du staging (ex. https://audit-staging.axion-ia.com)
#   CONSOLE_BASE_URL             URL de la console siège (généralement <PUBLIC_BASE_URL>/hq)
#   POSTGRES_PASSWORD            mot de passe du rôle applicatif PostgreSQL
#   DATABASE_URL                 postgresql://<user>:<pass>@postgres:5432/<db>   (hôte = `postgres`)
#   REDIS_PASSWORD               mot de passe Redis
#   REDIS_URL                    redis://:<pass>@redis:6379                      (hôte = `redis`)
#   MINIO_ROOT_USER              compte racine MinIO (jamais utilisé par l'app)
#   MINIO_ROOT_PASSWORD          mot de passe racine MinIO
#   MINIO_ACCESS_KEY             compte applicatif RESTREINT créé par `createbuckets`
#   MINIO_SECRET_KEY             secret du compte applicatif
#   JWT_ACCESS_SECRET            64 caractères hex MINIMUM (openssl rand -hex 32)
#   JWT_REFRESH_SECRET           64 caractères hex MINIMUM, DISTINCT du précédent
#   APP_ENCRYPTION_KEY           clé de chiffrement applicative
#   CONSOLE_WEBHOOK_SECRET       secret de signature des webhooks console
#   PGBACKREST_CIPHER_PASS       passphrase de chiffrement du dépôt de sauvegarde
#   SEED_ADMIN_EMAIL             compte administrateur initial du staging
#   SEED_ADMIN_PASSWORD          mot de passe de ce compte
#   BACKUP_R2_BUCKET             bucket Cloudflare R2 DÉDIÉ aux sauvegardes
#   BACKUP_R2_ENDPOINT           endpoint S3 du compte R2 (schéma facultatif)
#   BACKUP_R2_ACCESS_KEY         identifiant du jeton R2, limité à ce seul bucket
#   BACKUP_R2_SECRET_KEY         secret de ce jeton
#
#   ⚠️ LES QUATRE BACKUP_R2_* NE SONT DÉCLARÉES QUE POUR LE SERVICE
#      `sauvegarde` — c'est là que la dépendance est vraie, et c'est ce que ce
#      fichier documente. Ce N'EST PAS un cloisonnement : Coolify injecte le
#      `.env` entier dans tous les conteneurs (mesuré le 2026-08-28 — elles sont
#      lisibles dans `api`). Ce qui limite ce jeton est sa PORTÉE (un seul
#      bucket, lecture/écriture d'objets), pas ce fichier.
#      Elles sont déclarées `:?` — sans elles le déploiement s'arrête en les
#      nommant, plutôt que de démarrer un service de sauvegarde qui n'expédierait
#      rien.
#
#   ⚠️ DATABASE_URL et REDIS_URL sont fournies TELLES QUELLES et ne sont pas
#      recomposées ici : un mot de passe contenant `@`, `:` ou `/` doit être
#      encodé par celui qui écrit l'URL. Leurs identifiants doivent coïncider
#      avec POSTGRES_* / REDIS_PASSWORD — rien ne le vérifie au démarrage.
#
# B. FACULTATIVES, valeur par défaut appliquée ci-dessous entre parenthèses.
#    Non secrètes : ce sont des conventions de la pile, pas des réglages.
#
#   COOLIFY_PROXY_NETWORK (coolify)   réseau Docker du proxy Traefik de Coolify
#   NODE_ENV (production) · APP_ENV (staging) · LOG_LEVEL (info) · TZ (UTC)
#   API_HOST (0.0.0.0) · API_PORT (3000)
#   POSTGRES_HOST (postgres) · POSTGRES_PORT (5432) · POSTGRES_DB (axion_audit)
#   POSTGRES_USER (axion)
#   REDIS_HOST (redis) · REDIS_PORT (6379)
#   MINIO_ENDPOINT (minio) · MINIO_PORT (9000) · MINIO_USE_SSL (false)
#   MINIO_BUCKET_ATTACHMENTS (axion-attachments) · MINIO_BUCKET_REPORTS (axion-reports)
#   MINIO_BUCKET_TEMPLATES (axion-templates)
#   JWT_ACCESS_TTL (15m) · JWT_REFRESH_TTL (30d)
#   CONSOLE_WEBHOOK_TOLERANCE_SECONDS (300)
#   PGBACKREST_STANZA (axion) · PGBACKREST_REPO_PATH (/var/lib/pgbackrest)
#   BACKUP_RETENTION_DAYS (30)
#   AXION_R2_PREFIXE (staging)           préfixe d'objets dans le bucket R2
#   AXION_R2_VERIFIER_RELECTURE (oui)    relire depuis R2 et comparer le SHA-256
#   LLM_COST_CAP_PER_MISSION_EUR (50)
#   ALERT_DISK_USAGE_PERCENT (80) · ALERT_LLM_JOB_MAX_MINUTES (5)
#   ALERT_CERT_EXPIRY_DAYS (15) · ALERT_SYNC_SILENT_HOURS (24)
#   SEED_ADMIN_FULL_NAME (Administrateur Axion)
#   VITE_APP_ENV (staging) · VITE_APP_VERSION (staging)
#
#   ⚠️ PGBACKREST_STANZA : si vous la changez, changez AUSSI le nom de section
#      `[axion]` dans infra/pgbackrest/pgbackrest.conf — un nom de section ne
#      peut pas venir de l'environnement.
#
# C. FACULTATIVES ET VIDES PAR DÉFAUT. Le staging fonctionne sans elles ; les
#    fonctions correspondantes sont alors inertes.
#
#   ANTHROPIC_API_KEY · DOCXTEMPLATER_LICENSE
#   CONSOLE_WEBHOOK_SECRET_PREVIOUS (rotation de secret)
#   TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID
#   SMTP_HOST · SMTP_PORT (587) · SMTP_USER · SMTP_PASSWORD · SMTP_FROM
#
# D. VARIABLES QUI NE SONT VOLONTAIREMENT PAS DÉCLARÉES ICI
#
#   CADDY_ACME_EMAIL   : aucun ACME dans cette pile (Traefik fait le TLS). Le
#                        Caddyfile a un repli syntaxique, jamais utilisé.
#   VITE_API_BASE_URL  : ce N'EST PAS un `ARG` des Dockerfiles de `field`/`hq`.
#                        La déclarer n'aurait AUCUN effet sur le build. Le front
#                        appelle l'API sur la même origine (11 §2).
#   GHCR_OWNER, IMAGE_TAG : aucune image n'est tirée d'un registre (voir `api`).
#
# =============================================================================

name: axion-audit-coolify

# -----------------------------------------------------------------------------
# Fragments réutilisables
# -----------------------------------------------------------------------------
x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

# Image PostgreSQL de cette pile — DEUX services la partagent : le serveur
# lui-même et le job `createstanza`, qui a besoin du binaire `pgbackrest` et de
# `/etc/pgbackrest/pgbackrest.conf` embarqué dedans. L'ancre existe pour qu'ils
# ne puissent pas diverger : une stanza créée avec une configuration pgBackRest
# différente de celle qu'utilise `archive_command` serait une stanza inutilisable,
# et rien ne le dirait avant le jour de la restauration.
#
# Chemins relatifs à la RACINE DU DÉPÔT (encadré « RÉPERTOIRE DE PROJET »).
#
# CONTEXTE `./infra` ET NON `./infra/postgres` — ce n'est pas un excès de portée.
# L'étape `config-embarquee` doit copier des fichiers qui ne vivent pas dans le
# même dossier : `postgres/postgresql.custom.conf`, `postgres/*.sh` et
# `pgbackrest/pgbackrest.conf`. Le dernier est hors de `infra/postgres/`, donc le
# contexte doit remonter d'un cran.
#
# `target:` OBLIGATOIRE : l'étape par défaut du Dockerfile est l'image NUE
# qu'utilisent les piles lancées à la main, celles qui montent leur configuration.
# Sans cette cible, le conteneur démarrerait sans aucun fichier de configuration
# et sans les deux scripts d'exploitation.
#
# Tag DISTINCT de `axion-audit-postgres:16` (piles à la main) : ces deux images
# n'ont pas le même contenu, elles ne doivent pas partager un nom.
x-postgres-image: &image-postgres
  build:
    context: ./infra
    dockerfile: postgres/Dockerfile
    target: config-embarquee
  image: axion-audit-postgres:16-coolify

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — image CONSTRUITE localement (infra/postgres/Dockerfile) pour
  # embarquer pgBackRest (02 §11.4). Identique à infra/docker-compose.yml, sans
  # la publication de port : en staging la base n'est jamais joignable depuis
  # l'hôte (06 §10.3).
  # ---------------------------------------------------------------------------
  postgres:
    <<: [*restart, *logging, *image-postgres]
    # Config personnalisée hors PGDATA : hba_file/ident_file doivent alors être
    # désignés explicitement (ils ne sont plus déduits du répertoire de données).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.custom.conf
      - -c
      - hba_file=/var/lib/postgresql/data/pg_hba.conf
      - -c
      - ident_file=/var/lib/postgresql/data/pg_ident.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axion_audit}
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?variable obligatoire, mot de passe PostgreSQL}
      TZ: ${TZ:-UTC}
      # Horodatages UTC en base (invariant 5).
      PGTZ: ${TZ:-UTC}
      # pgBackRest lit ses options dans l'environnement (PGBACKREST_<OPTION>) :
      # la passphrase du dépôt n'apparaît JAMAIS dans un fichier versionné.
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-axion}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO_PATH:-/var/lib/pgbackrest}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?variable obligatoire, passphrase du depot pgBackRest}
      PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-30}
      # Rôle et base de connexion : l'image officielle initialise le cluster avec
      # POSTGRES_USER/POSTGRES_DB, le rôle `postgres` n'existe pas.
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-axion}
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-axion_audit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # CIBLE LITTÉRALE, PAS INTERPOLÉE — ET CE N'EST PAS UN OUBLI.
      # Coolify REFUSE toute définition de volume contenant `${` : son analyseur
      # (`parsers.php:347`) y voit une substitution shell et rejette le
      # déploiement entier avec « Invalid volume target: contains forbidden
      # character '${' ». C'est exactement ce qui a fait échouer le premier
      # déploiement (wzigah3ummdyv47uukgop9lt, 2026-08-28 04h14).
      # `PGBACKREST_REPO_PATH` reste fournie au PROCESSUS ci-dessus — pgBackRest
      # en a besoin pour trouver son dépôt — mais le point de montage, lui, est
      # figé. Si l'on change l'un, il faut changer l'autre : ils ne sont plus liés
      # par le fichier, et rien ne le vérifie.
      - pgbackrest_repo:/var/lib/pgbackrest
      # SOCKET UNIX DE POSTGRESQL, PARTAGÉ AVEC LE SERVICE `sauvegarde`.
      #
      # POURQUOI. `pgbackrest backup` doit parler au serveur (`pg_backup_start` /
      # `pg_backup_stop`), et pgBackRest ne sait le joindre QUE par socket UNIX :
      # aucune option ne lui fait ouvrir une connexion TCP vers un autre hôte
      # (`pg1-host` suppose SSH ou TLS). Un conteneur de sauvegarde séparé n'a
      # donc qu'une voie : ce répertoire. C'est la différence avec `createstanza`,
      # qui s'en passe grâce à `--no-online` (voir stanza-create.sh).
      #
      # CE QUE ÇA COÛTE, MESURÉ PLUTÔT QUE SUPPOSÉ (2026-08-28, base jetable).
      # Un volume nommé PERSISTE, donc le socket et son fichier de verrou peuvent
      # survivre à la mort du conteneur — et le verrou nomme le PID 1, qui existe
      # toujours dans le conteneur suivant. Les trois cas ont été joués :
      #   arrêt propre  → PostgreSQL retire socket et verrou   → redémarrage OK
      #   `docker kill` → socket et verrou SURVIVENT dans le volume → redémarrage OK
      #   3e démarrage consécutif sur le même volume            → OK
      # PostgreSQL 16 reconnaît le verrou périmé et le remplace. Le risque
      # théorique est réel, il a été vérifié nul ici.
      - postgres_socket:/var/run/postgresql
      # `postgresql.custom.conf` et `pgbackrest.conf` NE SONT PLUS MONTÉS ICI :
      # ils sont EMBARQUÉS DANS L'IMAGE (cible `config-embarquee`). Remettre un
      # `- ./infra/postgres/postgresql.custom.conf:/etc/postgresql/...` redonnerait
      # un RÉPERTOIRE VIDE et rouvrirait la panne du 2026-08-28 — voir l'encadré
      # « CONFIGURATION EMBARQUÉE » en tête de fichier.
    # AUCUNE clé `ports:` — voir l'en-tête. La base n'est joignable que par le
    # réseau interne `axion`.
    # ┌─────────────────────────────────────────────────────────────────────────┐
    # │ SONDE — CE N'EST PLUS `pg_isready`, ET C'EST LE CŒUR DU CORRECTIF.      │
    # │                                                                         │
    # │ `pg_isready` a affiché `Up 46 minutes (healthy)` et `RestartCount = 0`  │
    # │ pendant que ce cluster se RÉINITIALISAIT 275 FOIS (2026-08-28). Il ne   │
    # │ mentait pas sur ce qu'il mesure — il mesurait « la base accepte-t-elle  │
    # │ une connexion À CET INSTANT », ce qui reste vrai entre deux             │
    # │ réinitialisations espacées de dix secondes. Le postmaster (PID 1) ne    │
    # │ meurt jamais : Docker n'a donc rien à redémarrer et rien à signaler.    │
    # │                                                                         │
    # │ `axion-healthcheck` vérifie trois propriétés — la stanza existe, le     │
    # │ checkpointer (tué à CHAQUE réinitialisation) est vieux d'au moins 60 s, │
    # │ l'archivage WAL n'est pas en échec. CE QU'ELLE NE DÉTECTE PAS est écrit │
    # │ en toutes lettres en tête de infra/postgres/healthcheck.sh : lisez-le   │
    # │ avant de vous y fier. Elle est embarquée dans l'image (Coolify ne monte │
    # │ rien) — la MODIFIER N'A AUCUN EFFET SANS RECONSTRUCTION DE L'IMAGE.     │
    # │                                                                         │
    # │ `start_period: 150s` N'EST PAS UN DÉLAI DE 150 s AVANT LE DÉMARRAGE DE  │
    # │ L'API : le conteneur passe `healthy` dès la PREMIÈRE réponse OK, soit   │
    # │ ~60-70 s après le démarrage (le temps que le checkpointer atteigne le   │
    # │ seuil d'âge). La fenêtre couvre ce délai plus la marge d'un `initdb` sur│
    # │ une machine chargée — sans elle, un premier démarrage lent compterait   │
    # │ ses échecs et le conteneur naîtrait `unhealthy`.                        │
    # └─────────────────────────────────────────────────────────────────────────┘
    healthcheck:
      test: ['CMD', 'axion-healthcheck']
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 150s
    networks: [axion]
    # Swap NEUTRALISÉ (memswap_limit == mem_limit) : voir l'encadré « DEUX
    # MÉCANISMES DE PLAFOND » en tête de fichier. Les trois valeurs mémoire
    # d'un service sont TOUJOURS identiques.
    mem_limit: 1024M
    memswap_limit: 1024M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ---------------------------------------------------------------------------
  # createstanza — job ONE-SHOT et IDEMPOTENT : la stanza pgBackRest, sans
  # laquelle `archive_command` échoue à chaque segment WAL. Même forme et même
  # garantie que `createbuckets` ci-dessous.
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ POURQUOI CE SERVICE EXISTE. `stanza-create` était une ÉTAPE MANUELLE     │
  # │ (infra/README.md §5.3). Elle n'a jamais été exécutée sur ce staging, et  │
  # │ rien ne pouvait le montrer : la base s'affichait `healthy`. Mesuré le    │
  # │ 2026-08-28 : dépôt pgBackRest VIDE, 0 WAL archivé, `archive-push` en     │
  # │ 103, et 275 réinitialisations complètes du cluster en 46 minutes — la    │
  # │ première SIX SECONDES après le démarrage du conteneur.                   │
  # │ Une étape manuelle oubliée sur un staging sera oubliée en production ;   │
  # │ c'est la conception qui était fautive, pas son exécution.                │
  # └─────────────────────────────────────────────────────────────────────────┘
  #
  # POURQUOI `service_started` ET NON `service_healthy`. La sonde de `postgres`
  # exige désormais que la stanza EXISTE : attendre `service_healthy` ici
  # verrouillerait les deux services l'un sur l'autre pour toujours. Le job
  # démarre donc avec le conteneur et attend lui-même le seul fichier dont il a
  # besoin — `global/pg_control`, écrit par `initdb` (voir stanza-create.sh).
  #
  # POURQUOI IL MONTE LE VOLUME DE DONNÉES. `pgbackrest stanza-create --no-online`
  # lit la version et l'identifiant système du cluster dans `global/pg_control`.
  # C'est aussi ce qui lui évite d'avoir à parler au serveur : pgBackRest ne se
  # connecte à PostgreSQL que par SOCKET UNIX, ce qu'un conteneur séparé ne peut
  # pas faire sans partager `/var/run/postgresql` — un volume de plus, et un
  # socket persistant. Le détail et les limites de ce choix sont en tête de
  # infra/postgres/stanza-create.sh.
  #
  # `user: postgres` : le volume de données est en 0700 postgres, et le dépôt
  # doit rester écrit par le MÊME utilisateur que celui qui exécute
  # `archive-push` — sinon la première poussée échouerait sur les permissions.
  # ---------------------------------------------------------------------------
  createstanza:
    <<: [*logging, *image-postgres]
    restart: 'no' # exception assumée : job one-shot, pas un service
    user: postgres
    depends_on:
      postgres:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
      # Les MÊMES valeurs que le serveur : la stanza est créée pour le dépôt et
      # le cluster que `archive_command` utilisera. Une divergence ici produirait
      # une stanza valide et pourtant inutilisable.
      PGDATA: /var/lib/postgresql/data
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-axion}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO_PATH:-/var/lib/pgbackrest}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?variable obligatoire, passphrase du depot pgBackRest}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-axion}
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-axion_audit}
    entrypoint: ['/usr/local/bin/axion-stanza-create']
    # -------------------------------------------------------------------------
    # PAS DE `command:` ICI — ET C'EST UNE CONVENTION COOLIFY, PAS UN OUBLI.
    #
    # La version précédente écrivait `command: []` pour NEUTRALISER le
    # `CMD ["postgres"]` hérité de l'image officielle. C'est du Compose
    # parfaitement valide : `docker compose config` l'accepte en local.
    #
    # Mais Coolify NE DÉPLOIE PAS CE FICHIER, IL LE RÉÉCRIT — et sa réécriture
    # transforme la séquence vide en TABLE vide. Lu dans sa base
    # (`applications.docker_compose`) :
    #
    #     command: {  }
    #
    # que le schéma refuse, avec un message qui n'aide personne :
    # « services.createstanza.command must be a null ». TROIS DÉPLOIEMENTS ONT
    # ÉCHOUÉ LÀ-DESSUS, chacun en 14 secondes, pendant que la pile précédente
    # continuait de tourner et de répondre 200 — c'est-à-dire dans les
    # conditions exactes où l'on croit avoir déployé.
    #
    # Le `CMD ["postgres"]` hérité est donc simplement passé en argument à notre
    # point d'entrée. `stanza-create.sh` NE LIT AUCUN ARGUMENT (ni `$@`, ni `$1`,
    # ni `$#`) : l'argument est inerte. On échange une neutralisation explicite
    # contre une propriété du script — moins élégant, mais c'est la seule des
    # deux formes qui survit au déploiement.
    # -------------------------------------------------------------------------
    volumes:
      # CIBLES LITTÉRALES, PAS INTERPOLÉES — Coolify refuse tout `${` dans une
      # définition de volume (voir le volume homologue du service `postgres`).
      - postgres_data:/var/lib/postgresql/data
      - pgbackrest_repo:/var/lib/pgbackrest
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 128M
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Redis 7 — files BullMQ. Mot de passe par l'environnement, jamais en argument
  # littéral (il apparaîtrait dans `docker inspect` et dans la ligne de commande).
  # ---------------------------------------------------------------------------
  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    # Séquence de BLOC, pas de collection en flux multi-lignes : `check:compose-coolify`
    # et `check:isolation-reseau` embarquent un lecteur YAML qui est un sous-ensemble
    # écrit à la main (11 §1 fige les dépendances, aucun analyseur YAML n'y figure) et
    # qui refuse un `[` ouvert sur une ligne et fermé sur une autre. La forme ci-dessous
    # est STRICTEMENT équivalente pour Compose, et c'est celle que Prettier conserve.
    command:
      - 'sh'
      - '-c'
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?variable obligatoire, mot de passe Redis}
      TZ: ${TZ:-UTC}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 256M
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # MinIO — INTERDICTION 11 §2 : jamais exposé publiquement. Aucun port publié,
  # pas même la console d'administration :9001 (confort de debug LOCAL, il n'a
  # rien à faire sur une machine qui héberge un site de production). Tout
  # téléchargement passe par l'API, en flux, avec RBAC.
  # ---------------------------------------------------------------------------
  minio:
    <<: [*restart, *logging]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?variable obligatoire, compte racine MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?variable obligatoire, mot de passe racine MinIO}
      TZ: ${TZ:-UTC}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 512M
    memswap_limit: 512M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # createbuckets — job `mc` ONE-SHOT et IDEMPOTENT : les 3 buckets privés et
  # l'utilisateur applicatif RESTREINT (moindre accès : l'app n'utilise JAMAIS
  # root). `$$` = échappement de l'interpolation Compose → la valeur reste dans
  # le conteneur, jamais dans ce fichier ni dans la ligne de commande.
  # ---------------------------------------------------------------------------
  createbuckets:
    <<: [*logging]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no' # exception assumée : job one-shot, pas un service
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?variable obligatoire, compte racine MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?variable obligatoire, mot de passe racine MinIO}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?variable obligatoire, compte applicatif MinIO}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?variable obligatoire, secret du compte applicatif MinIO}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-axion-attachments}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-axion-reports}
      MINIO_BUCKET_TEMPLATES: ${MINIO_BUCKET_TEMPLATES:-axion-templates}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        mc alias set local "http://minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        # 1. Les 3 buckets, privés (aucun accès anonyme).
        for b in "$$MINIO_BUCKET_ATTACHMENTS" "$$MINIO_BUCKET_REPORTS" "$$MINIO_BUCKET_TEMPLATES"; do
          mc mb --ignore-existing "local/$$b"
          mc anonymous set none "local/$$b"
        done

        # 2. Politique de moindre accès, limitée à ces 3 buckets.
        cat > /tmp/axion-app-policy.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": [
                "arn:aws:s3:::$$MINIO_BUCKET_ATTACHMENTS",
                "arn:aws:s3:::$$MINIO_BUCKET_REPORTS",
                "arn:aws:s3:::$$MINIO_BUCKET_TEMPLATES"
              ]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListMultipartUploadParts", "s3:AbortMultipartUpload"],
              "Resource": [
                "arn:aws:s3:::$$MINIO_BUCKET_ATTACHMENTS/*",
                "arn:aws:s3:::$$MINIO_BUCKET_REPORTS/*",
                "arn:aws:s3:::$$MINIO_BUCKET_TEMPLATES/*"
              ]
            }
          ]
        }
        JSON

        # 3. Utilisateur applicatif + politique (rejouable sans dégât).
        mc admin user info local "$$MINIO_ACCESS_KEY" >/dev/null 2>&1 \
          || mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc admin policy rm local axion-app >/dev/null 2>&1 || true
        mc admin policy create local axion-app /tmp/axion-app-policy.json
        mc admin policy attach local axion-app --user "$$MINIO_ACCESS_KEY" >/dev/null 2>&1 || true
        rm -f /tmp/axion-app-policy.json

        echo "createbuckets: buckets et utilisateur applicatif restreint prets."
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 128M
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # sauvegarde — LES DEUX MOITIÉS DU CRITÈRE L0, PLANIFIÉES.
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ POURQUOI CE SERVICE EXISTE. Le 2026-08-28, ce staging avait une stanza   │
  # │ pgBackRest valide, un dépôt chiffré, un archivage WAL sans un seul       │
  # │ échec — et AUCUNE sauvegarde complète : `status: error (no valid         │
  # │ backups)`. SANS SAUVEGARDE COMPLÈTE, LES WAL ARCHIVÉS NE SE REJOUENT SUR │
  # │ RIEN : la chaîne avait toutes les apparences d'une chaîne de sauvegarde  │
  # │ et rien de restaurable au bout. Côté MinIO, il n'y avait pas même        │
  # │ d'apparence : aucune sauvegarde du tout.                                 │
  # │                                                                          │
  # │ `pgbackrest backup` n'était appelé par RIEN. Une commande qu'un humain   │
  # │ doit taper sera oubliée — c'est ce qui venait d'arriver à                │
  # │ `stanza-create`, mécanisé par le job `createstanza` ci-dessus. Même      │
  # │ geste ici, un cran plus loin : la sauvegarde devient un service de la    │
  # │ pile, versionné, planifié, dont l'échec se voit.                         │
  # └─────────────────────────────────────────────────────────────────────────┘
  #
  # POURQUOI UN CONTENEUR DE PLANIFICATION, ET PAS LES DEUX AUTRES VOIES.
  #  · BullMQ (déjà dans la pile) : le worker est un runtime Node qui n'a ni
  #    `pgbackrest`, ni le répertoire de données, ni le socket de PostgreSQL. Les
  #    lui donner ouvrirait au code applicatif un accès brut aux fichiers de la
  #    base — une élévation de privilège pour aucun gain.
  #  · Tâches planifiées de Coolify : leur définition vit dans la base de
  #    Coolify, pas dans ce dépôt. Invisible à `git`, absente d'une
  #    reconstruction, et personne ne verrait qu'elle a disparu — exactement le
  #    défaut que ce lot vient de corriger deux fois.
  # Le conteneur, lui, part avec la pile et se lit dans le dépôt.
  #
  # LA COPIE HORS SERVEUR EST BRANCHÉE (Cloudflare R2, bucket dédié, jeton limité
  # à ce seul bucket). Le dépôt pgBackRest et les archives MinIO — DÉJÀ chiffrés
  # au repos, rien n'est rechiffré — partent par `mc mirror` après chaque passe,
  # et deux objets sont RELUS depuis R2 et comparés au SHA-256 de la source :
  # « l'envoi a réussi » ne prouve rien. La rétention distante est portée par le
  # miroir (`--remove` reproduit l'expiration locale), PAS par une règle de cycle
  # de vie Cloudflare — qui vivrait hors de `git`, exactement le défaut que ce lot
  # a corrigé deux fois.
  #
  # CE QU'IL NE COUVRE PAS — écrit ici pour que personne ne s'y fie :
  #  · pile arrêtée = aucune sauvegarde ;
  #  · UN SEUL SITE DISTANT : la seconde copie « hors fournisseur » du 02 §11.4
  #    n'existe pas. R2 indisponible = il ne reste que le VPS ;
  #  · aucune alerte sortante : un échec se lit dans `docker ps` et les journaux,
  #    PAS dans une notification. Personne n'est prévenu aujourd'hui ;
  #  · DEUX CODES DE SORTIE À SAVOIR LIRE — 1 = la sauvegarde n'a pas eu lieu ;
  #    2 = elle a eu lieu et vérifiée, mais elle n'est pas sortie de la machine.
  #    `docker inspect --format '{{.State.ExitCode}}' <conteneur>` ;
  #  · il ne teste pas la restauration (geste distinct, joué à la main, §5.4).
  #
  # `restart: unless-stopped` ET NON `'no'` : contrairement à `createstanza` et
  # `createbuckets`, ce n'est pas un job one-shot mais un service de longue vie.
  # Son échec le fait SORTIR EN CODE NON NUL — Docker le redémarre avec son
  # recul exponentiel, et l'état `Restarting` devient le signal. Un service qui
  # resterait `Up` en échouant chaque nuit serait le garde-fou menteur que ce lot
  # a passé sa journée à démonter.
  # ---------------------------------------------------------------------------
  sauvegarde:
    <<: [*restart, *logging, *image-postgres]
    # Le dépôt pgBackRest et le volume d'archives appartiennent à `postgres` :
    # c'est le même utilisateur que celui qui exécute `archive-push` depuis le
    # serveur. Deux propriétaires sur un même dépôt seraient une panne de
    # permissions différée jusqu'à la nuit.
    user: postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      # LES MÊMES VALEURS QUE LE SERVEUR. Une divergence produirait des
      # sauvegardes valides dans un dépôt que `archive_command` n'alimente pas.
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:-axion}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO_PATH:-/var/lib/pgbackrest}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?variable obligatoire, passphrase du depot pgBackRest}
      PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-30}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-axion}
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-axion_audit}
      # Chiffrement des archives MinIO. Sans passphrase le script REFUSE de
      # démarrer : une archive de pièces jointes d'audit en clair sur un disque
      # partagé ne se rattrape pas après coup.
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?variable obligatoire, passphrase des archives chiffrees}
      # RÉTENTION MinIO alignée sur celle de PostgreSQL, et ce n'est pas
      # cosmétique : une restauration PostgreSQL de J-25 désignerait des pièces
      # jointes qu'aucune archive MinIO ne contiendrait plus si MinIO était gardé
      # moins longtemps. Deux rétentions, c'est une restauration à moitié possible.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Créneau quotidien en UTC (invariant 5) et jour de la complète
      # (`date +%w`, 0 = dimanche) : complète hebdomadaire + incrémentale
      # quotidienne, comme le demande 02 §11.4.
      AXION_SAUVEGARDE_HEURE: ${AXION_SAUVEGARDE_HEURE:-02:30}
      AXION_SAUVEGARDE_JOUR_COMPLETE: ${AXION_SAUVEGARDE_JOUR_COMPLETE:-0}
      # Plafond du volume d'archives. La machine est PARTAGÉE : au-delà, le
      # service échoue bruyamment plutôt que de remplir le disque du voisin.
      AXION_ARCHIVES_MAX_MO: ${AXION_ARCHIVES_MAX_MO:-20480}
      # ┌───────────────────────────────────────────────────────────────────┐
      # │ COPIE HORS SERVEUR — LE DERNIER POINT ROUGE DE LA PORTE L0.       │
      # │                                                                   │
      # │ Sans ces quatre variables, le dépôt pgBackRest et les archives    │
      # │ MinIO vivent sur le disque qu'ils protègent : perdre le VPS,      │
      # │ c'est perdre les données ET leurs sauvegardes. La règle 3-2-1 du  │
      # │ 02 §11.4 et l'invariant 8 ne sont alors pas tenus.                │
      # │                                                                   │
      # │ ELLES SONT DÉCLARÉES ICI, SERVICE PAR SERVICE : ce fichier dit    │
      # │ quel service a besoin de quoi, et un conteneur lancé hors de      │
      # │ Coolify (pile à la main, test jetable) ne reçoit que ce qui est   │
      # │ écrit ici. C'est aussi la seule trace, dans `git`, du fait que le │
      # │ service `sauvegarde` dépend de ces quatre valeurs.                │
      # │                                                                   │
      # │ ⚠️ CE QUE CETTE DÉCLARATION N'OBTIENT PAS — MESURÉ, PAS SUPPOSÉ   │
      # │ (2026-08-28, après le redéploiement de 10h02) : sous Coolify,     │
      # │ CE N'EST PAS UN CLOISONNEMENT. Coolify injecte le `.env` ENTIER   │
      # │ de l'application dans TOUS les conteneurs, indépendamment de ce   │
      # │ que ce fichier déclare — relevé : les quatre `BACKUP_R2_*` sont   │
      # │ lisibles dans le conteneur `api`, qui ne les demande pas. Le      │
      # │ moindre accès sur ce jeton n'existe donc PAS aujourd'hui ; ce qui │
      # │ le limite est la portée du jeton lui-même (un seul bucket,        │
      # │ lecture/écriture d'objets), pas la topologie de la pile.          │
      # │                                                                   │
      # │ `:?` PLUTÔT QU'UNE VALEUR PAR DÉFAUT — délibéré. Une variable     │
      # │ manquante fait ÉCHOUER LE DÉPLOIEMENT en nommant la variable,     │
      # │ pendant que la pile précédente continue de tourner. C'est très    │
      # │ préférable à un service de sauvegarde qui démarre et n'expédie    │
      # │ rien : la première panne serait alors invisible jusqu'au jour où  │
      # │ l'on cherche la copie distante.                                   │
      # │                                                                   │
      # │ AUCUNE VALEUR N'EST ÉCRITE ICI (02 §30.4-1/5), et le script ne    │
      # │ les journalise jamais : il les vérifie PAR LEUR NOM et par la     │
      # │ forme de leur contenu.                                            │
      # └───────────────────────────────────────────────────────────────────┘
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:?variable obligatoire, bucket R2 dedie aux sauvegardes}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?variable obligatoire, endpoint S3 du compte R2}
      BACKUP_R2_ACCESS_KEY: ${BACKUP_R2_ACCESS_KEY:?variable obligatoire, identifiant du jeton R2}
      BACKUP_R2_SECRET_KEY: ${BACKUP_R2_SECRET_KEY:?variable obligatoire, secret du jeton R2}
      # Préfixe d'objets dans le bucket : il sépare les environnements qui
      # partageraient la même destination. Sans lui, deux piles expédiant côte à
      # côte se mirroiteraient l'une l'autre, et le `--remove` du miroir
      # transformerait la collision en suppression.
      AXION_R2_PREFIXE: ${AXION_R2_PREFIXE:-staging}
      # Relecture de contrôle : chaque passe retélécharge deux objets depuis R2
      # et compare leur SHA-256 à la source. « L'envoi a réussi » ne prouve rien.
      # L'egress R2 est facturé zéro ; seul le temps se paie.
      AXION_R2_VERIFIER_RELECTURE: ${AXION_R2_VERIFIER_RELECTURE:-oui}
      # ┌───────────────────────────────────────────────────────────────────┐
      # │ ALERTE SORTANTE — ET C'EST LE SEUL BLOC DE CE SERVICE EN `:-`.    │
      # │                                                                   │
      # │ `${VAR:-}` ET NON `${VAR:?}`, contrairement aux quatre variables  │
      # │ R2 juste au-dessus, et la différence est un ARBITRAGE, pas une    │
      # │ inattention. Sans destination R2, le service ne peut pas faire son│
      # │ travail : il DOIT empêcher le déploiement. Sans canal d'alerte,   │
      # │ il fait son travail entièrement — il le fait seulement sans       │
      # │ prévenir. Bloquer le déploiement pour ça reviendrait à arrêter la │
      # │ sauvegarde faute de pouvoir annoncer qu'elle a échoué.            │
      # │                                                                   │
      # │ LE BOT N'EXISTE PAS ENCORE (02 §11.3). Ces deux variables sont    │
      # │ donc VIDES aujourd'hui, et c'est le cas nominal : le service      │
      # │ démarre, sauvegarde, expédie, et ÉCRIT AU JOURNAL que la          │
      # │ notification est INACTIVE. Il ne fait pas semblant d'alerter.     │
      # │ Tant qu'elles sont vides, l'invariant 8 (« alerte automatique »)  │
      # │ n'est tenu que par sa moitié VISIBLE : la sonde ci-dessous.       │
      # │                                                                   │
      # │ AUCUNE VALEUR ICI (02 §30.4-1/5). Le script ne les journalise     │
      # │ jamais, pas même tronquées : il les vérifie par leur présence et  │
      # │ par la forme de leur contenu, et il refuse une forme absurde en   │
      # │ nommant la variable, jamais la valeur.                            │
      # └───────────────────────────────────────────────────────────────────┘
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Anti-harcèlement : au plus un message par catégorie et par N heures. Une
      # panne de trois nuits doit produire trois messages, pas trois cents — un
      # canal qui hurle est un canal qu'on met en sourdine, et une sourdine
      # n'alerte plus personne.
      AXION_ALERTE_INTERVALLE_H: ${AXION_ALERTE_INTERVALLE_H:-24}
      # Seuil de fraîcheur de la SONDE (voir l'encadré `healthcheck` ci-dessous).
      # 30 h = 24 h de période nominale + 2 h de tolérance de rattrapage + 4 h de
      # marge de durée d'une passe. Le détail de la somme est en tête de
      # infra/postgres/sauvegarde-healthcheck.sh.
      AXION_SAUVEGARDE_SEUIL_ALERTE_H: ${AXION_SAUVEGARDE_SEUIL_ALERTE_H:-30}
    entrypoint: ['/usr/local/bin/axion-sauvegarde']
    # PAS DE `command:` — SEPTIÈME CONVENTION COOLIFY, voir l'encadré du service
    # `createstanza`. `command: []` est du Compose valide mais Coolify le réécrit
    # en table vide `command: {  }`, et le déploiement meurt en 14 secondes sur
    # « must be a null ». Le `CMD ["postgres"]` hérité est passé en argument à
    # notre point d'entrée, qui ne lit aucun argument : il est inerte.
    volumes:
      # CIBLES LITTÉRALES, PAS INTERPOLÉES (convention 3, voir l'en-tête).
      # Le répertoire de données EN LECTURE SEULE : pgBackRest lit les fichiers
      # du cluster, il n'a aucune raison de pouvoir les écrire.
      - postgres_data:/var/lib/postgresql/data:ro
      - pgbackrest_repo:/var/lib/pgbackrest
      # Le socket du serveur — la seule voie de pgBackRest vers PostgreSQL.
      - postgres_socket:/var/run/postgresql
      # Les données MinIO EN LECTURE SEULE. On archive le VOLUME et non un
      # `mc mirror` : cette voie restitue aussi `.minio.sys` (politiques d'accès,
      # versioning, comptes), tient dans un seul conteneur — l'image `minio/mc`
      # n'a ni `tar`, ni `gpg`, ni `openssl` (mesuré) — et n'écrit jamais de
      # copie EN CLAIR sur le disque. Les deux voies ont été jouées le
      # 2026-08-28 ; le raisonnement complet est en tête de sauvegarde.sh.
      - minio_data:/minio-donnees:ro
      - sauvegarde_archives:/sauvegarde
    # ┌─────────────────────────────────────────────────────────────────────────┐
    # │ SONDE — CE SERVICE N'EN AVAIT AUCUNE, ET C'EST LE DÉFAUT QUE CE BLOC    │
    # │ CORRIGE. Relevé le 2026-08-28, `docker ps` :                            │
    # │                                                                         │
    # │     postgres-…      Up 27 minutes (healthy)                             │
    # │     minio-…         Up 27 minutes (healthy)                             │
    # │     sauvegarde-…    Up 26 minutes            ← RIEN                     │
    # │                                                                         │
    # │ `Up` ne dit pas « la copie hors serveur est sortie cette nuit » : il dit │
    # │ « le PID 1 n'est pas mort ». Or ce service dort 23 h sur 24 — il est    │
    # │ donc `Up` et inutile la plupart du temps, et les deux états se           │
    # │ ressemblent trop pour être distingués par quelqu'un de pressé.          │
    # │                                                                         │
    # │ CE QUE LA SONDE AJOUTE, ET CE QU'ELLE N'AJOUTE PAS. Une passe qui       │
    # │ ÉCHOUE fait déjà sortir le service en code non nul : Docker le           │
    # │ redémarre et `Restarting` est un vrai signal — que la sonde ne remplace │
    # │ pas, Docker n'exécutant pas de sonde sur un conteneur en redémarrage.   │
    # │ Ce que la sonde attrape est l'autre panne, la SILENCIEUSE : la passe    │
    # │ qui ne revient JAMAIS (un `mc` bloqué sur une socket à moitié ouverte,  │
    # │ un `pgbackrest` en attente de verrou). Le processus est vivant, le code │
    # │ de sortie n'arrive pas, Docker n'a rien à redémarrer, et `docker ps`    │
    # │ affiche `Up 6 days` — pendant que plus rien ne sort de la machine.      │
    # │                                                                         │
    # │ ELLE LIT DEUX MARQUEURS, RIEN D'AUTRE : `.derniere-passe` et            │
    # │ `.derniere-expedition`, écrits chacun APRÈS vérification de sa moitié.  │
    # │ Aucun réseau, aucune connexion à la base, aucun appel à `mc` : une      │
    # │ sonde qui interroge un service distant peut pendre, et une sonde qui    │
    # │ pend ment par omission. CE QU'ELLE NE PROUVE PAS — et notamment         │
    # │ qu'elle est MUETTE si la machine entière est morte — est écrit en       │
    # │ toutes lettres en tête de infra/postgres/sauvegarde-healthcheck.sh :    │
    # │ lisez-le avant de vous y fier. Elle est embarquée dans l'image (Coolify │
    # │ ne monte rien) — LA MODIFIER N'A AUCUN EFFET SANS RECONSTRUCTION.       │
    # │                                                                         │
    # │ `interval: 5m` : la question posée est quotidienne, la sonder toutes    │
    # │ les dix secondes n'apprendrait rien et remplirait le journal.           │
    # │ `start_period: 30m` : au PREMIER démarrage il n'existe aucun marqueur   │
    # │ et le service lance aussitôt une passe. Le conteneur reste `starting`   │
    # │ le temps qu'elle aboutisse. Passé ce délai, il devient `unhealthy` avec │
    # │ le message « AUCUNE expédition n'a JAMAIS réussi » — qui est alors      │
    # │ EXACT, et volontairement distinct de « l'expédition a CESSÉ ».          │
    # └─────────────────────────────────────────────────────────────────────────┘
    #
    # DURÉES EN SECONDES, comme partout dans ce fichier. `5m` et `30m` sont du
    # Compose valide, mais Coolify RÉÉCRIT ce fichier avant de le déployer et ce
    # lot a déjà perdu trois déploiements sur une forme que sa réécriture ne
    # rendait pas à l'identique (voir l'encadré `command:` du service
    # `createstanza`). On n'introduit pas une notation nouvelle sur le chemin
    # d'un composant qui reformate — on écrit la forme déjà éprouvée ici.
    healthcheck:
      test: ['CMD', 'axion-sauvegarde-healthcheck']
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 1800s
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    # 512 Mo : `pgbackrest` avec `process-max=2` et compression zstd, plus le
    # tube `tar | zstd | gpg` de l'archive MinIO. Au-dessus des 128 Mo des jobs
    # one-shot, très en dessous du serveur lui-même.
    mem_limit: 512M
    memswap_limit: 512M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # API Fastify — CONSTRUITE DEPUIS LE DÉPÔT, cible `runtime`.
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ POURQUOI ON NE TIRE PAS L'IMAGE DE GHCR — CHOIX ASSUMÉ.                 │
  # │ docker-compose.staging.yml et .prod.yml tirent `ghcr.io/…` : c'est le   │
  # │ déploiement par SSH, où la CI a poussé l'image et où le serveur détient │
  # │ un jeton de lecture du registre. Ici, RIEN DE TOUT CELA :               │
  # │   · les paquets GHCR du dépôt sont PRIVÉS ;                             │
  # │   · `axionia-web` n'a pas de `docker login ghcr.io` et Coolify ne lui   │
  # │     en fournit pas ;                                                    │
  # │   · un `pull` échouerait donc à chaque déploiement.                     │
  # │ On construit sur le serveur. Le coût est réel et il faut le connaître : │
  # │ la construction consomme CPU, RAM et disque HORS des plafonds           │
  # │ `deploy.resources.limits` ci-dessous, sur la machine qui héberge        │
  # │ axion-ia.com. Ne pas déployer pendant une pointe de trafic.             │
  # └─────────────────────────────────────────────────────────────────────────┘
  #
  # Moindre accès : PAS d'ANTHROPIC_API_KEY ici, elle n'existe que dans le worker.
  # ---------------------------------------------------------------------------
  api:
    <<: [*restart, *logging]
    build:
      # `.` = RACINE DU DÉPÔT, pas `infra/..` (encadré « RÉPERTOIRE DE PROJET »).
      # `dockerfile:` reste, lui, relatif au `context:` — donc inchangé.
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: axion-audit-api:coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      # Redondant avec `postgres: service_healthy` — la sonde de la base exige
      # déjà que la stanza existe — et gardé EXPRÈS, pour le diagnostic. Sans
      # lui, une stanza qui échoue se lit « postgres unhealthy, délai dépassé » ;
      # avec lui, « createstanza exited with code 1 » et le message du script.
      createstanza:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?variable obligatoire, URL publique du staging}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3000}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-axion_audit}
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?variable obligatoire, mot de passe PostgreSQL}
      DATABASE_URL: ${DATABASE_URL:?variable obligatoire, URL PostgreSQL complete}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?variable obligatoire, mot de passe Redis}
      REDIS_URL: ${REDIS_URL:?variable obligatoire, URL Redis complete}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?variable obligatoire, compte applicatif MinIO}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?variable obligatoire, secret du compte applicatif MinIO}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-axion-attachments}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-axion-reports}
      MINIO_BUCKET_TEMPLATES: ${MINIO_BUCKET_TEMPLATES:-axion-templates}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?variable obligatoire, 64 caracteres hex minimum}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?variable obligatoire, distincte de JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?variable obligatoire, cle de chiffrement applicative}
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:?variable obligatoire, URL de la console siege}
      CONSOLE_WEBHOOK_SECRET: ${CONSOLE_WEBHOOK_SECRET:?variable obligatoire, secret de signature des webhooks}
      CONSOLE_WEBHOOK_SECRET_PREVIOUS: ${CONSOLE_WEBHOOK_SECRET_PREVIOUS:-}
      CONSOLE_WEBHOOK_TOLERANCE_SECONDS: ${CONSOLE_WEBHOOK_TOLERANCE_SECONDS:-300}
      ALERT_SYNC_SILENT_HOURS: ${ALERT_SYNC_SILENT_HOURS:-24}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?variable obligatoire, compte administrateur initial}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?variable obligatoire, mot de passe administrateur initial}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-Administrateur Axion}
    # AUCUN volume : l'image `runtime` est autosuffisante (pas de code monté).
    # AUCUN port publié : Caddy est le seul à joindre l'API, par le réseau interne.
    healthcheck:
      # Sonde HTTP sur la route de santé, sans outil externe (Node 22 = fetch natif).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.API_PORT||'3000')+'/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      # ┌───────────────────────────────────────────────────────────────────┐
      # │ ALIAS `axion-api` — OBLIGATOIRE, NE PAS RENOMMER.                 │
      # │ Le Caddyfile écrit `reverse_proxy axion-api:{$API_PORT}` dans son │
      # │ PREMIER bloc de site, et son en-tête interdit explicitement le    │
      # │ nom court `api` : ce nom existe des deux côtés d'un Caddy         │
      # │ multi-réseaux et résoudrait de façon NON DÉTERMINISTE. Le         │
      # │ Caddyfile n'est pas modifiable depuis ce fichier — c'est donc à   │
      # │ l'alias de s'y conformer, pas l'inverse.                          │
      # └───────────────────────────────────────────────────────────────────┘
      axion:
        aliases: [axion-api]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 768M
    memswap_limit: 768M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # ---------------------------------------------------------------------------
  # Worker BullMQ — CONSTRUIT DEPUIS LE DÉPÔT (même motif que l'API), cible
  # `runtime`. Seul conteneur à détenir ANTHROPIC_API_KEY ; porte aussi les
  # canaux d'alerte. Il n'expose AUCUN HTTP et ne touche PAS le réseau du proxy.
  # ---------------------------------------------------------------------------
  worker:
    <<: [*restart, *logging]
    build:
      # `.` = RACINE DU DÉPÔT (encadré « RÉPERTOIRE DE PROJET »).
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    image: axion-audit-worker:coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      # Voir le même bloc dans `api` : redondance de DIAGNOSTIC, volontaire.
      createstanza:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?variable obligatoire, URL publique du staging}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-axion_audit}
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?variable obligatoire, mot de passe PostgreSQL}
      DATABASE_URL: ${DATABASE_URL:?variable obligatoire, URL PostgreSQL complete}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?variable obligatoire, mot de passe Redis}
      REDIS_URL: ${REDIS_URL:?variable obligatoire, URL Redis complete}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?variable obligatoire, compte applicatif MinIO}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?variable obligatoire, secret du compte applicatif MinIO}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-axion-attachments}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-axion-reports}
      MINIO_BUCKET_TEMPLATES: ${MINIO_BUCKET_TEMPLATES:-axion-templates}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?variable obligatoire, cle de chiffrement applicative}
      # Facultatives : sans elles, les fonctions LLM et rapports restent inertes.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_COST_CAP_PER_MISSION_EUR: ${LLM_COST_CAP_PER_MISSION_EUR:-50}
      DOCXTEMPLATER_LICENSE: ${DOCXTEMPLATER_LICENSE:-}
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:?variable obligatoire, URL de la console siege}
      CONSOLE_WEBHOOK_SECRET: ${CONSOLE_WEBHOOK_SECRET:?variable obligatoire, secret de signature des webhooks}
      CONSOLE_WEBHOOK_SECRET_PREVIOUS: ${CONSOLE_WEBHOOK_SECRET_PREVIOUS:-}
      CONSOLE_WEBHOOK_TOLERANCE_SECONDS: ${CONSOLE_WEBHOOK_TOLERANCE_SECONDS:-300}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_DISK_USAGE_PERCENT: ${ALERT_DISK_USAGE_PERCENT:-80}
      ALERT_LLM_JOB_MAX_MINUTES: ${ALERT_LLM_JOB_MAX_MINUTES:-5}
      ALERT_CERT_EXPIRY_DAYS: ${ALERT_CERT_EXPIRY_DAYS:-15}
      ALERT_SYNC_SILENT_HOURS: ${ALERT_SYNC_SILENT_HOURS:-24}
    # PAS DE `healthcheck:` ICI — ET C'EST DÉLIBÉRÉ.
    #
    # Une clé `healthcheck` dans le compose ÉCRASE le `HEALTHCHECK` de l'image.
    # Celui du Dockerfile est la sonde honnête (`dist/sonde-sante.js`) : battement
    # écrit dans Redis toutes les 5 s avec expiration à 20 s, PLUS vérification que
    # ce conteneur-ci est attaché aux CINQ files. On la laisse gouverner.
    #
    # CE QU'IL Y AVAIT ICI, ET POURQUOI IL A DISPARU :
    #     test: ['CMD-SHELL', 'pgrep -f node >/dev/null || exit 1']
    # Cette sonde vérifiait qu'UN processus node existe. Or le lanceur de
    # développement fait tourner `tsc --watch` à côté du serveur — et `tsc` EST un
    # processus node. Elle était donc verte parce que le COMPILATEUR tournait,
    # pendant que le worker était mort. `docker ps` a annoncé « Up 13 hours
    # (healthy) » sur un worker qui n'avait JAMAIS démarré, depuis le lot L0 — et
    # le critère « docker compose up = stack complète » a été coché là-dessus.
    #
    # Le chemin de la sonde DIFFÈRE selon la cible (`apps/worker/dist/…` en dev,
    # `dist/…` en runtime) : le Dockerfile le sait, un copier-coller ici serait
    # faux. Raison de plus pour ne pas la redéclarer.
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 768M
    memswap_limit: 768M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # ---------------------------------------------------------------------------
  # PWA terrain — JOB ONE-SHOT, PAS UN SERVEUR.
  # La cible `runtime` du Dockerfile copie `dist` dans /statique, puis son CMD
  # déverse /statique dans /sortie et SORT en 0. Trois réglages qui vont
  # ensemble et qu'il ne faut pas dissocier :
  #   · `restart: "no"` — redémarrer un job terminé le ferait boucler ;
  #   · AUCUN healthcheck — un conteneur sorti n'a pas de vivacité à sonder, et
  #     une sonde qui ne peut pas réussir bloque tout ce qui en dépend ;
  #   · Caddy en dépend par `service_completed_successfully`, jamais `_healthy`.
  # ---------------------------------------------------------------------------
  field:
    <<: [*logging]
    build:
      # `.` = RACINE DU DÉPÔT (encadré « RÉPERTOIRE DE PROJET »).
      context: .
      dockerfile: apps/field/Dockerfile
      target: runtime
      args:
        # Injectées dans le bundle Vite. Publiques par construction : elles
        # servent l'écran « À propos » et le diagnostic de version du service
        # worker (§31). Jamais un secret ici — un bundle est lisible par tous.
        VITE_APP_VERSION: ${VITE_APP_VERSION:-staging}
        VITE_APP_ENV: ${VITE_APP_ENV:-staging}
    image: axion-audit-field:coolify
    restart: 'no'
    volumes:
      - field_dist:/sortie
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 256M
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Console siège — JOB ONE-SHOT, mêmes règles que `field` (build en base /hq/).
  # ---------------------------------------------------------------------------
  hq:
    <<: [*logging]
    build:
      # `.` = RACINE DU DÉPÔT (encadré « RÉPERTOIRE DE PROJET »).
      context: .
      dockerfile: apps/hq/Dockerfile
      target: runtime
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-staging}
        VITE_APP_ENV: ${VITE_APP_ENV:-staging}
    image: axion-audit-hq:coolify
    restart: 'no'
    volumes:
      - hq_dist:/sortie
    networks: [axion]
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 256M
    memswap_limit: 256M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Caddy — NOTRE routeur interne, DERRIÈRE le Traefik de Coolify.
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ ADRESSES DE SITE — POURQUOI `:8080` ET `:8081`.                         │
  # │ Le Caddyfile déclare DEUX blocs, {$CADDY_SITE_ADDRESS} et               │
  # │ {$CADDY_STAGING_SITE_ADDRESS}, et n'est pas modifiable depuis ce        │
  # │ fichier. Il faut donc choisir les valeurs, pas la structure.            │
  # │                                                                         │
  # │ CADDY_SITE_ADDRESS = `:8080` — une adresse SANS NOM D'HÔTE fait écouter │
  # │ Caddy en HTTP SIMPLE : il ne tente aucun ACME et ne présente aucun      │
  # │ certificat. C'est exactement ce qu'il faut ici, puisque TLS est terminé │
  # │ par Traefik en amont (DECISIONS.md 2026-08-28). Y mettre le vrai        │
  # │ sous-domaine ferait tenter à Caddy une émission Let's Encrypt qu'il ne  │
  # │ peut pas réussir (il ne détient ni le port 80 ni le port 443) : il      │
  # │ retenterait en boucle pendant que Traefik, lui, sert déjà le vrai       │
  # │ certificat. Un `:8080` nu accepte n'importe quel `Host`, donc le nom de │
  # │ domaine réel n'a pas besoin d'être connu de cette pile.                 │
  # │                                                                         │
  # │ CADDY_STAGING_SITE_ADDRESS = `:8081` — le SECOND bloc route vers        │
  # │ `staging-api` et les racines /srv/staging/*, qui n'existent PAS dans    │
  # │ cette pile (ce sont celles de la pile déployée par SSH). On ne peut pas │
  # │ le supprimer : une adresse de site VIDE empêche Caddy de démarrer. On   │
  # │ le rend donc INOFFENSIF — `:8081` n'est publié nulle part, aucun réseau │
  # │ n'y mène, et Traefik ne connaît que 8080. Le bloc existe, il n'est      │
  # │ jamais atteint. C'est la seule façon de satisfaire le Caddyfile sans le │
  # │ modifier.                                                               │
  # └─────────────────────────────────────────────────────────────────────────┘
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ COMMENT TRAEFIK ATTEINT CE CONTENEUR — ET POURQUOI AUCUN PORT PUBLIÉ.   │
  # │ Une publication `127.0.0.1:8080:8080` NE MARCHERAIT PAS : `coolify-     │
  # │ proxy` est lui-même un conteneur ; il ne voit pas la boucle locale de   │
  # │ l'hôte. Et publier sur `0.0.0.0` ouvrirait notre staging en clair sur   │
  # │ Internet, ce que COHABITATION §5.2 refuse.                              │
  # │ La liaison se fait donc de conteneur à conteneur, par le réseau Docker  │
  # │ du proxy, déclaré `external` plus bas. AUCUN service de cette pile ne   │
  # │ publie de port sur l'hôte — pas même celui-ci.                          │
  # │ Le routeur Traefik (règle Host + certificat) est posé par COOLIFY, à    │
  # │ partir du domaine configuré sur CE service, port 8080. Ce fichier       │
  # │ n'écrit aucun label : deux routeurs pour le même hôte se disputeraient. │
  # └─────────────────────────────────────────────────────────────────────────┘
  # ---------------------------------------------------------------------------
  caddy:
    <<: [*restart, *logging]
    # CONSTRUIT, et non `caddy:2-alpine` tel quel : le Caddyfile et
    # fronts.static.caddy doivent voyager DANS l'image (encadré « CONFIGURATION
    # EMBARQUÉE »). Le Dockerfile part bien de `caddy:2-alpine` (11 §1) et se
    # borne à y déposer ces deux fichiers, en validant la config au build.
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    image: axion-audit-caddy:coolify
    depends_on:
      api:
        condition: service_healthy
      # Les fronts ne deviennent jamais `healthy` : ce sont des jobs. On attend
      # qu'ils AIENT FINI — seule condition qui ait un sens, et qui garantit que
      # les volumes contiennent bien un build avant de servir.
      field:
        condition: service_completed_successfully
      hq:
        condition: service_completed_successfully
    environment:
      # HTTP simple, aucun ACME : voir l'encadré « ADRESSES DE SITE » ci-dessus.
      CADDY_SITE_ADDRESS: ':8080'
      CADDY_STAGING_SITE_ADDRESS: ':8081'
      # Le port interne de l'API est une CONVENTION commune aux environnements
      # (Caddyfile, encadré « PORT INTERNE DE L'API »). Il n'est jamais publié.
      API_PORT: ${API_PORT:-3000}
      # IMPOSÉE, jamais lue dans l'environnement : le mode de service découle de
      # la FORME du déploiement (jobs one-shot + volumes), pas d'un réglage
      # d'exploitant. Une valeur `dev` mettrait tout le site en 502, car aucun
      # serveur Vite n'écoute ici. C'est en outre le SEUL fichier de fronts
      # présent dans l'image : aucune autre valeur ne pourrait s'importer.
      CADDY_FRONT_CONFIG: /etc/caddy/fronts.static.caddy
      TZ: ${TZ:-UTC}
    # Documentaire : le port que Traefik doit viser. `expose` ne publie rien sur
    # l'hôte, il déclare le port au réseau Docker.
    expose:
      - '8080'
    volumes:
      # `Caddyfile` et `fronts.static.caddy` NE SONT PLUS MONTÉS : ils sont
      # EMBARQUÉS DANS L'IMAGE (infra/caddy/Dockerfile). Les remonter ici
      # redonnerait deux RÉPERTOIRES VIDES et Caddy ne démarrerait pas — voir
      # l'encadré « CONFIGURATION EMBARQUÉE » en tête de fichier.
      # `fronts.dev.caddy` n'est PAS embarqué non plus : il proxie des serveurs
      # Vite qui n'existent pas ici. La raison qui justifiait de monter les deux
      # variantes ailleurs — se prémunir d'un {$CADDY_FRONT_CONFIG} mal
      # renseigné — ne vaut plus : cette variable est FIGÉE ci-dessus, elle ne
      # peut pas désigner autre chose que fronts.static.caddy.
      #
      # Seuls des VOLUMES NOMMÉS subsistent : Coolify les gère normalement, ce
      # sont les montages de FICHIERS DU DÉPÔT qui sont impossibles.
      #
      # Racines du snippet (fronts_principal) de fronts.static.caddy, montées en
      # LECTURE SEULE : Caddy sert des fichiers, il n'en écrit aucun.
      # Les racines /srv/staging/* du second bloc ne sont volontairement PAS
      # montées — ce bloc n'est jamais atteint (voir l'encadré ci-dessus).
      - field_dist:/srv/principal/field:ro
      - hq_dist:/srv/principal/hq:ro
      # `caddy_data` ne contient AUCUN certificat dans cette pile (pas d'ACME) ;
      # il porte l'état interne de Caddy. Il n'est pas dans le périmètre du PRA.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Sonde : l'API d'administration Caddy (loopback, jamais exposée) répond
      # avec la configuration chargée.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      axion: {}
      edge:
        # Alias NON AMBIGU sur le réseau PARTAGÉ du proxy, où d'autres piles
        # vivent (axion-ia.com, Docuseal, Plausible…). Compose y ajoute aussi le
        # nom de service `caddy`, qui est générique : c'est CET alias-ci qu'il
        # faut viser si une règle Traefik doit être écrite à la main un jour.
        aliases: [axion-audit-staging-caddy]
    # -------------------------------------------------------------------------
    # POURQUOI CETTE ÉTIQUETTE — MESURÉE, PAS SUPPOSÉE (A01, 2026-08-28)
    #
    # Ce conteneur vit sur TROIS réseaux : `axion-audit-coolify-interne` (le
    # nôtre), `coolify` (le réseau partagé du proxy) et `wrunr…` (celui que
    # Coolify injecte par application). Traefik, laissé libre, choisissait
    # l'IP du réseau INTERNE — sur lequel `coolify-proxy` n'est pas attaché.
    # Les paquets partaient dans le vide : le symptôme n'était pas un refus
    # mais un BLOCAGE (curl à 000 après 15 s), ce qui est bien plus trompeur.
    #
    # La mesure, depuis `coolify-proxy` lui-même — seul point de vue qui compte :
    #   10.0.4.7  (axion-audit-coolify-interne)  → injoignable
    #   10.0.1.12 (coolify)                      → HTTP/1.1 200 OK
    #   10.0.3.8  (wrunr…)                       → HTTP/1.1 200 OK
    #
    # `coolify` est retenu plutôt que `wrunr…` parce que ce dernier porte l'uuid
    # de l'application Coolify : il CHANGE si l'application est recréée, et une
    # étiquette qui pointe un réseau disparu rendrait la panne au premier
    # recreate — sans rien dire. `coolify` est stable.
    #
    # Ce que cette étiquette N'EST PAS : une entorse à l'isolement. Le service
    # `caddy` est déjà le SEUL à rejoindre `edge` (garde-fou
    # `pnpm check:isolation-reseau`) ; on ne fait ici que dire à Traefik LEQUEL
    # des trois réseaux de ce conteneur il doit emprunter.
    # -------------------------------------------------------------------------
    labels:
      traefik.docker.network: coolify
    # Swap neutralisé — encadré « DEUX MÉCANISMES DE PLAFOND ».
    mem_limit: 128M
    memswap_limit: 128M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

# -----------------------------------------------------------------------------
# RÉSEAUX
# -----------------------------------------------------------------------------
networks:
  # Réseau INTERNE de la pile. Nom DISTINCT de `axion-audit-dev` (pile de dev),
  # `axion-audit-prod`, `axion-audit-staging` (pile déployée par SSH) et de tout
  # réseau du projet voisin `Axion-IA` : aucune pile ne peut en joindre une autre.
  axion:
    name: axion-audit-coolify-interne
    driver: bridge

  # Réseau du proxy de Coolify. `external` À DESSEIN : ce fichier ne le crée pas
  # (le créer produirait un réseau homonyme SANS Traefik dedans, et le staging
  # serait injoignable sans que rien ne le signale). S'il n'existe pas, le
  # déploiement échoue immédiatement — voir PRÉREQUIS en tête de fichier.
  edge:
    name: ${COOLIFY_PROXY_NETWORK:-coolify}
    external: true

# -----------------------------------------------------------------------------
# VOLUMES — tous NOMMÉS EXPLICITEMENT et préfixés `axion-coolify-`.
# Le préfixe n'est pas décoratif : Coolify impose son propre nom de projet, donc
# le préfixage automatique de Compose ne peut pas servir de garantie. Ces noms
# ne collisionnent ni avec la pile de dev, ni avec `axion-staging-*` (pile SSH),
# ni avec les volumes du projet `Axion-IA`.
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: axion-coolify-postgres-data
  pgbackrest_repo:
    name: axion-coolify-pgbackrest-repo
  # Socket UNIX de PostgreSQL, partagé avec le service `sauvegarde` — la SEULE
  # voie par laquelle pgBackRest sait joindre le serveur (voir le montage
  # homologue du service `postgres`). Il ne contient jamais de données.
  postgres_socket:
    name: axion-coolify-postgres-socket
  # Archives CHIFFRÉES du volume MinIO (tar + zstd + gpg AES256), écrites par le
  # service `sauvegarde`. Rétention alignée sur ${BACKUP_RETENTION_DAYS}.
  # ⚠️ Ce volume vit sur LE DISQUE QU'IL PROTÈGE : à lui seul, il ne défend que
  # contre la perte logique (suppression, corruption applicative). Ce qui défend
  # contre la perte du SERVEUR est la copie expédiée vers R2 par le même service,
  # dont ce volume n'est que la source. Le vider ici ne vide pas R2 — mais le
  # vider PUIS laisser tourner une passe propagerait la suppression à distance,
  # sauf si le garde-fou `depot_local_sain()` de sauvegarde.sh l'attrape.
  sauvegarde_archives:
    name: axion-coolify-sauvegarde-archives
  redis_data:
    name: axion-coolify-redis-data
  minio_data:
    name: axion-coolify-minio-data
  caddy_data:
    name: axion-coolify-caddy-data
  caddy_config:
    name: axion-coolify-caddy-config
  # Fichiers CONSTRUITS des fronts : déposés par les jobs one-shot, lus en
  # lecture seule par Caddy. HTML/JS/CSS publiquement servi — aucune donnée,
  # aucun secret.
  field_dist:
    name: axion-coolify-field-dist
  hq_dist:
    name: axion-coolify-hq-dist
