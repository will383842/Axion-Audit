# =============================================================================
# infra/postgres/postgresql.custom.conf — configuration serveur PostgreSQL 16
# Applique : 02 §11.4 (WAL archiving pgBackRest, RPO <= 6 h), 11 §1 (PG 16),
# invariant 5 / .env `TZ=UTC` (horodatages UTC en base), 02 §11.3 (logs).
# Ce fichier REMPLACE le postgresql.conf généré par initdb (docker-compose.yml
# passe `-c config_file=…`) : il doit donc être auto-suffisant.
# =============================================================================

# --- Connexions --------------------------------------------------------------
# Écoute sur toutes les interfaces DU RÉSEAU DOCKER uniquement : en staging/prod
# aucun port n'est publié sur l'hôte (06 §10.3).
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Mémoire (profil CX32/CPX31 : 4 vCPU, 8-16 Go — 02 §11.1) ----------------
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Fuseau : TOUJOURS UTC (invariant 5) -------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'

# --- Journalisation / WAL ----------------------------------------------------
# `replica` est le minimum exigé par pgBackRest pour la sauvegarde physique.
wal_level = replica
max_wal_senders = 3
wal_keep_size = 256MB
checkpoint_timeout = 5min
max_wal_size = 2GB
min_wal_size = 128MB

# --- ARCHIVAGE WAL → pgBackRest (02 §11.4) -----------------------------------
# PRÉREQUIS AU PREMIER DÉMARRAGE : la stanza doit exister, sinon `archive-push`
# échoue et les WAL s'accumulent dans pg_wal. Voir infra/README.md :
#   docker compose exec postgres pgbackrest --stanza="$PGBACKREST_STANZA" stanza-create
# `%p` = chemin du segment WAL, `%f` = son nom. La stanza et la passphrase du
# dépôt viennent de l'ENVIRONNEMENT (PGBACKREST_*), jamais d'un fichier versionné.
archive_mode = on
archive_command = 'pgbackrest archive-push %p'
archive_timeout = 300s
# Ne bloque pas indéfiniment si le dépôt est momentanément indisponible.
restore_command = 'pgbackrest archive-get %f "%p"'

# --- Logs (02 §11.3) ---------------------------------------------------------
# INTERDICTION (11 §2) : aucune donnée personnelle dans les logs. `log_statement`
# reste à 'none' — journaliser le SQL exposerait des contenus de réponse.
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 1000
log_statement = 'none'
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '

# --- Divers ------------------------------------------------------------------
password_encryption = 'scram-sha-256'
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
