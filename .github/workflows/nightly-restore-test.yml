# =============================================================================
# TEST DE RESTAURATION NOCTURNE (02 §11.4 · critère d'acceptation du lot L0)
# =============================================================================
# Applique :
#   · 02 §11.4 — « TEST DE RESTAURATION AUTOMATIQUE NOCTURNE (même standard que
#     le site axion-ia.com) : restore dans un conteneur jetable + requêtes de
#     contrôle + ALERTE SI ÉCHEC. »
#   · 07 §12, critère L0 — « restauration Postgres ET MinIO testée depuis zéro ».
#   · 07 §13 — « test de restauration de sauvegarde automatique chaque nuit
#     (Postgres + MinIO) ».
#   · .env.example §12 — `RESTORE_TEST_CRON=0 3 * * *` (heure cron UTC).
#
# Pendant CI du critère L0 : la sauvegarde qui n'a jamais été restaurée n'est pas
# une sauvegarde. Ce workflow ne restaure rien lui-même — il DÉCLENCHE et
# SURVEILLE `infra/scripts/restore-test.sh` (livrable A11) sur le serveur, et
# alerte si le script échoue. C'est le rôle A53 (09 §1), outillé par A52.
#
# ⚠️ GitHub Actions n'accepte PAS de variable dans une expression `cron` : la
# valeur ci-dessous DUPLIQUE `RESTORE_TEST_CRON` de `.env.example` §12
# (`0 3 * * *`, UTC). Les deux doivent rester synchronisées à la main ; toute
# modification de l'une exige la modification de l'autre.
#
# Traçabilité E36/E43 — lot L0 (07 §12), agents A52 (CI) et A53 (observabilité).
# =============================================================================

name: Test de restauration nocturne

on:
  schedule:
    # RESTORE_TEST_CRON — 03:00 UTC, chaque nuit (.env.example §12, 02 §11.4).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      motif:
        description: 'Motif du déclenchement manuel (ex. « veille de porte P-A », checklist 07 §15).'
        required: false
        type: string
        default: 'vérification à la demande'

permissions:
  contents: read

concurrency:
  group: restore-test
  cancel-in-progress: false

jobs:
  restauration:
    name: SSH → /opt/axion-audit/restore-test-ci.sh (clé restreinte)
    runs-on: ubuntu-latest
    # Environment `ops` — PAS `prod`. L'approbation manuelle de `prod`
    # (02 §30.4-3) protège les DÉPLOIEMENTS ; l'appliquer ici bloquerait un job
    # nocturne planifié en attente d'un humain endormi, c'est-à-dire supprimerait
    # de fait le test de restauration. `ops` porte donc une clé SSH DISTINCTE et
    # RESTREINTE au seul `restore-test.sh` (02 §30.4-7, moindre accès).
    # ⚠️ Choix non tranché par le pack — voir « Doutes de spec » du rapport A52
    # et .github/workflows/README.md.
    environment: ops
    # Le job entier a 60 min : une restauration qui traîne indéfiniment est un
    # échec de PRA (RTO cible 4 h, 02 §11.4), pas un job « encore en cours ».
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Contrôler la présence des réglages non versionnables
        env:
          A_RESTORE_SSH_KEY: ${{ secrets.RESTORE_SSH_KEY }}
          A_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          A_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          A_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # `DEPLOY_PATH` A ÉTÉ RETIRÉ DE CE CONTRÔLE le 2026-08-30, et c'est
          # volontaire. Il désignait la copie du dépôt sur le serveur, mais la
          # directive `command=` de `authorized_keys` REMPLACE la commande du
          # client : ce chemin ne parvenait jamais au serveur. Exiger un réglage
          # que rien ne consomme fabrique une fausse certitude — on croit avoir
          # vérifié quelque chose. Le chemin vit désormais dans
          # `infra/scripts/restore-test-ci.sh`, sous revue croisée et sous
          # contrôle d'empreinte. Le secret peut rester posé : il est inerte.
          A_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          A_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          manquants=""
          for nom in A_RESTORE_SSH_KEY A_DEPLOY_SSH_KNOWN_HOSTS A_DEPLOY_HOST \
                     A_DEPLOY_USER A_TELEGRAM_BOT_TOKEN A_TELEGRAM_CHAT_ID; do
            if [ -z "${!nom:-}" ]; then
              manquants="${manquants} ${nom#A_}"
            fi
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Environment ops incomplet::Éléments manquants :${manquants}. À poser dans GitHub → Settings → Environments → ops. Sans canal Telegram, un échec de restauration passerait INAPERÇU — c'est exactement le scénario que 02 §11.4 interdit."
            exit 1
          fi

      - name: Préparer l'accès SSH (clé restreinte à restore-test-ci.sh)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RESTORE_SSH_KEY }}" > ~/.ssh/restore_key
          chmod 600 ~/.ssh/restore_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # -----------------------------------------------------------------------
      # CE QUE CETTE ETAPE DEMANDE, ET CE QUE LE SERVEUR FAIT REELLEMENT
      # -----------------------------------------------------------------------
      # A LIRE AVANT DE MODIFIER LA COMMANDE CI-DESSOUS. La cle `ops` porte dans
      # `authorized_keys` une directive `command="/opt/axion-audit/restore-test-ci.sh"`.
      # Cette directive NE FILTRE PAS la commande du client : elle la REMPLACE.
      # Tout ce qui est ecrit apres `ssh ... hote` est donc ignore par le serveur,
      # qui execute son script et rien d autre.
      #
      # CE QUI OCCUPAIT CETTE PLACE, ET POURQUOI C EST INSTRUCTIF. Vingt lignes de
      # commentaire arbitraient ici entre `/opt/axion-audit/prod/.env` et
      # `/opt/axion-audit/staging/.env`, concluaient « PROD, et non staging », et
      # exposaient un reglage `RESTORE_TEST_ENV_FILE` pour surcharger le chemin.
      # MESURE SUR LE SERVEUR LE 2026-08-30 : AUCUN DE CES TROIS FICHIERS N EXISTE
      # — ni `prod/.env`, ni `staging/.env`, ni le fichier plat. Le seul `.env`
      # reel est celui que Coolify tient pour l application. L arbitrage portait
      # donc sur deux fichiers absents, le reglage de surcharge ne surchargeait
      # rien, et le garde `test -x` sur `DEPLOY_PATH` ne s executait jamais.
      #
      # LA CONSEQUENCE A NE PAS ARRONDIR : ce commentaire annoncait une
      # restauration des sauvegardes de PRODUCTION. Le serveur restaure le stanza
      # decrit par le `.env` de Coolify, ou `APP_ENV=staging`. Le garde etait vrai
      # sur ce qu il observait et repondait a une autre question que celle posee.
      # Il n y a pas de tricherie derriere cet ecart : AXION AUDIT N A PAS ENCORE
      # D ENVIRONNEMENT DE PRODUCTION. Le test prouve la chaine de restauration
      # sur le seul environnement qui existe — ce qui est la garantie maximale
      # disponible aujourd hui, et ce n est pas celle que le PRA exigera demain.
      # LE JOUR OU UNE PRODUCTION APPARAIT, CE TEST NE LA SUIVRA PAS TOUT SEUL :
      # il faudra une seconde cle, un second script, un second stanza. Trace dans
      # DECISIONS.md le 2026-08-30 pour que cette echeance ne se perde pas.
      #
      # LES REGLAGES MORTS ONT ETE RETIRES plutot que laisses en place « au cas
      # ou » : un bouton qui ne commande rien est pire qu un bouton absent, parce
      # qu on croit l avoir tourne. Le chemin du `.env` se change desormais dans
      # `infra/scripts/restore-test-ci.sh`, sous revue croisee, et l empreinte
      # publiee par le script est comparee au fichier versionne.
      #
      # `DEPLOY_USER` et `DEPLOY_HOST` restent utiles : ils designent la machine.
      # Le code de retour du script EST le verdict — aucun masquage, aucun `|| true`.
      # -----------------------------------------------------------------------
      - name: Restaurer Postgres + MinIO dans un conteneur jetable
        id: restore
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail

          # La commande envoyee est un marqueur : le serveur la remplace. Elle est
          # ecrite en clair pour qu un journal de CI montre l intention, et pour
          # qu une cle NON restreinte — donc mal posee — execute quelque chose
          # d inoffensif et de bruyant au lieu du script attendu.
          SORTIE="$(ssh -i ~/.ssh/restore_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "echo 'CETTE-COMMANDE-AURAIT-DU-ETRE-REMPLACEE-PAR-command=' >&2; exit 97" 2>&1)" && CODE=0 || CODE=$?

          printf '%s\n' "${SORTIE}" | tee restore-test.log

          # ---------------------------------------------------------------------
          # LA CLE EST-ELLE BIEN RESTREINTE ? On le VERIFIE, on ne le suppose pas.
          # ---------------------------------------------------------------------
          # Si le marqueur ci-dessus ressort, c est que `command=` n a pas joue :
          # la cle posee en secret est alors une cle LIBRE sur ce serveur. Ce
          # n est pas un incident de test, c est un defaut de securite, et il doit
          # rougir avant toute conclusion sur la restauration.
          if printf '%s' "${SORTIE}" | grep -q 'CETTE-COMMANDE-AURAIT-DU-ETRE-REMPLACEE'; then
            echo "::error title=La cle de restauration n est PAS restreinte::Le serveur a execute la commande envoyee par la CI au lieu de /opt/axion-audit/restore-test-ci.sh. La directive command= est absente ou mal posee dans authorized_keys — la cle RESTORE_SSH_KEY donne donc plus de pouvoir que prevu. Corriger authorized_keys AVANT de rejouer ce test."
            exit 1
          fi

          # ---------------------------------------------------------------------
          # LE SCRIPT EN SERVICE EST-IL CELUI QUI A ETE RELU ?
          # ---------------------------------------------------------------------
          # Meme raison que pour le deploiement : `command=` impose un chemin
          # local, le script vit donc en deux copies, et deux copies derivent. Il
          # publie sa propre empreinte en premiere ligne ; on la compare ici.
          empreinte_distante="$(printf '%s' "${SORTIE}" | grep -oE '^EMPREINTE_SCRIPT=[0-9a-f]{64}$' | head -1 | cut -d= -f2)"
          empreinte_depot="$(sha256sum infra/scripts/restore-test-ci.sh | cut -d' ' -f1)"

          if [ -z "${empreinte_distante}" ]; then
            echo "::error title=Empreinte du script distant absente::Le script de restauration en service n a pas annonce son empreinte. Soit il est anterieur a ce controle, soit quelqu un l a remplace. On ne peut pas affirmer que le code execute est celui qui a ete relu."
            exit 1
          fi

          if [ "${empreinte_distante}" != "${empreinte_depot}" ]; then
            echo "::error title=Le script de restauration en service N EST PAS celui du depot::distante=${empreinte_distante} · depot=${empreinte_depot}. Redeployer le fichier versionne, ou expliquer l ecart dans DECISIONS.md."
            exit 1
          fi
          echo "Script distant verifie : identique au fichier versionne (${empreinte_depot:0:16}…)."

          if [ "${CODE}" -ne 0 ]; then
            echo "::error title=Restauration echouee::Le script distant a rendu ${CODE}. Sa sortie est ci-dessus — elle nomme la cause. Un retour non nul est un echec de plan de reprise."
            exit 1
          fi

      - name: Conserver le journal de restauration (preuve pour la porte)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Ce journal est la PREUVE attendue par le critère L0 (07 §12) et par
          # la checklist 07 §15 (« sauvegardes vérifiées, test de restauration
          # OK la veille ») — à référencer dans le fichier de porte (11 §9bis).
          name: journal-restauration-${{ github.run_id }}
          path: restore-test.log
          retention-days: 90
          if-no-files-found: warn

      - name: Effacer la clé SSH du runner
        if: always()
        run: rm -f ~/.ssh/restore_key ~/.ssh/known_hosts

      # ALERTE SI ÉCHEC (02 §11.4). On notifie AUSSI le succès : une alerte qui
      # ne parle jamais est indiscernable d'une alerte cassée.
      - name: Alerter Telegram
        if: always()
        env:
          JETON: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALON: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          statut='${{ job.status }}'
          if [ "$statut" = "success" ]; then
            entete="Axion Audit — test de restauration nocturne : OK"
          else
            entete="ALERTE Axion Audit — TEST DE RESTAURATION EN ECHEC (${statut})"
          fi
          texte="${entete}
          Declencheur : ${{ github.event_name }}
          Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Rappel 02 §11.4 : RPO <= 6 h cote siege, RTO cible 4 h. Un echec ici invalide le PRA jusqu'a correction."
          curl -fsS -X POST "https://api.telegram.org/bot${JETON}/sendMessage" \
            --data-urlencode "chat_id=${SALON}" \
            --data-urlencode "text=${texte}" >/dev/null
