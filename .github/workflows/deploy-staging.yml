# =============================================================================
# DÉPLOIEMENT STAGING — VIA L'API COOLIFY (02 §30.6 · 02 §30.4-3 · 02 §11.2)
# =============================================================================
# POURQUOI CE FICHIER NE FAIT PLUS DE SSH.
# `DECISIONS.md`, entrée du 2026-08-28 « Le staging s'insère derrière le Traefik
# de Coolify » : la machine `axionia-web` n'est pas un serveur nu. Elle fait
# tourner **Coolify v4**, qui y déploie déjà `axion-ia.com` et possède les ports
# 80/443 via son propre Traefik. Le déploiement du staging est donc DÉCLENCHÉ
# PAR L'API DE COOLIFY, qui est le seul ordonnanceur de cette machine ; un
# `docker compose up` posé à côté de lui par SSH serait un second maître sur les
# mêmes conteneurs. `infra/scripts/deploy.sh` reste le chemin de la PRODUCTION
# (`deploy-prod.yml`), qui n'est pas soumise à cette contrainte.
#
# CE QUE FAIT CE WORKFLOW, DANS L'ORDRE — et rien de plus :
#   1. il REFUSE DE PARTIR si un réglage manque, en nommant lequel ;
#   2. il DÉCLENCHE le déploiement de l'application par son uuid ;
#   3. il ATTEND la fin et ÉCHOUE si le déploiement échoue ;
#   4. il VÉRIFIE ENSUITE que le service répond, depuis l'extérieur ;
#   5. (2026-09-02, décision de Williams) le script distant REMET LE CLONE
#      `/opt/axion-audit/repo` AU SHA LIVRÉ — celui que le nocturne éprouvera —
#      et ce workflow vérifie que le sha atteint est bien `github.sha`.
#
# L'étape 3 est la raison d'être du fichier. Un workflow qui poste un
# déclenchement puis rend la main annonce un succès qu'il n'a pas constaté :
# c'est un vert qui ne vérifie rien, le défaut que ce dépôt traque en premier
# (`.github/workflows/README.md` §0). D'où la règle appliquée partout ci-dessous :
# **aucun `|| true` sur une commande dont le résultat décide de quelque chose.**
#
# RÉGLAGES (02 §30.4-3) — portés par l'ENVIRONMENT `staging` ou, à défaut, par
# les secrets de dépôt. Aucune valeur n'apparaît en clair ici (02 §30.4-1), et
# aucune n'est affichée : on ne teste que leur PRÉSENCE.
#   · secret `COOLIFY_API_TOKEN`  jeton Sanctum `<id>|<clair>`               (existe)
#   · secret `COOLIFY_URL`        ex. `http://<IP_AXIONIA_WEB>:8000`            (existe)
#   · secret ou variable `COOLIFY_APP_UUID`  uuid de l'application staging   (À CRÉER)
#     Valeur documentée, NON SECRÈTE, dans `DECISIONS.md` (2026-08-28) :
#     `wrunr6mwq2oxqq392i4myzjn` — projet `Axion-Audit`, serveur `localhost`.
#   · variable `STAGING_BASE_URL` origine publique du staging
#   · secrets `TELEGRAM_BOT_TOKEN` / `TELEGRAM_CHAT_ID` (02 §11.3)
#
# ------------------------------- ROLLBACK ------------------------------------
# CE BANDEAU A ÉTÉ RÉÉCRIT LE 2026-08-28 CONTRE LA MACHINE. Il décrivait une
# procédure par TAG D'IMAGE conservé 90 jours sur GHCR. Elle n'existe pas pour
# cet environnement, et un exploitant qui l'appliquerait en pleine panne
# chercherait des objets qui ne sont pas là. Ce qui l'invalidait :
#
#   · le staging NE TIRE RIEN DE GHCR — Coolify CONSTRUIT sur le serveur
#     (build_pack `dockercompose`). Aucune image ne vient d'un registre ; la
#     rétention de 90 j sur GHCR ne protège donc rien ici. Elle reste vraie
#     pour la PRODUCTION (`deploy-prod.yml`), qui, elle, tire des images.
#   · « l'image visée passe au tag précédent » n'a pas d'objet : le compose fixe
#     des tags CONSTANTS (`axion-audit-api:coolify`, …). Chaque construction
#     réécrit le même tag. Il N'Y A PAS d'image précédente à désigner.
#   · l'onglet « Rollback » de Coolify EST VIDE pour cette application. Il liste
#     les images dont le dépôt contient l'uuid de l'application
#     (`wrunr6mwq2oxqq392i4myzjn`) ; les nôtres s'appellent `axion-audit-*` et
#     n'y figurent donc jamais. Le bouton existe, la liste est vide.
#
# LA VRAIE PROCÉDURE — on ne revient pas à une IMAGE, on revient à un COMMIT.
# Coolify reconstruit depuis git : le levier est le champ `git_commit_sha` de
# l'application, qui vaut `HEAD` en régime normal.
#
#   1. Choisir le commit de repli sur la branche déployée (`lot/l0-infra`) :
#      le dernier dont ce workflow a rapporté un déploiement `finished`.
#
#   2. ÉPINGLER l'application sur ce commit :
#        curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID" \
#          -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
#          -H 'Content-Type: application/json' \
#          -d '{"git_commit_sha":"<sha40>"}'
#
#   3. DÉPLOYER — exactement l'appel de l'étape 2/4 ci-dessous :
#        curl -fsS -G "$COOLIFY_URL/api/v1/deploy" \
#          -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
#          --data-urlencode "uuid=$COOLIFY_APP_UUID" --data-urlencode 'force=true'
#      Suivre l'issue sur /api/v1/deployments/<uuid> (même logique qu'en 3/4).
#      Reconstruction complète mesurée : ~70 s (66–83 s le 2026-08-28).
#
#   4. ⚠️ REMETTRE `git_commit_sha` À `HEAD` UNE FOIS LE STAGING SAIN. Ce champ
#      est PERSISTANT : tant qu'il est épinglé, TOUS les déploiements suivants —
#      y compris ceux déclenchés par ce workflow — rejoueront le vieux commit en
#      annonçant un succès. C'est le piège de cette procédure, et il est
#      silencieux :
#        curl -fsS -X PATCH … -d '{"git_commit_sha":"HEAD"}'
#
#   5. AUCUNE migration inverse n'est jouée : les migrations sont
#      RÉTROCOMPATIBLES N-1 (02 §11.2), donc la version N-1 du code fonctionne
#      sur le schéma N. C'est cette règle — et elle seule — qui rend le rollback
#      applicatif sûr sans toucher à la base. Inchangé.
#
# FENÊTRE DE RETOUR ARRIÈRE : c'est l'HISTORIQUE GIT, pas une rétention de
# registre. Elle n'expire pas à 90 jours — mais elle exige que la
# RECONSTRUCTION ABOUTISSE. Ce retour arrière n'est donc pas instantané et
# n'est pas hors ligne : il faut le réseau sortant (les images de base peuvent
# avoir été élaguées entre-temps par le crontab de la machine, cf.
# `infra/COHABITATION_AXIONIA_WEB.md` §3bis.4) et une construction verte.
# Un commit de repli dont la construction échoue N'EST PAS un repli.
#
# À ARBITRER (`DECISIONS.md`) — le retour arrière rapide se paierait en disque :
# taguer les images par commit (`axion-audit-api:${IMAGE_TAG}`) rendrait la
# liste de Coolify non vide et le repli immédiat, au prix d'images qui
# s'accumulent (~1,1 Go par déploiement conservé). `infra/scripts/
# empreinte-docker.sh elaguer` implémente déjà la rétention qui bornerait cela.
# -----------------------------------------------------------------------------
#
# POINT DE JONCTION RESTANT, ÉCRIT ICI PLUTÔT QUE DÉCOUVERT PLUS TARD.
# `tag_image` désigne l'image que le déploiement DOIT servir. C'est la pile
# déployée (`infra/docker-compose.coolify.yml`) qui l'interpole, depuis la
# variable d'environnement `IMAGE_TAG` de l'application Coolify. Ce workflow ne
# l'écrit PAS : il ne modifie aucune configuration Coolify. Le tag est donc
# journalisé et notifié pour traçabilité, et le `commit` que Coolify rapporte
# est affiché à chaque interrogation — mais tant que `IMAGE_TAG` n'est pas relié
# côté Coolify, un redéploiement rejoue l'image configurée, pas celle de ce run.
#
# Traçabilité E36/E43 — lot L0 (07 §12 : « déploiement staging par la CI OK »).
# =============================================================================

name: Déploiement staging

on:
  workflow_call:
    inputs:
      tag_image:
        description: "Tag d'image à déployer (sha-xxxxxxx). Fourni par le job build de ci.yml."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_image:
        description: "Tag d'image à déployer (sha-xxxxxxx) — ex. pour rejouer un déploiement."
        required: true
        type: string

permissions:
  contents: read

# Un déploiement staging à la fois, et JAMAIS d'annulation d'un déploiement en
# vol. Coolify ANNULE le déploiement précédent quand un nouveau lui est soumis
# pour la même application : deux runs concurrents produiraient une cascade de
# `cancelled-by-user` — l'incident mesuré sur le projet voisin (8 déploiements
# consécutifs perdus). `cancel-in-progress` reste donc à `false`.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deployer:
    name: Coolify → déploiement vérifié
    runs-on: ubuntu-latest
    # Borne dure du job : la somme des bornes des étapes, plus une marge. Un
    # runner qui tourne une heure sur un déploiement gelé coûte sans rien dire.
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    outputs:
      # Exposée pour le job `securite` : les variables d'ENVIRONMENT ne sont
      # lisibles que par un job qui déclare cet environment — le job ZAP, lui,
      # n'en déclare aucun. On la fait donc transiter explicitement.
      url_base: ${{ steps.bilan.outputs.url_base }}
      # -----------------------------------------------------------------------
      # LE FAIT, PAS LE VERDICT — sortie ajoutée le 2026-09-05 (constat F-31).
      # -----------------------------------------------------------------------
      # Le job `securite` (ZAP) dépendait de la RÉUSSITE de ce job. Or ce job
      # porte deux choses de nature différente : la LIVRAISON (staging est-il en
      # service ?) et des contrôles de GOUVERNANCE qui viennent APRÈS elle
      # (l'empreinte du script distant est-elle celle du dépôt ? le clone du
      # serveur est-il au sha livré ?). Depuis le 2026-09-02, un contrôle de la
      # seconde famille rougit — le staging, lui, tourne. Résultat : le scan de
      # sécurité était skippé par ricochet, DEUX JOURS, sans que rien ne le dise.
      # Un défaut d'hygiène de dépôt ne doit pas éteindre un contrôle de sécurité.
      # Cette sortie ne vaut PAS « déploiement réussi » : elle vaut « il y a bien
      # un environnement vivant à scanner », et c'est mesuré par une sonde HTTP
      # publique, hors du serveur. Ce job continue d'échouer exactement comme
      # avant : aucun garde n'est retiré, aucun n'est adouci.
      staging_en_service: ${{ steps.sante.outputs.en_service }}
    steps:
      # -----------------------------------------------------------------------
      # 1/4 — REFUSER DE PARTIR PLUTÔT QUE D'ÉCHOUER OBSCURÉMENT PLUS LOIN
      # -----------------------------------------------------------------------
      # Sans ce contrôle, un `COOLIFY_URL` absent produit un `curl` sur
      # `/api/v1/deploy` — une URL relative, donc une erreur de protocole que
      # personne ne relie au secret manquant. Le diagnostic doit être rendu ici,
      # avec le NOM de ce qui manque et l'endroit où le poser.
      # -----------------------------------------------------------------------
      # POURQUOI CE JOB A BESOIN DU DÉPÔT, alors qu'il ne construit rien.
      # -----------------------------------------------------------------------
      # Il n'y avait AUCUN `checkout` ici, et c'était sans conséquence tant que ce
      # job ne faisait qu'appeler une API. Depuis le 2026-08-30, il compare
      # l'empreinte publiée par le script distant au FICHIER VERSIONNÉ — donc il
      # lui faut le fichier. Au premier passage réel, la comparaison a échoué sur
      #
      #     sha256sum: infra/scripts/deploy-staging.sh: No such file or directory
      #
      # CE QUI EST INSTRUCTIF ICI, ET VAUT D'ÊTRE LU. Le garde a échoué
      # BRUYAMMENT — c'est le bon comportement, et c'est `set -e` qui l'a produit.
      # Mais il a échoué SANS ANNOTATION : le message venait de `sha256sum` sur la
      # sortie d'erreur, pas d'un `::error`. Une lecture rapide du journal montrait
      # « Deploiement du staging termine et verifie. » suivi d'un « exit code 1 »
      # sans cause apparente — et la première hypothèse formulée par un lecteur
      # (l'étiquette de révision manquante, qui n'est qu'un `::warning`) était
      # FAUSSE. Un garde qui échoue sans nommer sa cause envoie chercher ailleurs.
      # D'où le contrôle d'existence explicite ajouté plus bas, avant la comparaison.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Un seul commit suffit : on ne lit qu'un fichier, jamais l'historique.
          fetch-depth: 1

      - name: Contrôler la présence des réglages non versionnables
        id: reglages
        env:
          # Les secrets ne sont jamais AFFICHÉS : on ne teste que leur présence.
          A_COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          A_COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          A_STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          # L'uuid de l'application n'est PAS un secret (DECISIONS.md
          # 2026-08-28 le publie). On l'accepte donc comme VARIABLE — plus
          # lisible dans les journaux — tout en tolérant la forme SECRET, qui
          # est la convention du projet voisin. Le premier des deux qui est
          # renseigné gagne ; aucun des deux ne rend l'autre obligatoire.
          A_UUID_VARIABLE: ${{ vars.COOLIFY_APP_UUID }}
          A_UUID_SECRET: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail

          manquants=''
          for nom in A_COOLIFY_API_TOKEN A_COOLIFY_URL A_STAGING_BASE_URL; do
            if [ -z "${!nom:-}" ]; then
              manquants="${manquants} ${nom#A_}"
            fi
          done

          uuid_application="${A_UUID_VARIABLE:-}"
          if [ -z "${uuid_application}" ]; then
            uuid_application="${A_UUID_SECRET:-}"
          fi
          if [ -z "${uuid_application}" ]; then
            manquants="${manquants} COOLIFY_APP_UUID"
          fi

          if [ -n "${manquants}" ]; then
            echo "::error title=Réglages de déploiement incomplets::Éléments manquants :${manquants}. Ils se posent À LA MAIN dans GitHub → Settings (Environments → staging, ou Secrets and variables → Actions). COOLIFY_APP_UUID vaut wrunr6mwq2oxqq392i4myzjn (DECISIONS.md, 2026-08-28) — ce n'est pas un secret, une VARIABLE suffit. Voir .github/workflows/README.md."
            exit 1
          fi

          # Un `COOLIFY_URL` sans schéma est l'erreur de saisie la plus probable
          # (« <IP_AXIONIA_WEB>:8000 » au lieu de « http://<IP_AXIONIA_WEB>:8000 »).
          # Elle se voit ici en une ligne ; trois étapes plus loin, elle se lit
          # comme une panne de Coolify.
          case "${A_COOLIFY_URL}" in
            http://* | https://*) ;;
            *)
              echo "::error title=COOLIFY_URL mal formé::Le secret COOLIFY_URL doit commencer par http:// ou https:// (sa valeur n'est pas affichée ici). Exemple attendu : http://<ip>:8000."
              exit 1
              ;;
          esac

          echo "uuid_application=${uuid_application}" >> "$GITHUB_OUTPUT"
          echo 'Réglages présents : jeton, URL Coolify, uuid d application, URL publique du staging.'

      # -----------------------------------------------------------------------
      # 2/4 — DÉCLENCHER LE DÉPLOIEMENT
      # -----------------------------------------------------------------------
      # `force=true` : on redéploie même si Coolify juge que rien n'a changé.
      # Sans lui, un run relancé à la main pourrait ne RIEN faire tout en
      # rendant 200 — un succès sans déploiement.
      # -----------------------------------------------------------------------
      # DÉPLOIEMENT PAR SSH — et pourquoi ce n'est PAS un appel direct à Coolify.
      # -----------------------------------------------------------------------
      # Les deux étapes précédentes appelaient `${COOLIFY_URL}/api/v1/deploy`
      # DEPUIS INTERNET. Au premier passage réel de ce job — le 2026-08-30, après
      # le tout premier merge sur `main` — elles ont échoué :
      #
      #     ::error::Coolify injoignable — l'appel à ***/api/v1/deploy n'a pas
      #     abouti (erreur réseau ou délai dépassé).
      #
      # LA CAUSE N'ÉTAIT PAS UN DÉFAUT, C'ÉTAIT UN CORRECTIF. Le pare-feu Hetzner
      # ferme le port 8000 depuis le 2026-08-28 ; `docs/portes/PORTE_A` l'inscrit
      # comme la correction du risque « console Coolify exposée en HTTP clair »,
      # preuve à l'appui. Deux exigences vraies se contredisaient :
      #   · fermer le 8000 à Internet = la bonne correction de sécurité ;
      #   · déployer par la CI       = un appel depuis Internet sur le 8000.
      # Personne ne pouvait voir la collision : ce job ne tourne que sur `main`,
      # et rien n'y avait jamais été mergé. Le blocage circulaire de la porte
      # cachait sa propre conséquence.
      #
      # CE QUI A ÉTÉ ÉCARTÉ, et pourquoi :
      #   · ROUVRIR LE 8000 aux plages GitHub — des milliers de plages mouvantes,
      #     et la console d'administration qui pilote AUSSI `axion-ia.com`
      #     redeviendrait joignable depuis un espace immense. Refusé.
      #   · PUBLIER COOLIFY EN HTTPS derrière le proxy — TLS protège le transport,
      #     pas la surface : la console resterait exposée à Internet, chiffrée.
      #     Cela déplace le risque, ne le supprime pas. Refusé.
      #   · LA CLÉ D'ADMINISTRATION de Williams en secret — elle donnerait un
      #     accès root complet, production comprise, à quiconque peut modifier ce
      #     fichier. Refusé.
      #
      # CE QUI EST FAIT : une clé DÉDIÉE, dont `authorized_keys` restreint
      # l'usage à UNE SEULE commande côté serveur —
      #     command="/opt/axion-audit/deploy-staging.sh",restrict
      # Elle ne peut ni ouvrir un shell, ni lire un fichier, ni rediriger un port.
      # Prouvé par tentative réelle le 2026-08-30 : `whoami; cat /etc/shadow` et
      # la lecture d'un fichier d'`axion-ia` ont TOUS DEUX été refusés — le
      # serveur exécute le script quoi qu'on lui demande.
      #
      # Aucun port n'est ouvert : le 22 est déjà le canal d'administration, et le
      # 8000 reste fermé. Le correctif du 2026-08-28 est intact.
      #
      # Le jeton Coolify ne quitte pas la mémoire : il transite par stdin, jamais
      # par la ligne de commande — `ps` d'un autre utilisateur ne le verrait pas.
      # -----------------------------------------------------------------------
      - name: Déclencher le déploiement Coolify (par SSH, en boucle locale)
        id: declenchement
        env:
          CLE_SSH: ${{ secrets.DEPLOY_SSH_KEY }}
          JETON: ${{ secrets.COOLIFY_API_TOKEN }}
          UUID_APP: ${{ vars.COOLIFY_APP_UUID }}
          COMMIT: ${{ github.sha }}
          # L'adresse n'est PAS un secret : elle figure déjà en clair dans les
          # variables du dépôt et dans `infra/COHABITATION_AXIONIA_WEB.md`. La
          # mettre en secret donnerait l'illusion de protéger ce qui ne l'est pas.
          HOTE: 178.105.55.15
        run: |
          set -euo pipefail

          if [ -z "${CLE_SSH}" ]; then
            echo "::error title=Clé de déploiement absente::Le secret DEPLOY_SSH_KEY n'est pas posé sur ce dépôt. Sans lui, la CI ne peut pas atteindre Coolify — le port 8000 est fermé à Internet DÉLIBÉRÉMENT (correctif du 2026-08-28)."
            exit 1
          fi

          CLE="$(mktemp)"; trap 'rm -f "${CLE}"' EXIT
          printf '%s\n' "${CLE_SSH}" > "${CLE}"
          chmod 600 "${CLE}"

          # `IdentitiesOnly` : on n'essaie QUE cette clé. Sans lui, un agent
          # présent sur le runner pourrait en proposer une autre et l'on croirait
          # avoir prouvé que la clé restreinte fonctionne.
          # L'empreinte de l'hôte est acceptée à la première connexion : le
          # runner est éphémère, il n'a pas de `known_hosts` à conserver.
          SORTIE="$(printf '%s\n%s\n%s\n' "${JETON}" "${UUID_APP}" "${COMMIT}" \
            | ssh -i "${CLE}" \
                  -o IdentitiesOnly=yes \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=accept-new \
                  -o ConnectTimeout=20 \
                  -o ServerAliveInterval=30 \
                  "root@${HOTE}" 2>&1)" && CODE=0 || CODE=$?

          printf '%s\n' "${SORTIE}"

          if [ "${CODE}" -ne 0 ]; then
            # Deux échecs qui ne se corrigent pas au même endroit, nommés
            # séparément : la livraison elle-même, ou — depuis le 2026-09-02 —
            # la remise à niveau du clone, qui vient APRÈS une livraison réussie.
            if printf '%s' "${SORTIE}" | grep -q '::error::Alignement du clone'; then
              echo "::error title=Staging déployé, mais le clone du serveur n'a PAS été remis à niveau::Le script distant a rendu ${CODE} à l'étape 5 (alignement de /opt/axion-audit/repo sur ${COMMIT}). La livraison a pris effet ; c'est la copie qui porte restore-test.sh qui est restée en arrière. La cause est nommée ci-dessus (origine du clone, modifications locales, historique réécrit, fetch impossible). Sans correction, le test de restauration nocturne rougira « clone hors de main » — pour la bonne raison."
              exit 1
            fi
            echo "::error title=Déploiement échoué::Le script distant a rendu ${CODE}. Sa sortie est ci-dessus — elle nomme la cause."
            exit 1
          fi

          uuid_deploiement="$(printf '%s' "${SORTIE}" | grep -oE 'Deploiement declenche : [a-z0-9]+' | awk '{print $4}' | head -1)"
          if [ -z "${uuid_deploiement}" ]; then
            echo "::error title=Aucun identifiant de déploiement::Le script est sorti en 0 sans annoncer d'identifiant. Un succès qu'on ne peut pas rattacher à un déploiement n'est pas un succès."
            exit 1
          fi
          echo "uuid_deploiement=${uuid_deploiement}" >> "$GITHUB_OUTPUT"

          # ---------------------------------------------------------------------
          # LA LIVRAISON A-T-ELLE PRIS EFFET ? (constaté ICI, avant la suite)
          # ---------------------------------------------------------------------
          # Le script distant lit le conteneur RÉELLEMENT en service et annonce
          # « Prise d effet observee … provient du deploiement <uuid> ». On note
          # ce fait MAINTENANT, avant les contrôles de gouvernance qui suivent :
          # ils portent sur l'hygiène du dépôt et du serveur, pas sur l'existence
          # d'un environnement. `set -e` interrompra peut-être cette étape trois
          # lignes plus bas ; la sortie déjà écrite dans $GITHUB_OUTPUT, elle,
          # reste lisible par les jobs suivants. C'est ce qui permet au scan ZAP
          # de tourner sur un staging vivant même quand ce job rougit ailleurs.
          # ---------------------------------------------------------------------
          if printf '%s' "${SORTIE}" | grep -q "provient du deploiement ${uuid_deploiement}"; then
            echo "prise_effet=oui" >> "$GITHUB_OUTPUT"
            echo "Prise d'effet confirmée pour ${uuid_deploiement} : il y a un environnement vivant."
          else
            echo "::warning title=Prise d'effet non confirmée::Le script distant n'a pas annoncé que le conteneur en service provient de ${uuid_deploiement}. Les contrôles ci-dessous vont trancher ; le scan de sécurité, lui, ne tournera pas — on ne scanne pas un environnement dont on ne sait pas ce qu'il sert."
          fi

          # ---------------------------------------------------------------------
          # LE SCRIPT DISTANT EST-IL BIEN CELUI QUI A ÉTÉ RELU ?
          # ---------------------------------------------------------------------
          # `command=` ne peut pointer que vers un chemin local : le script vit donc
          # AUSSI sur le serveur, en /opt/axion-audit/deploy-staging.sh. Deux copies,
          # et deux copies dérivent.
          #
          # Le 2026-08-30, ce script a été modifié DEUX FOIS directement en
          # production — sans revue croisée, sans historique, sans sauvegarde. Il
          # n'existait alors que sur le serveur. C'est exactement le défaut que ce
          # dépôt corrige partout ailleurs, logé dans le mécanisme de déploiement
          # lui-même.
          #
          # Le script imprime désormais SA PROPRE EMPREINTE en première ligne. On la
          # compare ici à celle du fichier versionné. Un écart fait ÉCHOUER l'étape :
          # une version en service qui n'a pas été relue ne déploie pas.
          # ---------------------------------------------------------------------
          empreinte_distante="$(printf '%s' "${SORTIE}" | grep -oE '^EMPREINTE_SCRIPT=[0-9a-f]{64}$' | head -1 | cut -d= -f2)"
          # Le fichier de référence existe-t-il seulement ? Sans ce contrôle,
          # `sha256sum` échoue sur la sortie d'erreur et `set -e` interrompt
          # l'étape SANS annotation — le journal montre alors un « exit code 1 »
          # dont la cause est invisible, et l'on cherche ailleurs. C'est
          # exactement ce qui s'est produit le 2026-08-30.
          if [ ! -f infra/scripts/deploy-staging.sh ]; then
            echo "::error title=Référence d'empreinte introuvable::Le fichier versionné infra/scripts/deploy-staging.sh est absent du runner. Ce job doit faire un checkout du dépôt pour pouvoir comparer l'empreinte du script en service à celle du fichier relu — sans lui, le contrôle ne peut pas conclure, et un contrôle qui ne conclut pas ne doit pas laisser déployer."
            exit 1
          fi
          empreinte_depot="$(sha256sum infra/scripts/deploy-staging.sh | cut -d' ' -f1)"

          if [ -z "${empreinte_distante}" ]; then
            echo "::error title=Empreinte du script distant absente::Le script en service n'a pas annoncé son empreinte. Soit il est antérieur à ce contrôle, soit quelqu'un l'a remplacé par une version qui ne la publie pas. Dans les deux cas, on ne peut pas affirmer que le code exécuté est celui qui a été relu — donc on ne déploie pas."
            exit 1
          fi

          if [ "${empreinte_distante}" != "${empreinte_depot}" ]; then
            echo "::error title=Le script en service N'EST PAS celui du dépôt::distante=${empreinte_distante} · dépôt=${empreinte_depot}. Quelqu'un a modifié /opt/axion-audit/deploy-staging.sh sans passer par le dépôt — donc sans revue croisée ni historique. Redéployer le fichier versionné, ou expliquer l'écart dans DECISIONS.md."
            exit 1
          fi
          echo "Script distant vérifié : identique au fichier versionné (${empreinte_depot:0:16}…)."

          # ---------------------------------------------------------------------
          # LE CLONE DU SERVEUR EST-IL AU SHA QUI VIENT D'ÊTRE LIVRÉ ?
          # ---------------------------------------------------------------------
          # Décidé par Williams le 2026-09-02 (DECISIONS.md) : la fraîcheur de
          # `/opt/axion-audit/repo` — la copie qui porte `restore-test.sh`, que
          # le test nocturne exécute — est une propriété de la LIVRAISON. Le
          # script distant vient de le remettre au sha déployé (fetch + checkout
          # du SHA, jamais d'une branche) et publie `CLONE_SERVEUR=<sha40>`. On
          # ne le croit pas sur parole : la ligne est comparée ici à `github.sha`.
          # Un écart rougit ce job EN NOMMANT LE CLONE — le staging, lui, est
          # déjà en service (l'alignement est la dernière étape du script).
          # Sans cette ligne, le nocturne rougirait à 03h00 « clone hors de
          # main » et l'on chercherait la cause au mauvais endroit.
          # ---------------------------------------------------------------------
          clone_serveur="$(printf '%s' "${SORTIE}" | grep -oE '^CLONE_SERVEUR=[0-9a-f]{40}$' | head -1 | cut -d= -f2)"
          if [ -z "${clone_serveur}" ]; then
            echo "::error title=Le clone du serveur n'a pas été remis à niveau::Le script distant n'a pas publié CLONE_SERVEUR=<sha>. Sa sortie ci-dessus nomme la cause (origine du clone, modifications locales, historique réécrit, fetch impossible). Tant que /opt/axion-audit/repo n'est pas au sha livré, le test de restauration nocturne éprouvera un autre code que celui-ci — et rougira en le disant."
            exit 1
          fi
          if [ "${clone_serveur}" != "${COMMIT}" ]; then
            echo "::error title=Le clone du serveur n'est PAS au sha livré::clone=${clone_serveur} · livré=${COMMIT}. Le script distant a annoncé un alignement sur un autre commit que celui de ce déploiement. Ne pas laisser passer : le nocturne comparerait ce clone à main et rougirait."
            exit 1
          fi
          echo "Clone du serveur vérifié : /opt/axion-audit/repo est au sha livré (${clone_serveur:0:12}…)."

      # L'attente et la vérification du commit RÉELLEMENT en service vivent
      # désormais dans le script distant, où elles ont accès au conteneur.
      # C'est ce qui permet de ne PAS croire le champ `status` de l'API Coolify :
      # le 2026-08-28, trois déploiements annoncés « réussis » avaient échoué
      # (DECISIONS.md). Le script lit l'étiquette de révision du conteneur en
      # service et échoue si ce n'est pas le commit demandé.
      - name: Contrôle de santé public (hors serveur)
        id: sante
        # `always()` + prise d'effet : cette sonde doit s'exécuter même si
        # l'étape précédente a échoué SUR UN CONTRÔLE DE GOUVERNANCE (empreinte,
        # clone), car dans ce cas le staging est déjà en service et le scan de
        # sécurité a un objet. Elle ne s'exécute PAS si la livraison n'a pas pris
        # effet : on ne sonde pas un environnement dont on ignore ce qu'il sert.
        if: always() && steps.declenchement.outputs.prise_effet == 'oui'
        timeout-minutes: 10
        env:
          URL_BASE: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          base="${URL_BASE%/}"
          sonde="${base}/api/v1/health/ready"
          essais=20
          intervalle=15

          for i in $(seq 1 "${essais}"); do
            if curl -fsS --max-time 10 -o /dev/null "${sonde}"; then
              echo "Santé API OK sur ${sonde} (essai ${i}/${essais})."
              # Fait mesuré hors du serveur : il y a un environnement vivant à
              # scanner. Consommé par le job `securite` (voir sorties du job).
              echo "en_service=oui" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "[$(date -u +%H:%M:%S)] ${sonde} ne répond pas encore (essai ${i}/${essais})."
            sleep "${intervalle}"
          done

          # Le service n'a pas répondu. Avant de rendre le verdict, on distingue
          # les deux pannes qui ne se corrigent pas au même endroit : une API
          # absente (rien ne répond) et une API vivante privée de sa base.
          echo '──── Discrimination de la panne ────'
          if curl -fsS --max-time 10 -o /dev/null "${base}/api/v1/health"; then
            echo "::error title=Dépendances indisponibles::L API répond sur ${base}/api/v1/health mais sa sonde de préparation reste en échec après $((essais * intervalle)) s : une dépendance (PostgreSQL) ne répond pas. Le déploiement est considéré comme ÉCHOUÉ."
          else
            echo "::error title=Staging injoignable::Ni ${sonde} ni ${base}/api/v1/health ne répondent après $((essais * intervalle)) s. Le déploiement est considéré comme ÉCHOUÉ (rollback : voir le bandeau de ce fichier)."
          fi
          exit 1

      - name: Bilan
        id: bilan
        if: always()
        env:
          URL_BASE: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          echo "url_base=${URL_BASE}" >> "$GITHUB_OUTPUT"

      # Notification Telegram — canal interne Axion-IA (02 §11.3 et §30.6).
      - name: Notifier Telegram
        if: always()
        env:
          JETON: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALON: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUT: ${{ job.status }}
          TAG_IMAGE: ${{ inputs.tag_image }}
          UUID_DEPLOIEMENT: ${{ steps.declenchement.outputs.uuid_deploiement }}
          COMMIT: ${{ github.sha }}
          LIEN_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${JETON:-}" ] || [ -z "${SALON:-}" ]; then
            echo "::error title=Alerte impossible::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID absents. Un déploiement sans canal d alerte est un déploiement aveugle (02 §11.3)."
            exit 1
          fi
          texte="Axion Audit — déploiement STAGING : ${STATUT}
          Tag : ${TAG_IMAGE}
          Déploiement Coolify : ${UUID_DEPLOIEMENT:-non déclenché}
          Commit : ${COMMIT}
          Run : ${LIEN_RUN}"
          curl -fsS --max-time 30 -o /dev/null -X POST "https://api.telegram.org/bot${JETON}/sendMessage" \
            --data-urlencode "chat_id=${SALON}" \
            --data-urlencode "text=${texte}"

  # ---------------------------------------------------------------------------
  # ZAP baseline « à chaque build » (09 §1 rôle A51 · 07 §13 « ZAP baseline en
  # CI ») — exécuté APRÈS le déploiement, contre l'environnement staging.
  # ---------------------------------------------------------------------------
  securite:
    name: ZAP baseline (staging)
    needs: [deployer]
    # -------------------------------------------------------------------------
    # POURQUOI CE `if:` EXISTE — constat F-31 du 2026-09-04.
    # -------------------------------------------------------------------------
    # Il n'y avait ici AUCUN `if:`, donc un `success()` implicite sur
    # `deployer`. Le 2026-09-02 à 14h40 UTC, `deployer` s'est mis à rougir sur
    # un contrôle de gouvernance POSTÉRIEUR à une livraison réussie ; le scan de
    # sécurité a été skippé à chaque merge pendant deux jours (runs 33643594297,
    # 33714804567, 33733141719, 33735371068, 33750466751, 33753848462,
    # 33755148476, 33918656915, 33920693605) et personne ne l'a vu, parce qu'un
    # job `skipped` ne rougit pas. Dernier scan réel : run 33603477826.
    # La condition ne relâche RIEN : elle remplace un « aucun défaut nulle part »
    # par un FAIT MESURÉ — la sonde publique a répondu, il y a un environnement
    # à scanner. `deployer` échoue toujours, le workflow reste rouge, et si le
    # staging n'est pas en service ce job est skippé À BON DROIT (et le scan
    # nocturne de `zap-baseline.yml` rougira, lui, de ne pas joindre la cible).
    # -------------------------------------------------------------------------
    if: always() && needs.deployer.outputs.staging_en_service == 'oui'
    uses: ./.github/workflows/zap-baseline.yml
    with:
      cible: ${{ needs.deployer.outputs.url_base }}
    secrets: inherit
