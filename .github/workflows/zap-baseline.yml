# =============================================================================
# ZAP BASELINE (09 §1 rôle A51 · 07 §13 « Sécurité : ZAP baseline en CI »)
# =============================================================================
# Applique :
#   · 09 §1 — « A51 sécurité offensive : ZAP BASELINE À CHAQUE BUILD, revue
#     OWASP ASVS L2 avant recette ».
#   · 07 §13 — « Sécurité : ZAP baseline en CI ».
#   · 02 §30.6 — exécuté contre l'environnement STAGING, APRÈS déploiement
#     (appelé en fin de deploy-staging.yml) ET une fois par nuit.
#
# ─────────────────────────────────────────────────────────────────────────────
# CE QUE LE 2026-09-04 A APPRIS — constat F-31, et ses DEUX causes
# ─────────────────────────────────────────────────────────────────────────────
# Le constat, tel qu'il a été rendu : « ZAP_BLOQUANT est resté à 'false' alors
# que son point de contrôle exigeait la bascule à la porte L2, et le job est
# skippé depuis le 2026-09-02 ». Mesuré ensuite, run par run :
#
# CAUSE 1 — POURQUOI LE JOB NE TOURNAIT PLUS. Ce fichier n'a jamais été skippé
#   par lui-même. Il est appelé par `deploy-staging.yml`, où le job `securite`
#   déclarait `needs: [deployer]` SANS `if:` — donc `success()` implicite. Le job
#   `deployer` porte, dans une seule étape shell sous `set -e`, la livraison ET
#   des contrôles de GOUVERNANCE qui viennent APRÈS elle (empreinte du script
#   distant, fraîcheur du clone du serveur). Depuis le 2026-09-02, l'un de ces
#   contrôles rougit — le staging, lui, est bel et bien en service. Le scan de
#   sécurité était donc devenu le DOMMAGE COLLATÉRAL d'un défaut d'hygiène de
#   dépôt sans rapport avec lui. Le couplage est corrigé dans `deploy-staging.yml`
#   (le scan suit désormais un FAIT MESURÉ — « staging répond » — et non
#   l'absence de tout défaut ailleurs). Dernier scan réel : run 33603477826,
#   2026-09-02 07h35 UTC. Premier run skippé : 33643594297, 2026-09-02 14h40 UTC.
#
# CAUSE 2 — ET CELLE-CI EST PIRE, PARCE QU'ELLE ÉTAIT INVISIBLE. La bascule
#   `ZAP_BLOQUANT: 'true'` promise à la porte L2 était un GESTE VIDE : le scan
#   passait `-I` à `zap-baseline.py` (« do not return failure on warning »), qui
#   transforme un code 2 en code 0. Or aucune règle n'est configurée au niveau
#   FAIL : le code 1 ne pouvait pas survenir non plus. Le seul code atteignable
#   était donc 0, et la branche `ZAP_BLOQUANT=true` du verdict était MORTE.
#   Quiconque aurait fait la bascule demandée à la porte L2 aurait coché un
#   critère sans rien armer. Le commentaire du fichier aggravait le piège en
#   énonçant une table de codes fausse (« 2 = avertissements (avec -I) » : c'est
#   l'inverse, `-I` supprime le 2).
#   MESURE A/B, 2026-09-05, même cible, même heure, image
#   ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef :
#     zap-baseline.py -a      → code 2   (7 WARN-NEW)
#     zap-baseline.py -a -I   → code 0   (les MÊMES 7 WARN-NEW)
#   `-I` est retiré. La garde est désormais ARMABLE.
#
# ─────────────────────────────────────────────────────────────────────────────
# CE QUE LE SCAN COUVRE — ET CE QU'IL NE COUVRE PAS. À LIRE AVANT DE S'EN SERVIR
# ─────────────────────────────────────────────────────────────────────────────
# CONSTAT MESURÉ (2026-09-05) : le scan ne voyait que **6 URL** — la coquille
# statique d'`apps/field`. Ni `/hq`, ni `/api`, ni aucune route
# d'authentification. Basculer `ZAP_BLOQUANT` dans cet état aurait fait rougir
# `main` sur les en-têtes d'une page statique SANS garder la surface qu'il
# fallait garder. D'où la condition posée par A01 (DECISIONS.md, 2026-09-05,
# « ZAP : l'arbitrage EN ATTENTE est rendu ») : **avant P-C, le scan doit
# couvrir `/hq` et `/api`** ; le dossier de porte P-C coche la couverture
# étendue **PUIS** la bascule. Ce fichier livre la PREMIÈRE moitié, et rien
# d'autre : `ZAP_BLOQUANT` reste à 'false' — la bascule n'appartient pas à ce
# commit.
#
# POURQUOI TROIS EXÉCUTIONS ET NON UNE — le choix de forme, et ses concurrents.
#   `zap-baseline.py` prend **UNE** cible (`-t`) et araigne depuis elle. Les
#   deux fronts sont des SPA : leur `index.html` ne contient qu'un `<script
#   type="module">` et son manifeste — il n'y a RIEN à crawler, et c'est là
#   toute l'explication des 6 URL. Aucun réglage de ZAP ne répare cela.
#   Ont été examinés puis écartés :
#     · `zap-api-scan.py -f openapi` — **hors de portée** : le dépôt n'a AUCUNE
#       spec OpenAPI et `@fastify/swagger` n'est pas dans la liste épinglée
#       (11 §1). L'ajouter serait une dépendance hors liste (CLAUDE.md §3-1),
#       donc un arbitrage humain, pas un geste d'outillage.
#     · un fichier de CONTEXTE ZAP — il borne la PORTÉE d'un scan, il ne fournit
#       pas de points d'entrée. Il ne crée aucune URL à voir.
#     · `-z` (options passées à ZAP) — ne sait pas amorcer une liste d'URL.
#     · une MATRICE de jobs — techniquement possible, mais elle délègue
#       l'agrégation du verdict à la sémantique de GitHub. Or `fail-fast`
#       annulerait des scans frères, et un job `cancelled` ne rougit pas plus
#       qu'un `skipped` : ce serait remettre en place la mécanique EXACTE de
#       F-31. La boucle ci-dessous garde l'agrégation dans un script VERSIONNÉ
#       et ÉPROUVÉ (`zap-verdict.sh` + sa table de vérité), ce qu'une matrice ne
#       permet pas.
#   Donc : une boucle sur des points d'entrée nommés, un rapport par cible, et
#   UN verdict qui prend le PLUS SÉVÈRE des codes. Coût : ~3× le temps de scan
#   (d'où `timeout-minutes: 30`), une seule image tirée.
#
# CE QUE CETTE COUVERTURE ATTEINT RÉELLEMENT :
#   · les en-têtes de réponse de la coquille terrain (inchangé) ;
#   · les en-têtes ET les fichiers de la coquille CONSOLE (`/hq/`), qui a ses
#     propres assets, son propre `Cache-Control` et son `X-Robots-Tag` ;
#   · les en-têtes des réponses de l'**API elle-même** (helmet, CSP `'none'`,
#     HSTS, type de contenu, fuite éventuelle de bannière serveur) sur une
#     réponse 200 réelle.
#
# CE QU'ELLE N'ATTEINT PAS — ET IL FAUT LE DIRE, PAS LE LAISSER CROIRE :
#   · AUCUNE route authentifiée. Un scan passif non authentifié ne voit pas une
#     ligne de ce que l'invariant 3 protège (RBAC, `scoping_financials`,
#     propriété des écritures de sync). Ces murs se testent par les tests
#     d'intrusion croisés de la porte P-B, PAS par ZAP.
#   · AUCUN `Set-Cookie`. Les attributs `httpOnly` / `Secure` / `SameSite` des
#     cookies de la console (11 §3) n'apparaissent que sur une réponse de
#     `POST /api/v1/auth/login` AVEC des identifiants valides. Un spider fait du
#     GET : il obtient 404 et ne voit rien. C'est la moitié authentifiée, et
#     elle est BLOQUÉE sur un geste humain (aucun compte de test de staging
#     n'existe, aucun secret ne le porte).
#   · `/v1/auth/*` n'est DÉLIBÉRÉMENT pas un point d'entrée du spider : en GET
#     ces routes rendent 404 (valeur passive nulle) et elles portent le plafond
#     de 10 req/min/IP (11 §3) — le scanner mesurerait le limiteur au lieu de la
#     route, et consommerait le quota de connexion de son adresse.
#   · AUCUNE règle active : `zap-baseline.py` est un scan PASSIF. Pas
#     d'injection, pas de traversée, pas de force brute.
#   Conclusion sans détour : **cette extension ne coche pas le point 7 du
#   dossier P-C**. Elle rend la bascule `ZAP_BLOQUANT` DÉFENDABLE ; elle ne
#   remplace aucun test d'autorisation.
#
# EFFET ATTENDU SUR LE DÉCOMPTE : plus de surface = PLUS d'alertes que les 12
# de la mesure du 2026-09-05. C'est le RÉSULTAT RECHERCHÉ, pas une régression.
# AUCUN seuil n'est baissé, `-I` n'est pas remis.
#
# ─────────────────────────────────────────────────────────────────────────────
# `.zap/rules.tsv` — CE QUI EST EXCLU, CE QUI EST NOMMÉ, ET LA DIFFÉRENCE
# ─────────────────────────────────────────────────────────────────────────────
# Ce bandeau disait, jusqu'au 2026-09-09 : « AUCUNE règle n'est exclue —
# l'option 3 (rendre bloquant en excluant les règles gênantes) a été écartée en
# toutes lettres ». Cette doctrine du 2026-09-05 TIENT TOUJOURS, et elle est
# AMENDÉE sur un seul point (A01, DECISIONS.md 2026-09-08, « .zap/rules.tsv :
# l'exclusion que j'ai interdite, ou le périmètre que je n'ai pas nommé ? »).
# Le dépouillement d'A51 (docs/securite/DOSSIER_ZAP_2026-09-08.md §1, §5) a
# corrigé une PRÉMISSE : quatre des sept familles n'étaient pas « gênantes »,
# elles sont INGUÉRISSABLES PAR TOUT ÉTAT DU CODE — 90005 juge la REQUÊTE du
# scanner, 10109 constate la SPA que 11 §2 impose, 10094 pointe la police
# empreintée par Vite et la table d'encodage de hash-wasm (11 §1), 10049
# décrit la politique de cache que 05 §31 prescrit. Sans les nommer, la
# bascule promise à P-C est INATTEIGNABLE, et une garde inatteignable finit
# désarmée : F-31, une troisième fois.
#
# LA LIGNE DE PARTAGE, telle qu'A01 l'a tracée :
#   · EXCLURE UNE RÈGLE POUR VERDIR UN JOB — toujours interdit. C'est l'option 3,
#     et elle reste écartée. Un scan vert par exclusion est le contrôle-qui-ment.
#   · NOMMER, RÈGLE PAR RÈGLE, AVEC JUSTIFICATION TECHNIQUE ET DATE DE RÉEXAMEN,
#     ce que ce scanner NE PEUT PAS MESURER — c'est le geste INVERSE : il rend
#     la limite relisible, là où sept familles logées dans un `::warning` que
#     personne n'est obligé de lire ne la rendaient visible à personne.
# Le scan passe donc `-c rules.tsv` (`.zap/rules.tsv`, monté en LECTURE SEULE).
# Les quatre conditions cumulatives d'A01, faute desquelles une ligne est
# REFUSÉE en revue croisée : (1) une ligne = une règle, sa justification
# TECHNIQUE et une date de réexamen ; (2) AUCUNE ligne pour une règle qu'un
# changement du produit fermerait — 10055 et 90004 n'y ont pas leur place,
# elles sont fermées dans infra/caddy/Caddyfile ; (3) le fichier est du CODE :
# revue croisée, un ajout se voit en diff ; (4) créé et câblé pendant que
# ZAP_BLOQUANT vaut 'false', sans effet sur aucun verdict, pour que le run à
# 0/0/0 soit une OBSERVATION et non un pari.
# L'étape « Contrôler la forme de .zap/rules.tsv » fait de la condition (1) une
# GARDE MÉCANIQUE (forme, justification non vide, date de réexamen présente ET
# NON ÉCHUE) : sans elle, la condition ne tenait que par la revue.
# Les alertes ignorées RESTENT dans le JSON du rapport (mesuré par A11 en le
# dépouillant) : le décompte du résumé les montre encore, ÉTIQUETÉES, jamais
# retirées. Le retrait d'une ligne se fait ligne par ligne, à sa date.
#
# ─────────────────────────────────────────────────────────────────────────────
# STATUT BLOQUANT — CE QUI EST DÉCIDÉ, CE QUI NE L'EST PAS
# ─────────────────────────────────────────────────────────────────────────────
# BLOQUANT EN TOUTES CIRCONSTANCES, sans passer par `ZAP_BLOQUANT` :
#   · code 3 — le scanner n'a pas pu s'exécuter. Un scan qui ne tourne pas n'est
#     pas un « scan non bloquant », c'est une ABSENCE de scan déguisée en scan.
#   · code 1 — une règle de niveau FAIL a tiré (arbitrage déjà rendu).
#   · code inconnu, ZAP_BLOQUANT mal orthographié, rapport JSON manquant.
#
# SOUMIS À `ZAP_BLOQUANT` : le code 2 (avertissements). Il reste à 'false' à ce
# jour, et c'est un ARBITRAGE RENDU, borné et daté : DECISIONS.md, 2026-09-05,
# « ZAP : l'arbitrage EN ATTENTE de l'entrée précédente est rendu » — option 2,
# **échéance porte P-C**, bascule conditionnée à la couverture étendue de `/hq`
# et `/api`. AUCUN seuil n'a été baissé, et AUCUNE règle n'est exclue pour
# obtenir un vert : les quatre lignes de `.zap/rules.tsv` nomment ce que le
# scanner ne peut pas mesurer (bloc précédent, A01 2026-09-08), elles ne
# ferment rien qu'un changement du produit fermerait.
#
# CE QUI EST MESURÉ À CE JOUR — ET CE QUI NE L'EST PAS ENCORE (2026-09-09) :
#   · MESURÉ, EN LOCAL, EN HTTP (A11, harnais e2e/fixtures/caddy-servi.ts,
#     image :stable) : `zap-baseline.py -a -c rules.tsv` rend terrain=0
#     console=0 api=0 — FAIL-NEW 0 · WARN-NEW 0 · IGNORE 4 · PASS 66.
#   · PAS ENCORE MESURÉ : le même run sur STAGING, EN TLS, par ce workflow
#     (`workflow_dispatch`). Il PEUT différer : HSTS (10035) n'est évalué qu'en
#     HTTPS, la surface réelle porte ce que le harnais n'a pas (certificat,
#     redirections, en-têtes posés par l'hébergeur), et `:stable` a pu bouger.
#     Tant que ce run n'a pas rendu 0/0/0 avec `ZAP_BLOQUANT` ENCORE à 'false',
#     la bascule serait un PARI. C'est l'étape 3 du cliquet (DOSSIER_ZAP §5).
#
# ⚠️ AU DOSSIER DE PORTE P-C, DANS CET ORDRE, ET RIEN N'EST SAUTÉ :
#   (1) constater la couverture étendue sur un run réel — trois cibles, trois
#       rapports, trois codes ;
#   (2) constater, sur un `workflow_dispatch` contre STAGING EN TLS, avec ce
#       fichier de règles et `ZAP_BLOQUANT: 'false'` : codes `terrain=0
#       console=0 api=0`, résumé « ignorées par .zap/rules.tsv » = 4 sur chaque
#       cible et AUCUNE autre alerte de niveau WARN, l'étape « Contrôler la
#       forme de .zap/rules.tsv » verte, et le digest relevé par « Identifier
#       l'image ZAP » ;
#   (3) SEULEMENT ENSUITE, DANS LE MÊME COMMIT : passer `ZAP_BLOQUANT` à 'true'
#       ET épingler `ZAP_IMAGE` sur le digest de CE run (2). Une porte bloquante
#       doit être reproductible, et un digest relevé sur un autre run que celui
#       qui a rendu 0/0/0 ne prouve rien.
# La bascule n'est PAS un geste d'outillage : elle se coche à la porte, par
# Williams. Ce fichier ne la fait pas — il rend l'observation (2) lisible.
#
# La garde elle-même vit dans `.github/scripts/zap-verdict.sh` et sa table de
# vérité est REJOUÉE À CHAQUE RUN (`zap-verdict.test.sh`, **27 cas** depuis
# l'extension multi-cibles du 2026-09-07). Le point de contrôle L2 avait échoué
# faute d'être éprouvable : il ne le sera plus.
# ─────────────────────────────────────────────────────────────────────────────
#
# Traçabilité E36/E43 — lot L0 (outillage), exploité par A51 dès L2.
# =============================================================================

name: ZAP baseline

on:
  workflow_call:
    inputs:
      cible:
        description: 'URL de base à scanner (staging après déploiement).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      cible:
        description: 'URL de base à scanner. Vide = vars.STAGING_BASE_URL.'
        required: false
        default: ''
        type: string
  # ---------------------------------------------------------------------------
  # LA SENTINELLE — c'est elle qui aurait vu F-31 en moins de 24 h.
  # ---------------------------------------------------------------------------
  # Tant que le scan ne s'exécutait QUE dans la foulée d'un déploiement, son
  # absence était indiscernable d'une absence de déploiement : deux jours ont
  # passé sans une ligne ZAP, et rien dans le dépôt ne le disait. Un scan
  # nocturne rend cette absence BRUYANTE — s'il ne peut pas tourner, il rougit
  # (code 3), et le rouge porte une date.
  # ---------------------------------------------------------------------------
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # `cancel-in-progress: false`, DÉLIBÉRÉMENT. Annuler un scan de sécurité pour
  # économiser des minutes de runner produit exactement ce que ce fichier
  # corrige : une absence de preuve que personne ne relit. Un scan commencé va
  # au bout ; au pire il attend.
  group: zap-${{ inputs.cible || vars.STAGING_BASE_URL || github.ref }}
  cancel-in-progress: false

env:
  # Voir le bandeau : 'false' est un ARBITRAGE EN ATTENTE, tracé et daté dans
  # DECISIONS.md (2026-09-05, amendé le 2026-09-08 sur le seul point du fichier
  # de règles). Les codes 1 et 3 restent bloquants quoi qu'il arrive — ce
  # drapeau ne gouverne QUE le code 2. Il reste à 'false' TANT QUE le run sur
  # staging en TLS (bandeau, « ce qui n'est pas encore mesuré ») n'a pas rendu
  # 0/0/0 ; la bascule et l'épinglage du digest vont dans le même commit.
  ZAP_BLOQUANT: 'false'
  # ---------------------------------------------------------------------------
  # IMAGE ZAP — `:stable` EST UN TAG MOBILE. Ce n'est PAS un épinglage.
  # ---------------------------------------------------------------------------
  # Gardé mobile tant que le scan n'est pas bloquant : les règles PASSIVES de ZAP
  # sont la matière même du contrôle, et un scanner figé cesse silencieusement de
  # détecter les classes de défaut apparues après son gel — il devient vert pour
  # de mauvaises raisons. Le gel du 11 §1 vise ce qui ENTRE dans le produit ; ZAP
  # l'inspecte depuis l'extérieur.
  # Contrepartie assumée : le run n'est pas reproductible à l'identique, donc
  # l'étape « Identifier l'image ZAP » journalise le DIGEST réellement tiré, qui
  # est archivé avec le rapport. On sait toujours APRÈS COUP ce qui a tourné.
  # ⚠️ À épingler sur ce digest le jour où ZAP_BLOQUANT passe à 'true'.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
  # ---------------------------------------------------------------------------
  # POINTS D'ENTRÉE DU SPIDER — `<étiquette>=<chemin>`, un par ligne.
  # ---------------------------------------------------------------------------
  # L'étiquette nomme la cible dans le rapport, dans le résumé de job et dans le
  # verdict : un rouge doit dire LAQUELLE des trois, sans ouvrir d'artefact.
  # Elle est contrainte à [a-z0-9-] (elle devient un nom de dossier).
  # Le chemin est concaténé à l'URL de base ; il commence par `/`.
  #
  # Le routage vient de `infra/caddy/Caddyfile` — un seul domaine, pas de CORS
  # (11 §2) :
  #   `/`               → PWA terrain (apps/field)
  #   `/hq/`            → console siège (apps/hq). LA BARRE FINALE EST REQUISE :
  #                       `/hq` rend un 308 vers `/hq/`
  #                       (infra/caddy/fronts.static.caddy) et le spider
  #                       dépenserait son amorce sur une redirection.
  #   `/api/*`          → API, préfixe RETIRÉ → l'API voit `/v1/…`. D'où
  #                       `/api/v1/health`, choisie parce qu'elle rend un **200
  #                       JSON réel** : c'est la seule façon de faire analyser à
  #                       ZAP les en-têtes que l'API pose ELLE-MÊME (helmet,
  #                       06 §10.2) plutôt que ceux de Caddy sur un 404.
  #
  # NE PAS Y AJOUTER `/api/v1/auth/*` : voir le bandeau (404 en GET, valeur
  # passive nulle, et le plafond de 10 req/min/IP du 11 §3 que le scanner
  # consommerait). Ce qu'il faudrait vraiment y voir — les attributs des cookies
  # de session — exige un scan AUTHENTIFIÉ, qui n'existe pas encore.
  ZAP_CHEMINS: |
    terrain=/
    console=/hq/
    api=/api/v1/health

jobs:
  baseline:
    name: Scan passif (baseline)
    runs-on: ubuntu-latest
    # 20 min suffisaient pour UNE cible. Il y en a trois, chacune avec son
    # araignée (1 min) et son attente de scan passif. Marge prise sur mesure :
    # ~4 min par cible observées le 2026-09-05, ×3, plus le tirage de l'image.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # -----------------------------------------------------------------------
      # LA GARDE MORD-ELLE ENCORE ? On le vérifie AVANT de scanner.
      # -----------------------------------------------------------------------
      # 27 cas, une seconde. C'est le contrôle qui manquait le 2026-09-02 : la
      # logique de verdict vivait en ligne dans ce fichier, donc personne ne
      # pouvait l'exécuter, donc personne n'a vu qu'elle ne pouvait plus mordre.
      # Ce test échoue AVANT le scan : un résultat rendu par une garde cassée ne
      # vaut rien, et il vaut mieux ne rien conclure que conclure faux.
      # 14 cas ont été AJOUTÉS le 2026-09-07 avec le multi-cibles. Ils ne sont
      # pas décoratifs : mesuré, l'ancienne table de 13 cas reste **13/13 VERTE**
      # face à un verdict dont l'agrégation aurait été une moyenne — celui qui
      # laisse passer un code 3 sur `/api` entre deux cibles à 0. Le défaut que
      # ce fichier corrige serait revenu par la porte de l'agrégation.
      # -----------------------------------------------------------------------
      - name: Éprouver la garde (table de vérité du verdict)
        run: bash .github/scripts/zap-verdict.test.sh

      # -----------------------------------------------------------------------
      # LE FICHIER DE RÈGLES A-T-IL LA FORME QU'A01 EXIGE ? Vérifié AVANT le scan.
      # -----------------------------------------------------------------------
      # Condition (1) d'A01 (DECISIONS.md 2026-09-08) : « une ligne = une règle,
      # sa justification TECHNIQUE et une date de réexamen ». Une condition qui
      # ne tient que par la revue croisée est une condition qui ne tient qu'une
      # fois ; celle-ci est rejouée à CHAQUE run. Ce qu'elle vérifie, par ligne
      # agissante (ni vide, ni `#`) : QUATRE colonnes tabulées (le format de
      # zap_common.py::load_config — une cinquième tabulation ferait passer un
      # bout de justification pour une colonne inconnue) ; un identifiant
      # numérique ; un niveau parmi IGNORE|INFO|WARN|FAIL ; un nom entre
      # parenthèses ; une justification d'au moins 40 caractères (un « ok » ne
      # justifie rien) ; une mention « Réexamen AAAA-MM-JJ » ; et cette date NON
      # ÉCHUE — l'en-tête du fichier dit « jamais à laisser courir », donc une
      # date dépassée ROUGIT ici, avec le numéro de la règle, au lieu de courir
      # en silence. Le fichier absent rougit ici aussi : `-c rules.tsv` sans
      # fichier ferait rendre 3 à ZAP vingt minutes plus tard, sans dire pourquoi.
      # BLOQUANT quel que soit ZAP_BLOQUANT : c'est la forme du fichier qui est
      # jugée, pas le résultat du scan — condition (4), le verdict n'est pas
      # touché.
      # -----------------------------------------------------------------------
      - name: Contrôler la forme de .zap/rules.tsv
        run: |
          set -euo pipefail
          f='.zap/rules.tsv'
          [ -s "${f}" ] || { echo "::error title=.zap/rules.tsv absent::Le scan passe « -c rules.tsv » : sans le fichier, ZAP rendrait 3 vingt minutes plus tard sans dire pourquoi. BLOQUANT."; exit 1; }
          aujourdhui="$(date -u +%F)"; n=0; defauts=0
          while IFS= read -r ligne || [ -n "${ligne}" ]; do
            case "${ligne}" in ''|'#'*) continue ;; esac
            n=$((n + 1)); motif=''
            IFS=$'\t' read -r id niveau nom justif <<< "${ligne}"
            [ "$(printf '%s' "${ligne}" | tr -cd '\t' | wc -c)" -eq 3 ] || motif='quatre colonnes séparées par UNE tabulation attendues'
            printf '%s' "${id:-}" | grep -Eq '^[0-9]+$' || motif="${motif:-identifiant de règle non numérique}"
            case "${niveau:-}" in IGNORE|INFO|WARN|FAIL) ;; *) motif="${motif:-niveau « ${niveau:-} » hors IGNORE|INFO|WARN|FAIL}" ;; esac
            case "${nom:-}" in '('*')') ;; *) motif="${motif:-nom de règle non parenthésé}" ;; esac
            [ "${#justif}" -ge 40 ] || motif="${motif:-justification vide ou trop courte (moins de 40 caractères)}"
            reexamen="$(printf '%s' "${justif:-}" | grep -Eo 'Réexamen [0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | cut -d' ' -f2 || true)"
            [ -n "${reexamen}" ] || motif="${motif:-aucune mention « Réexamen AAAA-MM-JJ »}"
            if [ -n "${reexamen}" ] && [ "${reexamen}" \< "${aujourdhui}" ]; then motif="${motif:-date de réexamen ÉCHUE (${reexamen}) : ligne à retirer ou à re-dater EN REVUE, jamais à laisser courir}"; fi
            if [ -n "${motif}" ]; then echo "::error file=${f},title=.zap/rules.tsv — ligne refusée::règle ${id:-?} : ${motif}. Condition A01 (1), DECISIONS.md 2026-09-08."; defauts=$((defauts + 1)); fi
          done < "${f}"
          [ "${n}" -gt 0 ] || { echo "::error title=.zap/rules.tsv sans ligne agissante::Le fichier n'a que des commentaires. Soit il n'a pas lieu d'être passé par -c, soit une ligne a été perdue : dans les deux cas on ne scanne pas sur un doute."; exit 1; }
          [ "${defauts}" -eq 0 ] || { echo "::error title=.zap/rules.tsv non conforme::${defauts} ligne(s) refusée(s) sur ${n}. Le scan ne part pas sur un fichier de règles dont la forme n'est pas celle qu'A01 a posée."; exit 1; }
          echo "${n} ligne(s) agissante(s), toutes conformes (quatre colonnes, justification, réexamen daté et non échu au ${aujourdhui})."

      # -----------------------------------------------------------------------
      # LES CIBLES — une base, N points d'entrée, et RIEN n'est deviné.
      # -----------------------------------------------------------------------
      # Cette étape refuse de partir sur une liste vide ou malformée. Motif : le
      # verdict est rendu sur des codes, et une liste vide produirait un job vert
      # qui n'a rien scanné. C'est la forme pure de F-31, et elle doit mourir ici
      # plutôt que d'être rattrapée trois étapes plus loin.
      # -----------------------------------------------------------------------
      - name: Déterminer les cibles
        id: cible
        env:
          CIBLE_DEMANDEE: ${{ inputs.cible }}
          CIBLE_DEFAUT: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          base="${CIBLE_DEMANDEE:-}"
          if [ -z "${base}" ]; then
            # Cas du déclenchement nocturne (aucun `inputs`) ou d'un dispatch
            # laissé vide : on retombe sur la variable de dépôt.
            base="${CIBLE_DEFAUT:-}"
          fi
          if [ -z "${base}" ]; then
            echo "::error title=Cible ZAP absente::Aucune URL fournie et vars.STAGING_BASE_URL est vide (GitHub → Settings → Secrets and variables → Actions → Variables). Sans cible, il n'y a pas de scan — et un job vert sans scan est exactement le défaut F-31."
            exit 1
          fi
          # L'URL DE BASE EST VALIDÉE COMME LE RESTE, et elle ne l'était pas.
          # Réserve R3 d'A17 : l'étape validait l'étiquette (deux contrôles) et
          # le chemin (deux contrôles) mais acceptait `example.com` sans schéma
          # et `https://s/ /x` avec une espace — cette dernière se scindant en
          # DEUX éléments dans la boucle de scan. Fail-closed en aval dans les
          # deux cas (ZAP rend 3, ou le rapport manque), donc jamais de vert
          # imprudent ; mais une étape qui se dit validante ne laisse pas sa
          # seule entrée libre du dehors sans contrôle.
          case "${base}" in
            *[[:space:]]*)
              echo "::error title=URL de base ZAP invalide::« ${base} » contient une espace. L'URL est développée sans guillemets dans la boucle de scan : elle se scinderait en plusieurs cibles, et le scan viserait autre chose que ce qui est écrit."
              exit 1
              ;;
            https://*|http://*) ;;
            *)
              echo "::error title=URL de base ZAP sans schéma::« ${base} » ne commence ni par https:// ni par http://. ZAP ne saurait pas quoi en faire, et le job rougirait vingt minutes plus tard sur un code 3 au lieu de rougir ici."
              exit 1
              ;;
          esac
          base="${base%/}"

          cibles=''
          nb=0
          # Les étiquettes déjà vues — l'unicité N'ÉTAIT PAS contrôlée alors que
          # l'étiquette « devient un nom de dossier ». Réserve R2 d'A17, mesurée :
          # avec deux cibles étiquetées `terrain`, deux scans tournent mais UN
          # SEUL rapport survit (le second écrase le premier), l'artefact n'en
          # contient qu'un, et le résumé imprime deux lignes qui lisent toutes
          # deux le MÊME rapport — un décompte faux, dans le sens flatteur.
          # Le verdict, lui, restait juste (les deux codes sont dans la liste) :
          # c'est donc un piège tendu à qui ajoutera la quatrième cible, pas un
          # défaut vivant. On le ferme avant qu'il ne morde.
          vues=' '
          while IFS= read -r ligne; do
            ligne="$(printf '%s' "${ligne}" | tr -d '[:space:]')"
            [ -z "${ligne}" ] && continue
            etiquette="${ligne%%=*}"
            chemin="${ligne#*=}"
            if ! printf '%s' "${etiquette}" | grep -Eq '^[a-z0-9-]+$'; then
              echo "::error title=Étiquette de cible invalide::« ${etiquette} » n'est pas dans [a-z0-9-]. L'étiquette devient un nom de dossier de rapport et le nom que porte le verdict : elle doit être lisible et sûre. Corriger ZAP_CHEMINS dans ce fichier."
              exit 1
            fi
            case "${chemin}" in
              /*) ;;
              *)
                echo "::error title=Chemin de cible invalide::« ${chemin} » (étiquette ${etiquette}) ne commence pas par « / ». Le chemin est concaténé à l'URL de base ; sans barre initiale l'URL produite viserait autre chose que ce qui est écrit."
                exit 1
                ;;
            esac
            case "${vues}" in
              *" ${etiquette} "*)
                echo "::error title=Étiquette de cible en double::« ${etiquette} » apparaît deux fois dans ZAP_CHEMINS. L'étiquette est un nom de dossier : le second scan ÉCRASERAIT le rapport du premier, l'artefact n'en porterait qu'un, et le résumé imprimerait deux lignes lisant le même fichier — un décompte faux dans le sens rassurant. Le verdict resterait juste, ce qui rend le défaut d'autant plus discret."
                exit 1
                ;;
            esac
            vues="${vues}${etiquette} "
            cibles="${cibles} ${etiquette}=${base}${chemin}"
            nb=$((nb + 1))
          done <<< "${ZAP_CHEMINS}"

          if [ "${nb}" -eq 0 ]; then
            echo "::error title=Aucun point d'entrée à scanner::ZAP_CHEMINS est vide. Un scan sans cible est un job vert qui ne mesure rien — c'est exactement F-31. BLOQUANT."
            exit 1
          fi

          echo "cibles=${cibles# }" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Base : ${base}"
          echo "${nb} point(s) d'entrée :${cibles}"

      # `:stable` étant un tag MOBILE (voir bloc `env:`), on relève le digest
      # RÉELLEMENT tiré : c'est la seule trace qui rende le run analysable après
      # coup, et c'est la valeur à épingler le jour de la bascule bloquante.
      - name: Identifier l'image ZAP réellement utilisée (digest)
        id: image
        run: |
          set -euo pipefail
          docker pull "${ZAP_IMAGE}" >/dev/null
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${ZAP_IMAGE}")"
          echo "Image ZAP tirée : ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # UNE EXÉCUTION PAR POINT D'ENTRÉE — un rapport par cible, un code par
      # cible. La boucle ne s'arrête PAS à la première cible fâchée : un scan
      # abandonné en cours de route rendrait une couverture partielle qu'on
      # croirait complète.
      # -----------------------------------------------------------------------
      - name: Lancer zap-baseline.py sur chaque point d'entrée
        id: scan
        env:
          CIBLES: ${{ steps.cible.outputs.cibles }}
        run: |
          # `set +e` volontaire : le code de retour de ZAP est ici une DONNÉE,
          # tranchée explicitement par `.github/scripts/zap-verdict.sh`. Ce n'est
          # pas un masquage d'échec — rien n'est perdu (09 §5.7). L'absence de
          # rapport est contrôlée à l'étape suivante, sous `set -e`.
          set +e
          set -uo pipefail
          codes=''
          for entree in ${CIBLES}; do
            etiquette="${entree%%=*}"
            url="${entree#*=}"
            mkdir -p "rapport-zap/${etiquette}"
            # 777 : le conteneur ZAP écrit sous son propre uid dans /zap/wrk.
            chmod 777 "rapport-zap/${etiquette}"
            echo "::group::ZAP baseline — ${etiquette} → ${url}"
            # PAS de `-I` : ce drapeau supprimait le code 2 et rendait toute
            # bascule bloquante inopérante (voir bandeau, cause 2). `-a` conserve
            # les règles passives alpha. AUCUN seuil abaissé.
            # `-c rules.tsv` : ce commentaire disait « AUCUN `-c … IGNORE` »
            # jusqu'au 2026-09-09. Il est AMENDÉ, pas effacé : ce que la doctrine
            # du 2026-09-05 interdit — exclure une règle pour verdir un job —
            # reste interdit. Ce que `.zap/rules.tsv` fait est le geste inverse
            # (A01, DECISIONS.md 2026-09-08 ; bandeau, « ce qui est exclu, ce
            # qui est nommé ») : nommer, règle par règle, avec justification et
            # date de réexamen, les quatre familles qu'aucun état du code ne
            # peut fermer. Le chemin est joint à /zap/wrk/ par zap-baseline.py
            # (zap_common.py::load_config, vérifié par A11) ; le fichier est
            # monté en LECTURE SEULE par-dessus le dossier de rapport, et sa
            # forme a été contrôlée deux étapes plus haut. Les alertes ignorées
            # RESTENT dans le JSON : le résumé les étiquette, il ne les retire pas.
            docker run --rm \
              -v "${GITHUB_WORKSPACE}/rapport-zap/${etiquette}:/zap/wrk:rw" \
              -v "${GITHUB_WORKSPACE}/.zap/rules.tsv:/zap/wrk/rules.tsv:ro" \
              "${ZAP_IMAGE}" \
              zap-baseline.py \
                -t "${url}" \
                -r rapport-zap.html \
                -J rapport-zap.json \
                -a \
                -c rules.tsv
            # Relevé IMMÉDIATEMENT : la moindre commande intercalée (un `echo`
            # d'endgroup, par exemple) écraserait `$?` par SON propre statut.
            code=$?
            echo "::endgroup::"
            echo "ZAP [${etiquette}] ← ${url} → code ${code}"
            codes="${codes} ${etiquette}=${code}"
          done
          echo "codes=${codes# }" >> "$GITHUB_OUTPUT"
          echo "Codes relevés :${codes}"

      # -----------------------------------------------------------------------
      # UN SCAN SANS RAPPORT N'EST PAS UN SCAN.
      # -----------------------------------------------------------------------
      # Le rapport est la seule chose qu'un humain relira à la porte. S'il
      # manque, on ne conclut pas : on rougit. Ce contrôle est indépendant du
      # code de retour — un ZAP qui rend 0 sans écrire son JSON n'a rien prouvé.
      # Il vaut CIBLE PAR CIBLE : deux rapports sur trois, c'est une couverture
      # de deux tiers présentée comme entière.
      # -----------------------------------------------------------------------
      - name: Contrôler que chaque rapport existe
        env:
          CIBLES: ${{ steps.cible.outputs.cibles }}
        run: |
          set -euo pipefail
          manquants=''
          for entree in ${CIBLES}; do
            etiquette="${entree%%=*}"
            fichier="rapport-zap/${etiquette}/rapport-zap.json"
            # `-s` NE SUFFIT PAS, et c'est la question 5 posée à l'envers.
            # Réserve R4 d'A17, mesurée : un fichier contenant `{}` — trois
            # octets — passe « rapport présent », puis le décompte rend 0 sur
            # les quatre sévérités. Le seul endroit du fichier où le contrôle
            # d'existence et le décompte peuvent, ENSEMBLE, rassurer sur rien.
            # On exige donc que le JSON soit valide ET qu'il porte un `site` :
            # c'est la structure que le décompte lit ensuite, et un rapport qui
            # ne la porte pas n'est pas un rapport de scan.
            if [ ! -s "${fichier}" ]; then
              manquants="${manquants} ${etiquette}"
            elif ! jq -e 'has("site") and (.site | type == "array")' "${fichier}" >/dev/null 2>&1; then
              echo "::error title=Rapport ZAP sans site::${fichier} est un JSON qui ne porte pas de tableau « site » — c'est la structure que lit le décompte par sévérité. Un rapport qui ne l'a pas ferait afficher des zéros partout : rassurant, et faux. BLOQUANT quel que soit ZAP_BLOQUANT."
              manquants="${manquants} ${etiquette}"
            else
              echo "Rapport JSON présent et structuré pour ${etiquette} ($(wc -c < "${fichier}") octets)."
            fi
          done
          if [ -n "${manquants}" ]; then
            echo "::error title=Rapport ZAP absent::Aucun JSON exploitable pour :${manquants}. Le scanner n'a rien produit pour ces cibles : on ne peut ni conclure ni relire à la porte, et la couverture annoncée ne serait pas celle qui a tourné. BLOQUANT quel que soit ZAP_BLOQUANT."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # LE DÉCOMPTE SE LIT SANS TÉLÉCHARGER QUOI QUE CE SOIT.
      # -----------------------------------------------------------------------
      # Le rapport ne sert à rien s'il faut le télécharger pour savoir s'il y a
      # quelque chose dedans. Le RÉSUMÉ DE JOB est le bon canal, et c'est mesuré :
      # le rapporteur `github` ne remonte PAS d'annotation sur un run vert — un
      # décompte publié par annotations serait donc invisible exactement quand on
      # veut le lire, c'est-à-dire tant que ZAP_BLOQUANT vaut 'false'.
      # Une section PAR CIBLE, plus une ligne de total : trois rapports agrégés
      # en un seul chiffre cacheraient laquelle des trois se dégrade.
      # -----------------------------------------------------------------------
      - name: Publier le décompte par sévérité (par cible)
        if: always()
        env:
          CIBLES: ${{ steps.cible.outputs.cibles }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CODES: ${{ steps.scan.outputs.codes }}
        run: |
          set -euo pipefail
          # LES ALERTES IGNORÉES PAR `.zap/rules.tsv` RESTENT DANS LE JSON (mesuré
          # par A11 en dépouillant le rapport) : `-c` change le CODE DE RETOUR,
          # pas le rapport. Le décompte les montre donc encore — et c'est voulu.
          # On les ÉTIQUETTE, on ne les retire pas : un relecteur de porte doit
          # voir les quatre familles nommées ET vérifier qu'aucune cinquième ne
          # s'est glissée sous le même chiffre. La liste des identifiants vient
          # du fichier lui-même, jamais d'une constante recopiée ici. Le `|| true`
          # ne masque rien : cette étape tourne `if: always()`, donc AUSSI quand
          # la garde de forme a déjà rougi sur un fichier absent ou vide — le
          # résumé doit alors se publier avec une liste vide, pas rougir deux fois.
          ignorees="$({ grep -v '^#' .zap/rules.tsv 2>/dev/null || true; } | awk -F'\t' '$2 == "IGNORE" { print $1 }' | jq -R . | jq -sc .)"
          {
            echo "### Scan ZAP baseline — couverture étendue (terrain · console · API)"
            echo ""
            echo "- Image : \`${DIGEST:-?}\` (tag \`${ZAP_IMAGE}\` — **mobile**, pas un épinglage)"
            echo "- Codes de retour : \`${CODES:-aucun}\` · mode bloquant sur avertissements : \`${ZAP_BLOQUANT}\`"
            echo "- Règles nommées IGNORE par \`.zap/rules.tsv\` : \`$(jq -r 'join(" ")' <<< "${ignorees}")\` — justifiées et datées (A01, DECISIONS.md 2026-09-08). Elles apparaissent CI-DESSOUS, étiquetées ; elles ne pèsent pas dans le code de retour."
            echo "- Scan **passif** et **non authentifié** : il analyse des en-têtes de réponse."
            echo "  Il ne teste NI le RBAC, NI la propriété des écritures, NI les cookies de session."
            echo "  Voir le bandeau du workflow, section « ce qu'il ne couvre pas »."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Vue d'ensemble D'ABORD : une ligne par cible, lisible d'un coup d'œil
          # dans le résumé de job, sans dépliage et sans artefact à télécharger.
          # Les quatre colonnes de sévérité COMPTENT les alertes ignorées ; la
          # dernière colonne dit combien, et « restantes » ce qui pèse vraiment.
          {
            echo "| Cible | URL | Code | High | Medium | Low | Info | dont ignorées (rules.tsv) | restantes |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for entree in ${CIBLES:-}; do
            etiquette="${entree%%=*}"
            url="${entree#*=}"
            fichier="rapport-zap/${etiquette}/rapport-zap.json"
            code='?'
            for paire in ${CODES:-}; do
              # La forme `if … fi` est retenue pour sa lisibilité, PAS parce
              # qu'un `[ … ] && code=…` serait dangereux : il ne l'est pas.
              # Mesuré le 2026-09-07, réserve R1 de la revue croisée A17 —
              # `set -euo pipefail; for p in a=1 b=2; do [ "${p%%=*}" = "zzz" ]
              # && c="${p#*=}"; done; echo APRES` → sortie 0, « APRES » affiché.
              # Le membre gauche d'une liste `&&` est EXEMPTÉ d'`errexit` ; bash
              # ne sort que si l'AND-list est la dernière commande d'une
              # fonction. Ce fichier pratique d'ailleurs ce motif vingt lignes
              # plus haut (`[ -z "${ligne}" ] && continue`).
              # La version précédente de ce commentaire affirmait l'inverse.
              # Elle condamnait donc ici ce que le fichier fait plus haut — et
              # c'est la moitié invisible de F-31 (« le commentaire aggravait le
              # piège en énonçant une table de codes fausse ») rejouée dans le
              # commit même qui la met en accusation.
              if [ "${paire%%=*}" = "${etiquette}" ]; then code="${paire#*=}"; fi
            done
            if [ -s "${fichier}" ]; then
              compte="$(jq -r --argjson ign "${ignorees}" '
                [ .site[]?.alerts[]? ] as $a
                | ( ["High","Medium","Low","Informational"]
                    | map(. as $n | [ $a[] | select(.riskdesc | startswith($n)) ] | length | tostring) )
                  + [ ([ $a[] | select(.pluginid as $p | $ign | index($p)) ] | length | tostring),
                      ([ $a[] | select(.pluginid as $p | $ign | index($p) | not) ] | length | tostring) ]
                | join(" | ")
              ' "${fichier}")"
            else
              compte="? | ? | ? | ? | ? | ?"
            fi
            echo "| \`${etiquette}\` | ${url} | ${code} | ${compte} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for entree in ${CIBLES:-}; do
            etiquette="${entree%%=*}"
            url="${entree#*=}"
            fichier="rapport-zap/${etiquette}/rapport-zap.json"
            {
              echo "#### \`${etiquette}\` — ${url}"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -s "${fichier}" ]; then
              {
                echo "| Sévérité | Alertes |"
                echo "| --- | --- |"
                jq -r '
                  [ .site[]?.alerts[]? ] as $a
                  | ["High","Medium","Low","Informational"][] as $n
                  | "| \($n) | \([ $a[] | select(.riskdesc | startswith($n)) ] | length) |"
                ' "${fichier}"
                echo ""
                jq -r --argjson ign "${ignorees}" '
                  [ .site[]?.alerts[]? ] as $a
                  | ([ $a[] | select(.pluginid as $p | $ign | index($p)) ] | length) as $ni
                  | "\($ni) alerte(s) ignorée(s) par `.zap/rules.tsv`, justifiée(s) — comptée(s) ci-dessus, sans poids dans le code de retour · \(($a | length) - $ni) restante(s)."
                ' "${fichier}"
                echo ""
                echo "<details><summary>Détail des alertes — ${etiquette}</summary>"
                echo ""
                # L'étiquette « ignorée » est calculée ici, à partir des identifiants
                # lus dans `.zap/rules.tsv` : elle dit ce que le fichier de règles
                # a réellement absorbé sur CE rapport, pas ce qu'on croit qu'il absorbe.
                jq -r --argjson ign "${ignorees}" '
                  .site[]?.alerts[]?
                  | "- **\(.riskdesc)** · [\(.pluginid)] \(.alert) — \(.instances | length) occurrence(s)"
                    + (if (.pluginid as $p | $ign | index($p)) then " — _ignorée par `.zap/rules.tsv` (justifiée, datée)_" else "" end)
                ' "${fichier}"
                echo ""
                echo "</details>"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "_Aucun rapport JSON produit pour cette cible._" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ -z "${CIBLES:-}" ]; then
            echo "_Aucune cible résolue : le job a échoué avant de scanner._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Un artefact, un sous-dossier par cible (`rapport-zap/<étiquette>/`) : les
      # rapports ne se mélangent pas et l'on sait toujours lequel décrit quoi.
      - name: Conserver les rapports ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapport-zap-${{ github.run_id }}
          path: rapport-zap/
          retention-days: 30
          if-no-files-found: warn

      # Le verdict est un SCRIPT VERSIONNÉ, pas un bloc en ligne : c'est ce qui
      # permet de l'éprouver (étape 2 de ce job) au lieu de l'espérer. Il reçoit
      # TOUS les codes et prend le PLUS SÉVÈRE : les codes 1 et 3 bloquent sur
      # n'importe quelle cible, y compris noyés dans des 0.
      - name: Verdict
        env:
          CODES: ${{ steps.scan.outputs.codes }}
          ARTEFACT: rapport-zap-${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/zap-verdict.sh "${CODES}" "${ZAP_BLOQUANT}" "${ARTEFACT}"
