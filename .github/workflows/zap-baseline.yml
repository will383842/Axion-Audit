# =============================================================================
# ZAP BASELINE (09 §1 rôle A51 · 07 §13 « Sécurité : ZAP baseline en CI »)
# =============================================================================
# Applique :
#   · 09 §1 — « A51 sécurité offensive : ZAP BASELINE À CHAQUE BUILD, revue
#     OWASP ASVS L2 avant recette ».
#   · 07 §13 — « Sécurité : ZAP baseline en CI ».
#   · 02 §30.6 — exécuté contre l'environnement STAGING, APRÈS déploiement
#     (appelé en fin de deploy-staging.yml).
#
# ─────────────────────────────────────────────────────────────────────────────
# STATUT BLOQUANT — LE POINT IMPORTANT DE CE FICHIER
# ─────────────────────────────────────────────────────────────────────────────
# AU LOT L0 : NON BLOQUANT. Motif factuel : il n'y a AUCUNE surface applicative
# réelle à scanner (ni auth, ni route métier, ni formulaire) — seulement Caddy et
# une éventuelle route de santé. Un scan sur du vide produirait soit un vert
# creux, soit du bruit ; dans les deux cas une information fausse.
#
# ➜ IL DEVIENT BLOQUANT AU **LOT L2**, dès qu'il existe de l'AUTHENTIFICATION
#   (07 §12, L2 : « Auth JWT (login/refresh rotatif…), RBAC middleware,
#   étanchéité financière »). C'est à partir de là qu'un en-tête de sécurité
#   manquant, un cookie sans `Secure`/`HttpOnly`/`SameSite` ou une page d'erreur
#   bavarde deviennent des défauts RÉELS — et le pack exige déjà @fastify/helmet
#   (11 §3) et des cookies httpOnly SameSite=Lax.
#
# COMMENT LE RENDRE BLOQUANT AU L2 : passer `ZAP_BLOQUANT` ci-dessous à 'true'
# (une ligne, versionnée, revue en PR). Il n'y a volontairement AUCUN
# `continue-on-error` dans ce fichier : le caractère non bloquant est une
# CONSTANTE EXPLICITE et lisible, pas un masquage d'échec (09 §5.7).
#
# ⚖️ CETTE DÉROGATION EST UN ARBITRAGE HUMAIN, PAS UN CHOIX D'OUTILLAGE.
# Le 11 §8-5 réserve à Williams « désactiver ou skipper un test » ; un scan de
# sécurité non bloquant en est un. Elle est donc tracée dans `DECISIONS.md`,
# entrée « [L0] ZAP baseline non bloquant jusqu'au lot L2 » (rédigée par A52,
# portée par A01) — avec sa DATE DE BASCULE. Sans cette entrée datée, la ligne
# `ZAP_BLOQUANT: 'false'` resterait à `false` par simple inertie, et l'échéance
# « L2 » écrite ci-dessus ne serait qu'une bonne intention.
# ─────────────────────────────────────────────────────────────────────────────
#
# Traçabilité E36/E43 — lot L0 (outillage), exploité par A51 dès L2.
# =============================================================================

name: ZAP baseline

on:
  workflow_call:
    inputs:
      cible:
        description: 'URL de base à scanner (staging après déploiement).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      cible:
        description: 'URL de base à scanner.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zap-${{ inputs.cible }}
  cancel-in-progress: true

env:
  # ⚠️ PASSER À 'true' AU LOT L2 (voir bandeau). Une seule ligne à changer.
  # Dérogation tracée : DECISIONS.md, « [L0] ZAP baseline non bloquant jusqu'au
  # lot L2 » (11 §8-5).
  ZAP_BLOQUANT: 'false'
  # ---------------------------------------------------------------------------
  # IMAGE ZAP — `:stable` EST UN TAG MOBILE. Ce n'est PAS un épinglage.
  # ---------------------------------------------------------------------------
  # Le commentaire précédent affirmait « épinglée (11 §1) » : c'était faux, et un
  # commentaire faux est pire que pas de commentaire — il fait passer un contrôle
  # pour acquis. `ghcr.io/zaproxy/zaproxy:stable` est repoussé à chaque release
  # de ZAP : deux runs du même commit peuvent scanner avec deux scanners
  # différents.
  #
  # POURQUOI ON LE GARDE MOBILE AU L0/L1 : les règles PASSIVES de ZAP sont la
  # matière même du contrôle. Un scanner figé cesse silencieusement de détecter
  # les classes de défaut apparues après son gel — c'est-à-dire qu'il devient
  # vert pour de mauvaises raisons. Le gel du 11 §1 vise les dépendances qui
  # ENTRENT dans le produit livré ; ZAP n'entre pas dans le produit, il
  # l'inspecte depuis l'extérieur.
  #
  # CE QUE ÇA COÛTE, ET COMMENT C'EST COMPENSÉ :
  #   · le run n'est pas reproductible à l'identique → l'étape « Identifier
  #     l'image réellement utilisée » ci-dessous journalise le DIGEST tiré, qui
  #     est archivé avec le rapport : on sait toujours APRÈS COUP ce qui a
  #     tourné ;
  #   · une régression de l'image casserait le scan → code 3, échec dur, jamais
  #     silencieux (étape « Verdict »).
  #
  # ⚠️ AU LOT L2, quand `ZAP_BLOQUANT` passera à 'true' : REMPLACER ce tag par le
  # DIGEST relevé dans les journaux (`ghcr.io/zaproxy/zaproxy@sha256:…`). Une
  # porte bloquante doit être reproductible — sinon une PR devient rouge parce
  # que le scanner a changé pendant la nuit, et personne ne peut le démontrer.
  # ---------------------------------------------------------------------------
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  baseline:
    name: Scan passif (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Vérifier la cible
        run: |
          set -euo pipefail
          cible='${{ inputs.cible }}'
          if [ -z "$cible" ]; then
            echo "::error title=Cible ZAP absente::Aucune URL fournie. Renseigner la variable d'environment vars.STAGING_BASE_URL (GitHub → Settings → Environments → staging → Variables)."
            exit 1
          fi
          echo "Cible du scan : ${cible}"

      # `:stable` étant un tag MOBILE (voir bloc `env:`), on relève le digest
      # RÉELLEMENT tiré : c'est la seule trace qui rende le run analysable après
      # coup, et c'est la valeur à épingler au lot L2.
      - name: Identifier l'image ZAP réellement utilisée (digest)
        run: |
          set -euo pipefail
          docker pull "${ZAP_IMAGE}" >/dev/null
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${ZAP_IMAGE}")"
          echo "Image ZAP tirée : ${digest}"
          {
            echo "### Image ZAP de ce run"
            echo "- Tag demandé : \`${ZAP_IMAGE}\` (**tag mobile**, pas un épinglage)"
            echo "- Digest réellement tiré : \`${digest}\`"
            echo "- Au lot L2 (\`ZAP_BLOQUANT: 'true'\`) : épingler ce digest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lancer zap-baseline.py
        id: scan
        run: |
          # `set +e` volontaire : le shell par défaut de GitHub Actions active
          # `-e`, or le code de retour de ZAP est ici une DONNÉE, exploitée
          # explicitement à l'étape « Verdict ». Ce n'est pas un masquage
          # d'échec — rien n'est perdu, tout est tranché plus bas (09 §5.7).
          set +e
          set -uo pipefail
          mkdir -p rapport-zap && chmod 777 rapport-zap
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/rapport-zap:/zap/wrk:rw" \
            -t "${ZAP_IMAGE}" \
            zap-baseline.py \
              -t '${{ inputs.cible }}' \
              -r rapport-zap.html \
              -J rapport-zap.json \
              -a \
              -I
          code=$?
          # Codes zap-baseline.py : 0 = rien · 1 = alertes en ÉCHEC ·
          # 2 = avertissements (avec -I) · 3 = erreur d'exécution.
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "ZAP a rendu le code ${code}."

      - name: Conserver le rapport ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapport-zap-${{ github.run_id }}
          path: rapport-zap/
          retention-days: 30
          if-no-files-found: warn

      - name: Verdict
        run: |
          set -euo pipefail
          code='${{ steps.scan.outputs.code }}'

          if [ "$code" = "3" ]; then
            # Une ERREUR D'EXÉCUTION du scanner n'est jamais tolérée, même au L0 :
            # un scanner qui ne tourne pas n'est pas un scan « non bloquant »,
            # c'est une absence de scan déguisée en scan.
            echo "::error title=ZAP n'a pas pu s'exécuter::Code 3 — cible injoignable ou erreur interne. Le scan n'a PAS eu lieu ; ce n'est pas un résultat, c'est une panne."
            exit 1
          fi

          if [ "$code" = "0" ]; then
            echo "Aucune alerte ZAP."
            exit 0
          fi

          if [ "${ZAP_BLOQUANT}" = "true" ]; then
            echo "::error title=Alertes ZAP::Le scan a remonté des alertes (code ${code}) et ZAP_BLOQUANT=true (lot ≥ L2). Rapport dans l'artefact « rapport-zap-${{ github.run_id }} ». Traitement par A51 (09 §1) avant merge."
            exit 1
          fi

          echo "::warning title=Alertes ZAP (non bloquant au lot L0/L1)::Le scan a remonté des alertes (code ${code}). NON BLOQUANT tant que ZAP_BLOQUANT='false' — statut assumé et daté : il DOIT passer à 'true' au LOT L2, dès l'arrivée de l'authentification (07 §12). Rapport dans l'artefact « rapport-zap-${{ github.run_id }} » : à lire, pas à ignorer."
