# =============================================================================
# DÉPLOIEMENT PRODUCTION (02 §30.6 · 02 §30.4-3 · 02 §30.5 · 02 §11.2)
# =============================================================================
# Applique littéralement :
#   · 02 §30.6 — « Prod : IDEM sur tag `v*` APRÈS TON APPROBATION dans GitHub. »
#   · 02 §30.5 — Environments : « prod (déploiement sur tag v* + APPROBATION
#     MANUELLE) ».
#   · 02 §30.4-3 — « l'environnement prod EXIGE UNE APPROBATION MANUELLE (toi)
#     avant tout déploiement » ; secrets portés par l'Environment `prod`,
#     JAMAIS par des secrets de dépôt globaux.
#   · 02 §30.4-4 — séparation stricte staging/prod : bases, buckets, clés JWT et
#     clés API DISTINCTES. Un secret de staging ne peut RIEN sur la prod.
#
# ⚠️ ÉTAT RÉEL AU 2026-08-27 : l'approbation d'Environment est INDISPONIBLE.
# « Required reviewers » exige un plan GitHub payant sur un dépôt privé — vérifié,
# l'API la refuse. Une barrière compensatoire (confirmation TAPÉE) la remplace ;
# voir le bandeau `on:` plus bas. Dès que le plan le permettra, poser le réglage
# dans GitHub → Settings → Environments → prod → « Required reviewers » = Williams,
# puis restaurer le déclencheur par tag et retirer le job `confirmation`.
#
# ------------------------------- ROLLBACK ------------------------------------
# (02 §30.6 + §11.2) — identique au staging, à exécuter à la main :
#   1. Le tag précédent est JOURNALISÉ par `deploy.sh` dans
#      `/opt/axion-audit/prod.deployed-tags` (deploy.sh l.58 et l.155) :
#        cat /opt/axion-audit/prod.deployed-tags
#      À défaut : l'historique des runs de ce workflow, ou GHCR.
#   2. Sur le serveur, depuis la copie du dépôt (`/opt/axion-audit/repo`) :
#        ./infra/scripts/deploy.sh --rollback --env prod
#      (le script relit lui-même l'avant-dernier tag du journal), ou pour viser
#      un tag précis :
#        ./infra/scripts/deploy.sh --env prod --tag <tag précédent>
#      → `docker compose` est re-pointé sur le tag précédent.
#   3. Images conservées 90 JOURS sur GHCR : au-delà, plus de retour arrière
#      possible sans reconstruire depuis le tag git.
#   4. Aucune migration inverse : migrations RÉTROCOMPATIBLES N-1 (02 §11.2),
#      le code N-1 tourne sur le schéma N. Une migration NON rétrocompatible
#      casserait cette propriété → escalade DECISIONS.md avant de la livrer.
#   5. Fenêtre d'exploitation : jamais un jour de collecte terrain (02 §11.2,
#      gel des déploiements pendant les jours de collecte client).
# -----------------------------------------------------------------------------
#
# Traçabilité E36/E43 — lot L0 (07 §12), agent A52.
# =============================================================================

name: Déploiement production

# ⚠️ LE DÉCLENCHEUR PAR TAG A ÉTÉ RETIRÉ — ce n'est pas un oubli.
#
# Le 02 §30.4-3 exige que « l'environnement prod EXIGE UNE APPROBATION MANUELLE avant
# tout déploiement ». Cette approbation se pose normalement sur l'Environment GitHub
# (« Required reviewers »). Or ce réglage EXIGE UN PLAN GITHUB PAYANT sur un dépôt
# privé : l'API répond « Failed to create the environment protection rule. Please
# ensure the billing plan supports the required reviewers protection rule ».
# Vérifié le 2026-08-27 ; la protection de branche et les rulesets sont refusés pour
# la même raison, sur le même plan.
#
# Conséquence si l'on ne faisait rien : un `git push --tags` déploierait en PRODUCTION
# sans aucune barrière humaine — l'exact inverse de ce que le §30.4-3 demande, et un
# geste qu'on fait sans y penser.
#
# GARDE-FOU COMPENSATOIRE, en attendant le plan payant : le déploiement de production
# devient MANUEL et exige une confirmation TAPÉE. Un humain doit ouvrir l'onglet
# Actions, choisir le tag et écrire le mot exact. C'est plus lourd qu'un clic
# d'approbation — c'est le prix, et il est assumé plutôt que masqué.
#
# À RÉTABLIR dès que l'Environment `prod` porte un « Required reviewer » : remettre
# le bloc `push: tags: ['v*']` ci-dessous en commentaire (11 §9bis : « tag v0.<lot>
# à chaque porte franchie ») et retirer le job de confirmation.
# Trace : DECISIONS.md 2026-08-27 « Protections GitHub indisponibles sur le plan actuel ».
on:
  # push:
  #   tags:
  #     - 'v*'   ← à remettre quand l'Environment prod aura son relecteur obligatoire
  workflow_dispatch:
    inputs:
      tag_image:
        description: "Tag d'image à déployer en production (ex. v0.1, sha-1a2b3c4)."
        required: true
        type: string
      confirmation:
        description: 'Tapez exactement : DEPLOYER-EN-PRODUCTION'
        required: true
        type: string
      reconstruire:
        description: 'Reconstruire les images ? Décochez pour REDÉPLOYER un tag déjà publié (rollback).'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Jamais deux déploiements de production simultanés, et jamais d'annulation
# d'un déploiement en vol.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0 — BARRIÈRE HUMAINE. Remplace l'approbation d'Environment, indisponible sur
  # le plan GitHub actuel (voir le bandeau `on:` ci-dessus). Un tag ne suffit
  # plus : il faut avoir TAPÉ la confirmation, et tous les jobs en dépendent.
  # ---------------------------------------------------------------------------
  confirmation:
    name: 0 · confirmation humaine (remplace l'approbation d'Environment)
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la confirmation tapée
        env:
          SAISI: ${{ inputs.confirmation }}
          TAG: ${{ inputs.tag_image }}
          AUTEUR: ${{ github.actor }}
        run: |
          set -euo pipefail
          attendu='DEPLOYER-EN-PRODUCTION'
          if [ "${SAISI}" != "${attendu}" ]; then
            echo "::error::Confirmation invalide. Tapez EXACTEMENT « ${attendu} » pour déployer en production."
            exit 1
          fi
          echo "Confirmation valide — déploiement de « ${TAG} » autorisé par ${AUTEUR}."

  # ---------------------------------------------------------------------------
  # 1 — Construction des 4 images taguées par la VERSION du tag git + le SHA.
  # (02 §30.6 : « idem » — le flux prod reprend le flux staging.)
  # ---------------------------------------------------------------------------
  build:
    name: Build des 4 images (tag ${{ inputs.tag_image }})
    needs: [confirmation]
    # Le déclencheur par tag ayant disparu, une condition sur `event_name == 'push'`
    # serait TOUJOURS fausse : le job ne s'exécuterait jamais et l'on déploierait une
    # image jamais construite. On s'appuie donc sur une entrée explicite, qui couvre
    # aussi le rollback vers un tag déjà publié.
    if: inputs.reconstruire
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      pousser: true
      tag_version: ${{ inputs.tag_image }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 2 — Déploiement : l'environment `prod` MET LE RUN EN ATTENTE tant que
  #     Williams n'a pas approuvé (réglage GitHub, cf. bandeau).
  # ---------------------------------------------------------------------------
  deployer:
    name: SSH → infra/scripts/deploy.sh (PRODUCTION)
    runs-on: ubuntu-latest
    needs: [build]
    # `always()` pour couvrir le cas workflow_dispatch (où `build` est ignoré),
    # mais on refuse explicitement de déployer si un build a ÉCHOUÉ.
    if: always() && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    environment:
      # L'Environment `prod` NE PORTE PAS d'approbation : « Required reviewers »
      # exige un plan GitHub payant sur dépôt privé (vérifié le 2026-08-27). Il ne
      # sert ici qu'à PORTER LES SECRETS, séparés de ceux de staging (§30.4-3/4).
      # La barrière humaine est le job `confirmation` en tête de ce fichier.
      name: prod
      url: ${{ vars.PROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le tag d'image à déployer
        id: cible
        env:
          TAG_SAISI: ${{ inputs.tag_image }}
          TAG_BUILD: ${{ needs.build.outputs.tag_sha }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_SAISI:-}" ]; then
            tag="${TAG_SAISI}"
          elif [ -n "${TAG_BUILD:-}" ]; then
            tag="${TAG_BUILD}"
          else
            echo "::error::Aucun tag d'image déterminable. Un déploiement de production ne se fait JAMAIS sur une image implicite."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Image de production visée : ${tag}"

      - name: Contrôler la présence des réglages non versionnables
        env:
          A_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          A_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          A_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          A_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          A_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          A_PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          set -euo pipefail
          manquants=""
          for nom in A_DEPLOY_SSH_KEY A_DEPLOY_SSH_KNOWN_HOSTS A_DEPLOY_HOST \
                     A_DEPLOY_USER A_DEPLOY_PATH A_PROD_BASE_URL; do
            if [ -z "${!nom:-}" ]; then
              manquants="${manquants} ${nom#A_}"
            fi
          done
          if [ -n "$manquants" ]; then
            echo "::error title=Environment prod incomplet::Éléments manquants :${manquants}. À poser dans GitHub → Settings → Environments → prod (02 §30.4-3, séparation stricte staging/prod §30.4-4)."
            exit 1
          fi

      - name: Préparer l'accès SSH (clé dédiée prod, hôte vérifié)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # -----------------------------------------------------------------------
      # CONTRAT D'APPEL DE `infra/scripts/deploy.sh` (A11) — LU DANS LE SCRIPT
      # -----------------------------------------------------------------------
      #   ./deploy.sh --env <staging|prod> --tag <IMAGE_TAG> [--env-file <chemin>]
      #
      # `--env` (l.40) et `--tag` (l.70) sont OBLIGATOIRES : sans eux le script
      # meurt avant toute action. Il ne lit JAMAIS `IMAGE_TAG` depuis
      # l'environnement — il l'EXPORTE depuis `--tag` (l.72).
      # `APP_ENV` n'est PAS passé : `deploy.sh` le lit dans le `.env` du serveur
      # et le CONFRONTE à `--env` (l.49-50). C'est ce garde-fou qui empêche un
      # déploiement de production sur la pile de staging, et réciproquement —
      # forcer `APP_ENV` depuis la CI reviendrait à vouloir désarmer la seule
      # protection qui distingue les deux environnements (02 §30.4-4).
      # `--env-file` n'est pas passé : `deploy.sh` résout par défaut
      # `/opt/axion-audit/prod/.env` (l.43), la convention du runbook
      # (`infra/README.md` §4 et §5).
      # -----------------------------------------------------------------------
      - name: Déployer (pull/up + migration garde-fou dry-run puis apply + smoke tests)
        env:
          IMAGE_TAG: ${{ steps.cible.outputs.tag }}
          # Interpolée par `infra/docker-compose.prod.yml` (A11) :
          # `ghcr.io/${GHCR_OWNER}/axion-audit-<app>:${IMAGE_TAG}`. Le `.env` du
          # serveur (§18) reste prioritaire — cette valeur n'est qu'un repli.
          GHCR_OWNER: ${{ github.repository_owner }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # ⚠️ `DEPLOY_PATH` = LA COPIE DU DÉPÔT, soit `/opt/axion-audit/repo`
          # (`infra/README.md` §3 : `git clone … /opt/axion-audit/repo`), et NON
          # `/opt/axion-audit`, qui est la racine d'EXPLOITATION (`.env`,
          # `<env>/.env`, `*.deployed-tags`).
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # GHCR n'accepte que des minuscules dans le chemin de dépôt — même
          # normalisation que `build-images.yml`.
          ghcr_owner="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail; cd '${DEPLOY_PATH}'; \
               test -x ./infra/scripts/deploy.sh || { echo 'ERREUR : ./infra/scripts/deploy.sh introuvable ou non exécutable sous '\''${DEPLOY_PATH}'\''. Le secret DEPLOY_PATH doit désigner la COPIE DU DÉPÔT (/opt/axion-audit/repo — infra/README.md §3), pas la racine d exploitation /opt/axion-audit.' >&2; exit 1; }; \
               GHCR_OWNER='${ghcr_owner}' ./infra/scripts/deploy.sh --env prod --tag '${IMAGE_TAG}'"

      # ROUTE : `/api/v1/health`, et non `/api/health`. Le `Caddyfile` (A11)
      # utilise `handle_path /api/*`, qui RETIRE le préfixe : l'API reçoit
      # `/v1/…`. Et `apps/api/src/app.ts` (A01) enregistre les routes de santé
      # sous `prefix: '/v1'`. C'est l'URL qu'interroge déjà
      # `infra/scripts/smoke-test.sh` (l.44).
      - name: Contrôle de santé public (hors serveur)
        run: |
          set -euo pipefail
          url="${{ vars.PROD_BASE_URL }}"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${url%/}/api/v1/health" >/dev/null; then
              echo "Santé API OK sur ${url%/}/api/v1/health (tentative ${i})."
              exit 0
            fi
            sleep 6
          done
          echo "::error title=Production injoignable::${url%/}/api/v1/health ne répond pas après 60 s. ROLLBACK IMMÉDIAT — procédure dans le bandeau de ce fichier."
          exit 1

      - name: Effacer la clé SSH du runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Notifier Telegram (02 §11.3 / §30.6)
        if: always()
        env:
          JETON: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALON: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${JETON}" ] || [ -z "${SALON}" ]; then
            echo "::error title=Alerte impossible::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID absents de l'environment prod. Un déploiement de production sans canal d'alerte est inacceptable (02 §11.3)."
            exit 1
          fi
          texte="Axion Audit — déploiement PRODUCTION : ${{ job.status }}
          Tag git : ${{ inputs.tag_image }}
          Image : ${{ steps.cible.outputs.tag }}
          Approuvé et lancé par : ${{ github.actor }}
          Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Rollback : ./infra/scripts/deploy.sh --rollback --env prod (images GHCR conservees 90 j)"
          curl -fsS -X POST "https://api.telegram.org/bot${JETON}/sendMessage" \
            --data-urlencode "chat_id=${SALON}" \
            --data-urlencode "text=${texte}" >/dev/null
