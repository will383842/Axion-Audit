# =============================================================================
# CI — LE WORKFLOW BLOQUANT (contrat 11 §7 · 02 §30.4-5 · 02 §30.5 · 09 §3)
# =============================================================================
# Applique littéralement :
#   · 11 §7 — « jobs dans cet ORDRE : lint → typecheck → unit → integration
#     (postgres, redis, minio) → e2e (chromium) → diff schéma-vs-04 → build
#     images → (tag) déploiement staging. Merge bloqué sans tout vert. »
#   · 11 §1 — Node 22 LTS, pnpm 9, versions épinglées, Dependabot désactivé.
#   · 11 §2 / 09 §5.7 — « Tests désactivés/skippés = build rouge » ;
#     `@critique` et `@filrouge` ne sont JAMAIS skippables.
#   · 09 §3 (DoD transverse) — couverture ≥ 90 % sur les modules critiques,
#     MESURÉE, pas déclarée.
#   · 02 §30.4-5 — gitleaks à chaque push, BLOQUANT.
#   · 02 §30.5 — protection de `main` : CI verte obligatoire.
#
# RÈGLE FONDATRICE DE CE FICHIER (09 §5.7) : un workflow ne doit JAMAIS pouvoir
# passer au vert en masquant un échec. Aucun `continue-on-error`, et aucun
# `|| true` sur un CONTRÔLE. Une CI qui ment est pire que pas de CI.
#
# Deux `|| true` subsistent dans ce fichier, et il faut dire lesquels plutôt que
# de laisser croire qu'il n'y en a aucun : `docker logs minio || true` (l. ~351)
# et `docker rm -f minio || true` (l. ~372). Tous deux portent sur du DIAGNOSTIC
# et du NETTOYAGE, jamais sur un verdict — l'un s'exécute alors que l'étape a
# DÉJÀ échoué (il ne peut donc rien masquer), l'autre est un teardown
# `if: always()` dont l'échec ne dit rien sur le code testé. Les retirer rendrait
# la CI rouge pour des raisons étrangères au code : c'est l'inverse du but.
#
# Traçabilité E36/E43 — livrable du lot L0 (07 §12), agent A52 (09 §1).
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'lot/**' # 11 §9bis : une branche par incrément, `lot/<code>`.

# Permissions MINIMALES par défaut (02 §30.4-7 « moindre accès »).
# `packages: write` n'est accordé QUE dans le job qui pousse sur GHCR.
permissions:
  contents: read

# Un seul run utile par branche : les runs obsolètes sont annulés.
# Exception : jamais d'annulation sur `main` (un run sur main peut déclencher un
# déploiement staging — on n'annule pas un déploiement en vol).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Images de service — alignées sur la stack figée 02 §30.2 / 11 §1.
  POSTGRES_IMAGE: postgres:16-alpine
  REDIS_IMAGE: redis:7-alpine
  # 11 §1 : « MinIO, dernière release stable au démarrage, FIGÉE ensuite ».
  # Tag ALIGNÉ sur `infra/docker-compose.yml` (A11) — les deux doivent rester
  # identiques : une CI qui teste une autre version que la prod ne teste pas la prod.
  MINIO_IMAGE: minio/minio:RELEASE.2025-04-22T22-12-26Z
  # gitleaks épinglé (11 §1, gel des dépendances Phase 1).
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.18.4
  # Secrets FACTICES pour la CI (11 §2 : « les tests utilisent des secrets
  # factices » ; aucune valeur réelle ne transite ici).
  POSTGRES_USER: axion
  POSTGRES_PASSWORD: ci_factice_postgres
  POSTGRES_DB: axion_audit_test
  MINIO_ROOT_USER: ci_factice_minio
  MINIO_ROOT_PASSWORD: ci_factice_minio_secret

jobs:
  # ---------------------------------------------------------------------------
  # GARDE-FOU 1 — DÉTECTION DE FUITE DE SECRET (02 §30.4-5, BLOQUANT)
  # ---------------------------------------------------------------------------
  # Historique COMPLET (fetch-depth: 0), sur TOUS les déclencheurs — pas
  # seulement en PR : un secret introduit puis « retiré » dans un commit
  # ultérieur reste dans l'historique et doit être vu, quel que soit le chemin
  # par lequel ce commit arrive.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks (bloquant — 02 §30.4-5)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (historique complet)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Vérifier la présence de la configuration gitleaks
        run: |
          set -euo pipefail
          if [ ! -f .gitleaks.toml ]; then
            echo "::error::.gitleaks.toml absent à la racine — configuration obligatoire (02 §30.4-5)."
            exit 1
          fi

      - name: Analyser l'historique complet
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "${GITLEAKS_IMAGE}" \
            detect --source=/repo --config=/repo/.gitleaks.toml \
                   --redact --verbose --exit-code 1
          # --exit-code 1 : toute fuite fait ROUGIR le build. Pas de tolérance.

  # ---------------------------------------------------------------------------
  # GARDE-FOU 2 — SCRIPTS SHELL D'INFRA (11 §7, scripts livrés par A11)
  # ---------------------------------------------------------------------------
  shellcheck:
    name: shellcheck (infra/scripts/*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Analyser les scripts d'exploitation
        run: |
          set -euo pipefail
          # shellcheck est préinstallé sur les runners ubuntu-latest.
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck introuvable sur le runner."
            exit 1
          fi
          # Les scripts d'infra sont un livrable du MÊME lot L0 (agent A11 :
          # deploy.sh, restore-test.sh, backup…). Leur absence est un échec de
          # lot, pas une situation normale : on échoue avec un message lisible.
          # Un seul pathspec suffit : en pathspec git, `*` traverse `/` — il
          # couvre donc aussi `infra/scripts/lib/common.sh`.
          mapfile -t scripts < <(git ls-files 'infra/scripts/*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::Aucun script dans infra/scripts/ — livrable du lot L0 (agent A11 : deploy.sh, restore-test.sh). La CI n'a rien à vérifier : échec explicite plutôt que faux vert."
            exit 1
          fi
          printf 'Scripts analysés :\n%s\n' "${scripts[*]}"
          shellcheck --severity=warning --shell=bash "${scripts[@]}"

      # Le fichier compose EST de l'infrastructure exécutable : une faute de
      # syntaxe s'y découvre en CI, pas au moment du déploiement.
      - name: Valider la syntaxe des fichiers docker compose
        run: |
          set -euo pipefail
          # `.env` est gitignoré (02 §30.4-1) : on fabrique un .env ÉPHÉMÈRE à
          # partir de .env.example. Ses valeurs sont les placeholders
          # `__CHANGEME__` — des secrets factices, comme l'exige 11 §2.
          cp .env.example .env
          pnpm infra:config
          rm -f .env

      # -----------------------------------------------------------------------
      # LE `Caddyfile` EST DE L'INFRASTRUCTURE EXÉCUTABLE, AU MÊME TITRE QUE LE
      # COMPOSE — et jusqu'au 2026-08-29, PERSONNE N'AVAIT JAMAIS FAIT TOURNER LE
      # VRAI VALIDATEUR DESSUS.
      # -----------------------------------------------------------------------
      # `scripts/garde-fous-proxy-de-confiance.test.ts` est un garde LEXICAL : il
      # lit le fichier comme du texte. Il ne peut donc pas voir qu'un `Caddyfile`
      # syntaxiquement FAUX a été écrit. C'est par ce trou qu'est passée la forme
      # `trusted_proxies static 10.0.1.0/24` DANS UN BLOC `reverse_proxy`, que
      # Caddy refuse (`invalid IP address: 'static'` — `static` est le mot-clé de
      # l'option GLOBALE `servers`, pas du sous-directive de bloc). Sans cette
      # étape, une telle faute ne se découvre qu'au déploiement, quand le
      # conteneur ne démarre pas.
      #
      # POURQUOI `adapt` ET PAS SEULEMENT `validate` — mesuré, et c'est le cœur :
      # `validate` seul annonce plus qu'il ne fait. Sans `API_PORT`, Caddy adapte
      # silencieusement l'upstream en `axion-api:80` au lieu de `:3000` ET REND
      # EXIT 0. Un `.env` de production qui oublierait la variable donnerait donc
      # un Caddy « valide » rendant des 502 sur toute l'API. `adapt` rend le JSON
      # RÉELLEMENT CHARGÉ : c'est la seule façon d'affirmer sur ce qui tournera,
      # et cela ferme du même coup le trou du garde lexical — on vérifie que
      # `trusted_proxies` est CHARGÉ, pas seulement présent dans le texte.
      #
      # ⚠️ FORME DE LA CLÉ DANS LE JSON ADAPTÉ — piège dans lequel l'auteur de
      # cette étape est lui-même tombé. La sous-directive de BLOC rend un TABLEAU
      # SIMPLE :
      #     "trusted_proxies":["10.0.1.0/24"]
      # et NON `{"source":"static","ranges":[…]}`, qui est la forme de l'option
      # GLOBALE `servers { trusted_proxies static … }`. Chercher `"ranges"` ne
      # rend rien et ferait conclure à tort que la directive est absente.
      #
      # POURQUOI LES PLAGES NE SONT PAS ÉCRITES EN DUR ICI : elles seraient une
      # SECONDE SOURCE DE VÉRITÉ à côté du `Caddyfile`, et deux copies divergent.
      # On compare donc le DÉCLARÉ (lu dans le fichier) au CHARGÉ (lu dans le
      # JSON adapté) : l'étape prouve la FIDÉLITÉ texte → configuration sans
      # dupliquer la valeur. La forme des plages, elle, est déjà gardée par
      # `garde-fous-proxy-de-confiance.test.ts` (qui refuse `0.0.0.0/0`).
      #
      # IMAGE ÉPINGLÉE AU DIGEST (11 §1, gel des versions) : `caddy:2-alpine` est
      # un tag MOUVANT. Une CI qui valide contre une autre version que celle
      # déployée ne valide pas ce qui tourne. Le digest ci-dessous a été vérifié
      # le 2026-08-29 : il rend `v2.11.4`, EXACTEMENT la version du conteneur
      # `caddy` en service sur le staging (`docker exec … caddy version`).
      #
      # ÉCHEC FERMÉ, et pas seulement sur le code de retour : une étape qui
      # passerait parce que Caddy est absent serait un garde qui ment. Docker
      # manquant ou image intirable ⇒ ÉCHEC EXPLICITE, jamais un saut silencieux.
      #
      # ⚠️ IDIOME DES CODES DE RETOUR — `cmd; RC=$?` EST UN PIÈGE SOUS `set -e` :
      # bash abandonne le script AVANT la capture, et l'étape rougit MUETTE, sans
      # dire pourquoi. Mesuré sur cette étape même. On écrit donc partout
      # `RC=0; cmd || RC=$?`, qui rend l'échec « traité » et laisse le diagnostic
      # s'afficher. Même famille : `set -o pipefail` + un `grep` SANS
      # correspondance (donc exit 1) tue la substitution de commande — d'où le
      # `{ grep … || true; }` du comptage, qui doit pouvoir rendre ZÉRO.
      #
      # RECETTE ET DIAGNOSTIC DES DEUX ÉCHECS CLASSIQUES : infra/README.md §3bis.
      - name: Valider le Caddyfile avec le vrai binaire Caddy
        run: |
          set -euo pipefail

          # Digest vérifié le 2026-08-29 = v2.11.4 = version en service (voir ci-dessus).
          IMAGE_CADDY='caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648'

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker introuvable sur le runner — le Caddyfile ne peut pas être validé. Échec explicite plutôt que faux vert."
            exit 1
          fi
          RC=0; docker pull --quiet "$IMAGE_CADDY" >/dev/null 2>&1 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::Image Caddy épinglée indisponible ($IMAGE_CADDY) — vérification impossible."
            exit 1
          fi

          # Le dossier ENTIER est monté, jamais le seul Caddyfile : il fait
          # `import {$CADDY_FRONT_CONFIG}` et échouerait sur « unrecognized
          # directive: import ». Les QUATRE variables sont obligatoires — seule
          # CADDY_ACME_EMAIL porte un défaut. Une adresse de site VIDE réduit
          # `{$CADDY_SITE_ADDRESS} {` à `{`, que Caddy lit comme un bloc
          # d'options globales, d'où l'erreur trompeuse « server block without
          # any key … must be first » qui désigne un problème d'ORDRE là où la
          # cause est une VARIABLE MANQUANTE (infra/README.md §3bis).
          caddy_avec() {
            SOUS_COMMANDE="$1"; MODE="$2"
            docker run --rm -v "$PWD/infra/caddy:/etc/caddy:ro" \
              -e CADDY_FRONT_CONFIG="/etc/caddy/$MODE" \
              -e CADDY_SITE_ADDRESS=:8080 \
              -e CADDY_STAGING_SITE_ADDRESS=:8081 \
              -e API_PORT=3000 \
              "$IMAGE_CADDY" caddy "$SOUS_COMMANDE" --config /etc/caddy/Caddyfile
          }

          # LES DEUX MODES DE SERVICE DES FRONTS. `fronts.static.caddy` est celui
          # embarqué dans l'image de staging/prod ; `fronts.dev.caddy` sert en
          # local. Les deux sont de vraies configurations : les deux se valident.
          for MODE in fronts.static.caddy fronts.dev.caddy; do
            RC=0; SORTIE="$(caddy_avec validate "$MODE" 2>&1)" || RC=$?
            if [ "$RC" -ne 0 ]; then
              echo "::error::caddy validate ÉCHOUE en mode $MODE (exit $RC)."
              printf '%s\n' "$SORTIE" | grep -m1 '^Error:' || printf '%s\n' "$SORTIE" | tail -3
              exit 1
            fi
            echo "  caddy validate ($MODE) : OK"
          done

          RC=0; ADAPTE="$(caddy_avec adapt fronts.static.caddy 2>/dev/null)" || RC=$?
          if [ "$RC" -ne 0 ] || [ -z "$ADAPTE" ]; then
            echo "::error::caddy adapt n'a rien rendu (exit $RC) — impossible d'affirmer quoi que ce soit."
            exit 1
          fi

          # 1/3 — `trusted_proxies` CHARGÉ sur les DEUX blocs (prod ET staging).
          # `grep -c` compterait les LIGNES contenant un match ; le JSON adapté
          # tient sur UNE seule ligne et rendrait toujours 1. D'où `grep -o | wc -l`.
          NB_TP="$(printf '%s' "$ADAPTE" | { grep -o '"trusted_proxies":\[[^]]*\]' || true; } | wc -l | tr -d ' ')"
          if [ "$NB_TP" -ne 2 ]; then
            echo "::error::$NB_TP bloc(s) reverse_proxy portent trusted_proxies dans la configuration CHARGÉE, 2 attendus. Sans cette directive, Caddy REMPLACE X-Forwarded-For et le plafond de 10 req/min/IP sur /v1/auth/* devient un seau GLOBAL (DECISIONS.md 2026-08-29)."
            exit 1
          fi
          echo "  trusted_proxies chargé sur les 2 blocs"

          # 2/3 — FIDÉLITÉ : les plages chargées sont celles que le fichier déclare.
          DECLARE="$(grep -hoE '^[[:space:]]*trusted_proxies[[:space:]]+.*$' infra/caddy/Caddyfile \
            | sed -E 's/^[[:space:]]*trusted_proxies[[:space:]]+//; s/[[:space:]]+$//' | tr ' ' '\n' | sort -u)"
          CHARGE="$(printf '%s' "$ADAPTE" | grep -o '"trusted_proxies":\[[^]]*\]' \
            | sed -E 's/.*\[//; s/\]//; s/"//g; s/,/\n/g' | sort -u)"
          if [ "$DECLARE" != "$CHARGE" ]; then
            echo "::error::Les plages CHARGÉES diffèrent de celles DÉCLARÉES dans le Caddyfile."
            printf 'déclaré : %s\nchargé  : %s\n' "$DECLARE" "$CHARGE"
            exit 1
          fi
          echo "  plages chargées == plages déclarées : $(printf '%s' "$CHARGE" | tr '\n' ' ')"

          # 3/3 — L'UPSTREAM PORTE BIEN {$API_PORT}. C'est CE contrôle qui ferme
          # le trou mesuré : sans lui, un upstream figé à :80 passerait au vert.
          for CIBLE in axion-api:3000 staging-api:3000; do
            if ! printf '%s' "$ADAPTE" | grep -q "\"dial\":\"$CIBLE\""; then
              echo "::error::Upstream attendu absent de la configuration chargée : $CIBLE. Vérifier que le Caddyfile interpole bien {\$API_PORT}."
              printf '%s' "$ADAPTE" | grep -o '"dial":"[^"]*"' | sort -u
              exit 1
            fi
          done
          echo "  upstreams : axion-api:3000 et staging-api:3000"

  # ---------------------------------------------------------------------------
  # GARDE-FOU 3 — AUCUN TEST NE DORT (11 §2 · 09 §5.7 · DoD transverse 09 §3)
  # ---------------------------------------------------------------------------
  # « Tests désactivés/skippés = build rouge » · « AUCUN test skippé » ·
  # `@critique` et `@filrouge` ne sont JAMAIS skippables.
  #
  # DEUX CONTRÔLES, UNE SEULE PROPRIÉTÉ. `check:no-skipped-tests` attrape le test
  # ÉTEINT (`.skip(`, `xit(`, `test.fixme(`…). `check:test-projects` attrape le
  # test ORPHELIN : un fichier hors des `include` d'un projet vitest, ou inclus
  # puis EXCLU, qui n'est jamais exécuté par personne. Le second est PIRE que le
  # premier — un skip se voit dans le rapport, un orphelin donne l'illusion de la
  # couverture — et aucun des deux détecteurs ne peut voir le trou de l'autre.
  # Ils vivent donc dans le MÊME job : la question qu'ils posent est la même, et
  # les séparer ferait croire qu'y répondre à moitié suffit.
  #
  # La détection elle-même vit dans `scripts/check-no-skipped-tests.mjs` (livré
  # par A01) : motifs `.skip( .only( .todo( .failing( xit( xdescribe( fit(
  # test.fixme( skipIf( this.skip(`, sur les fichiers de test suivis par git,
  # avec une **liste d'exceptions VIDE**. La CI l'APPELLE au lieu de réimplémenter
  # les mêmes motifs : deux détecteurs concurrents finissent toujours par diverger,
  # et c'est par l'écart entre les deux qu'un test critique disparaîtrait.
  #
  # LISTE D'EXCEPTIONS : VIDE, et elle doit le rester — une exception est une
  # décision humaine tracée dans DECISIONS.md (11 §8-5), pas une ligne de config.
  # ---------------------------------------------------------------------------
  anti-skip:
    name: aucun test désactivé ni orphelin (11 §2 / 09 §5.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: pnpm check:no-skipped-tests
        run: pnpm check:no-skipped-tests

      # Le test que personne n'exécute — et la péremption de
      # `--passWithNoTests`, qui devient une ERREUR dès que `apps/api/drizzle/`
      # apparaît (marqueur du lot L1). Comme `check:jonction`, ce script était
      # déclaré dans `package.json` sans être branché sur aucune porte bloquante
      # (défaut N-2). Il l'est désormais.
      - name: pnpm check:test-projects
        run: pnpm check:test-projects

      # Le staging cohabite avec le site de production sur la meme machine. Le
      # reseau du proxy Traefik a l ICC active (mesure par A54) : tout conteneur
      # qui le rejoint atteint la base PostgreSQL du voisin. Seul notre Caddy y a
      # droit, et ce controle le verifie plutot que de s en remettre a un commentaire.
      - name: pnpm check:isolation-reseau
        run: pnpm check:isolation-reseau

      # Deux conventions propres a la pile Coolify, chacune ayant coute un
      # deploiement rate : aucune interpolation dans un volume, et des chemins
      # relatifs resolus depuis la RACINE. `docker compose config -q` ne les voit
      # pas — il rend 0 dans les deux conventions.
      - name: pnpm check:compose-coolify
        run: pnpm check:compose-coolify

      # Garde-fou du garde-fou : si la liste d'exceptions du script cessait
      # d'être vide, le contrôle ci-dessus deviendrait perméable en silence.
      - name: Vérifier que la liste d'exceptions est restée vide
        run: |
          set -euo pipefail
          if ! grep -qE '^const EXCEPTIONS = \[\];' scripts/check-no-skipped-tests.mjs; then
            echo "::error title=Liste d'exceptions non vide::scripts/check-no-skipped-tests.mjs ne déclare plus « const EXCEPTIONS = []; ». Ajouter une exception au garde-fou anti-skip exige une entrée DECISIONS.md signée par Williams (11 §8-5) — et la levée explicite de ce contrôle-ci."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # GARDE-FOU 4 — INVARIANTS DU DÉPÔT (CLAUDE.md §1 · 09 §3 étape 3)
  # ---------------------------------------------------------------------------
  # 09 §3 étape 3 : l'auto-revue s'appuie sur une « checklist AUTOMATISÉE (pas de
  # couleur en dur, pas de référence client, UUID client sur les entités
  # offline…) ». Automatisée signifie : exécutée par la CI, pas par la bonne
  # volonté de l'agent qui vient de coder.
  # ---------------------------------------------------------------------------
  invariants:
    name: invariants du dépôt (CLAUDE.md §1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm
      # INVARIANT 2 — « aucune référence client dans le code ». La liste des noms
      # surveillés ne vit PAS dans le dépôt : il est public, et le garde-fou
      # publierait lui-même ce qu'il traque. Elle arrive par ce secret.
      #
      # CE CÂBLAGE A MANQUÉ JUSQU'AU LOT L1, alors que le script ET le fichier
      # d'exemple affirmaient tous deux qu'il existait. Le contrôle sortait donc
      # en 0 sans rien vérifier, et le job passait au vert : l'un des HUIT
      # invariants non négociables était décoratif. Relevé par le gardien A02.
      #
      # Tant que le secret n'est pas créé (Settings → Secrets and variables →
      # Actions), ce job ÉCHOUE volontairement — un contrôle qui n'a rien vérifié
      # ne sort jamais vert. C'est la même règle que l'échappatoire retirée de
      # `schema-diff.mjs`.
      - name: pnpm check:invariants
        env:
          AXION_CLIENTS_SURVEILLES: ${{ secrets.AXION_CLIENTS_SURVEILLES }}
        run: pnpm check:invariants

  # ---------------------------------------------------------------------------
  # GARDE-FOU 0 — JONCTIONS APPELANT → APPELÉ (avant tout le reste)
  # ---------------------------------------------------------------------------
  # `scripts/check-jonction.mjs` (A01) croise ce que la CI APPELLE avec ce que
  # les fichiers appelés DÉCLARENT : scripts `pnpm` résolus par paquet,
  # variables interpolées par l'infra vs `.env.example`, et scripts
  # `infra/scripts/*.sh` invoqués avec les drapeaux qu'ils déclarent
  # OBLIGATOIRES. C'est le contrôle qui mécanise la cause racine des sept
  # bloquants de la revue croisée : trois agents, trois moitiés d'interface,
  # chacune cohérente dans ses propres commentaires et dans celles de personne
  # d'autre. Aucun de ces défauts n'était visible depuis un seul fichier ; tous
  # étaient évidents en croisant deux fichiers.
  #
  # POURQUOI UN JOB DÉDIÉ QUI PRÉCÈDE `lint`, et non une étape parallèle :
  # il s'exécute en 0,2 s, et il répond à la question « les fichiers de ce dépôt
  # se parlent-ils encore ? ». Tant que la réponse est non, tout ce qui suit
  # échouerait de façon confuse (un `pnpm <script>` inexistant fait rougir un
  # job de fin de chaîne sans jamais nommer la vraie cause). Payer huit minutes
  # de CI pour l'apprendre en fin de course serait exactement le gaspillage que
  # ce contrôle existe pour supprimer.
  #
  # ⚠️ Ce script était déclaré dans `package.json` et n'était appelé PAR AUCUNE
  # PORTE BLOQUANTE — il ne tournait que si quelqu'un lançait `pnpm verify` à la
  # main, c'est-à-dire dans la situation même qui a produit les sept bloquants.
  # C'était le défaut M-1 reproduit dans le commit qui corrigeait M-1. Un
  # contrôle non exécuté n'est pas un contrôle, et le répéter une couche plus
  # haut ne le rend pas moins vrai (défaut N-2, seconde passe de la revue).
  # ---------------------------------------------------------------------------
  jonction:
    name: 0 · jonction (appelant → appelé)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: pnpm check:jonction
        run: pnpm check:jonction

      # MÊME GRAPHE, LES DEUX SENS. `check:jonction` va de l'APPELANT vers
      # l'appelé (« ce que j'invoque existe-t-il ? »). `check:graphe-modules`
      # ferme les deux autres côtés, et le premier est un contrôle de
      # CONSTRUCTIBILITÉ, pas d'hygiène — que personne ne sous-estime ce rouge :
      #
      #   1. LE PENDU — un fichier suivi par git qui importe un chemin que git NE
      #      CONNAÎT PAS. Défaut réel `b24b98c` : `apps/api/src/app.ts` importait
      #      `./domaines/auth/routes.js` alors que `apps/api/src/domaines/`
      #      n'était pas indexé. `origin` référençait un fichier absent du dépôt :
      #      clone frais en TS2307, CI en échec de construction, staging NON
      #      DÉPLOYABLE. Trouvé par un agent qui TENTAIT un déploiement — après un
      #      `typecheck` de pré-commit AU VERT, parce que `tsc` lit le disque et
      #      non l'index. Ce contrôle ne demande jamais « le fichier existe-t-il »
      #      mais « git connaît-il ce chemin ». Aucune soupape.
      #
      #   2. L'ORPHELIN — un module de `src/` que PERSONNE n'importe. Il mécanise
      #      la seconde moitié de la traçabilité de `CLAUDE.md` §4 étape 6
      #      (« code → exigences : le code orphelin est REFUSÉ »), la seule à ne
      #      reposer sur AUCUNE machine. Défaut réel `591ccbd` : un message qui
      #      annonçait quatre correctifs de sécurité, UN SEUL fichier livré (un
      #      module d'aide que personne n'importait), les cinq fichiers portants
      #      restés hors de l'index — **et une CI VERTE**, parce qu'aucun test ne
      #      couvrait encore le cas corrigé. Soupape bornée et auto-péremptoire :
      #      `scripts/modules-en-attente.md`.
      #
      # Les deux défauts sont rejouables sans toucher à l'arbre de travail :
      #   node scripts/check-graphe-modules.mjs --ref 591ccbd   → erreurs-jeton.ts
      #   node scripts/check-graphe-modules.mjs --ref b24b98c   → app.ts:18
      # Portée exacte et seize angles morts assumés : `--angles-morts`.
      - name: pnpm check:graphe-modules
        run: pnpm check:graphe-modules

      # LE TROISIÈME SENS DU MÊME GRAPHE. `check:jonction` et `check:graphe-modules`
      # rattachent le code AU CODE. `check:tracabilite` rattache le code À LA SPEC :
      # tout `E<n>` cité dans une source doit exister dans `docs/TRACABILITE_E1-E47.md`
      # (C1) et, s'il porte une glose, cette glose doit dire ce que dit le libellé
      # officiel (C2).
      #
      # LE DÉFAUT QU'IL FERME, ET IL ÉTAIT RÉEL : le 2026-08-29, 25 fichiers du socle
      # d'authentification revendiquaient E5 (« Scoring par unité, heatmap ») et E27
      # (« Design moderne, WCAG AA ») — la matrice qui VALIDE LA PORTE aurait donc
      # coché un socle d'autorisation contre une carte de chaleur.
      # Rejouable : `node scripts/check-tracabilite-exigences.mjs --verbeux`.
      # Portée exacte et six angles morts assumés — dont la limite fondamentale, qui
      # est qu'il ne distingue PAS un rattachement juste d'un rattachement faux :
      #   node scripts/check-tracabilite-exigences.mjs --angles-morts
      - name: pnpm check:tracabilite
        run: pnpm check:tracabilite

  # ---------------------------------------------------------------------------
  # 1/8 — LINT (11 §7)
  # ---------------------------------------------------------------------------
  lint:
    name: 1 · lint
    runs-on: ubuntu-latest
    # `lint` dépend de la CONSTRUCTION, et non l'inverse. Les règles typées
    # d'ESLint résolvent `@axion/shared` et `@axion/ui` par leurs déclarations de
    # types, qui n'existent qu'une fois `packages/*/dist` produit : sur un clone
    # neuf, linter d'abord donnait 55 erreurs « type cannot be resolved ».
    # Trouvé à la PREMIÈRE EXÉCUTION RÉELLE — en local, un `dist` résiduel masquait
    # le défaut.
    needs: [build-sources]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm

      # ---------------------------------------------------------------------
      # INTÉGRITÉ DU PACK — EN PREMIER, parce que c'est instantané et que c'est
      # le contrôle qui protège tous les autres.
      # ---------------------------------------------------------------------
      # `scripts/check-pack-integrity.mjs` (A01) compare les 12 fichiers de
      # `docs/` à leur sceau SHA-256. Il a été écrit après un incident réel du
      # lot L0 : un `pnpm format` a réécrit tout le pack (724 insertions,
      # 468 suppressions) sans que personne ne le demande. Il n'était appelé
      # NULLE PART — ni ici, ni dans `.husky/pre-commit`, ni dans
      # `.lintstagedrc.json`. Un contrôle qui ne s'exécute pas n'est pas un
      # contrôle : c'est le même défaut, une couche plus haut.
      # Placé AVANT `pnpm lint` : si un formateur a touché à la spécification,
      # on le sait en 200 ms, pas après huit minutes de CI.
      # Voir DECISIONS.md 2026-08-27 « Prettier ne touche pas au pack ».
      - name: pnpm check:pack (intégrité des 12 fichiers de docs/)
        run: pnpm check:pack

      # ---------------------------------------------------------------------
      # FORMAT DE `DECISIONS.md` (11 §9bis) — CÂBLÉ EN CI LE 2026-08-29.
      # ---------------------------------------------------------------------
      # Il était, sur les dix garde-fous du dépôt, LE SEUL à n'exister que dans
      # `.husky/pre-commit`. Un hook local ne s'applique pas à `--no-verify`, ni
      # à un clone sans `pnpm install` (pas de `prepare`, donc pas de hook), ni à
      # une édition faite depuis l'interface web de GitHub — trois chemins qui
      # mènent tous à `main`. L'en-tête de `scripts/check-decisions.mjs` proclame
      # que « la gouvernance cesse de reposer sur la discipline » : jusqu'à cette
      # ligne, elle y reposait encore, et DEUX entrées du registre lui-même
      # (2026-08-28) affirmaient déjà qu'il « est un contrôle bloquant de la CI »
      # — il ne l'était pas. Cette étape rend vraie une phrase déjà écrite.
      #
      # Placé ici, à côté de `check:pack` : ce sont les deux contrôles
      # DOCUMENTAIRES du dépôt (le pack scellé, le registre de décisions), ils
      # coûtent ~50 ms et ils protègent ce sur quoi tout le reste s'appuie.
      # Étape d'un job EXISTANT et non job nouveau, délibérément : `main` exige
      # 11 contrôles nommés, et créer un douzième job le rendrait NON REQUIS
      # jusqu'à ce qu'un humain édite la protection de branche — un garde-fou qui
      # ne bloque rien, c'est-à-dire exactement le défaut qu'on répare ici.
      - name: pnpm check:decisions (format de DECISIONS.md — 11 §9bis)
        run: pnpm check:decisions

      - name: pnpm lint
        run: pnpm lint
      # Le formatage est vérifié, jamais réécrit par la CI : un job qui corrige
      # le dépôt à la place de l'auteur masque le défaut au lieu de le signaler.
      - name: pnpm format:check
        run: pnpm format:check

  # ---------------------------------------------------------------------------
  # 2/8 — TYPECHECK (11 §7 · 11 §1 « TypeScript 5 strict », DoD : 0 erreur)
  # ---------------------------------------------------------------------------
  typecheck:
    name: 2 · typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: pnpm typecheck
        run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # 2bis/8 — COMPILATION DES SOURCES (`pnpm build`)
  # ---------------------------------------------------------------------------
  # Ce job ne figure pas tel quel dans la liste 11 §7 (« lint → typecheck →
  # unit → … »), et il est pourtant indispensable : sans lui, une PR pouvait
  # être VERTE avec une compilation cassée. Le seul `pnpm build` du dépôt vivait
  # dans les Dockerfiles, construits par le job `build` (images), qui dépend de
  # `e2e` et ne tourne PAS sur les pull requests. Autrement dit : la seule chose
  # qui prouvait que le code compile ne s'exécutait jamais au moment où ça
  # servait.
  #
  # `typecheck` ne le remplace pas : il fait `tsc --noEmit` par espace de
  # travail, sans résoudre les dépendances entre paquets construits
  # (`packages/*` produisent des `dist/` que `apps/*` consomment), sans passer
  # par les `tsconfig.build.json`, et sans exécuter les builds Vite de `field`
  # et `hq`. Un `tsc --noEmit` vert et un `vite build` rouge cohabitent très
  # bien.
  #
  # Position : APRÈS `typecheck` (une erreur de types se lit mieux dans le
  # message de tsc que dans une trace de bundler), AVANT `unit` (rien ne sert de
  # tester du code qui ne se construit pas).
  # ---------------------------------------------------------------------------
  build-sources:
    name: 2bis · build (sources)
    runs-on: ubuntu-latest
    needs: [jonction]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: pnpm build
        env:
          APP_ENV: dev
          TZ: UTC
        run: pnpm build

  # ---------------------------------------------------------------------------
  # 3/8 — TESTS UNITAIRES (11 §7 · 07 §13 « Unitaires (Vitest) »)
  # ---------------------------------------------------------------------------
  unit:
    name: 3 · unit
    runs-on: ubuntu-latest
    needs: [build-sources, anti-skip]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm
      # -----------------------------------------------------------------------
      # POURQUOI CONSTRUIRE ICI ALORS QUE `build-sources` EXISTE DÉJÀ.
      #
      # `needs:` n'impose qu'un ORDRE — il ne partage rien. Chaque job démarre sur
      # une machine neuve, sans `dist/`, et aucun artefact n'est transmis. Les
      # tests qui importent `@axion/shared` par son nom de paquet résolvent donc
      # `main: ./dist/index.js`, absent : « Failed to resolve entry for package ».
      #
      # LE DÉFAUT QUE CELA A PRODUIT, ET IL EST INSTRUCTIF : sur un poste de
      # développement `dist/` traîne depuis une compilation antérieure, donc la
      # suite est VERTE en local et ROUGE en CI. Cinq fichiers de tests ont ainsi
      # échoué en CI pendant qu'A01 rapportait « 279 tests verts » d'après des
      # exécutions locales. Un vert qui ne se reproduit pas là où il compte n'est
      # pas un vert. (2026-08-29)
      #
      # Seuls `./packages/**` sont construits : les tests unitaires n'ont pas
      # besoin des applications, et `build-sources` reste seul juge de la
      # compilation complète.
      # -----------------------------------------------------------------------
      - name: pnpm build (paquets uniquement — voir l'encadré ci-dessus)
        run: pnpm --recursive --filter "./packages/**" build
      - name: pnpm test:unit
        run: pnpm test:unit

  # ---------------------------------------------------------------------------
  # 4/8 — TESTS D'INTÉGRATION (11 §7 : services postgres, redis, minio)
  # ---------------------------------------------------------------------------
  # 07 §13 : « Intégration API (Vitest + Postgres testcontainers) ».
  # Les services ci-dessous couvrent le cas où la suite se branche sur des
  # services fournis par la CI ; Testcontainers reste utilisable dans le même
  # job (le socket Docker du runner est disponible). Voir « Doutes de spec ».
  # ---------------------------------------------------------------------------
  integration:
    name: 4 · integration (postgres, redis, minio)
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axion
          POSTGRES_PASSWORD: ci_factice_postgres
          POSTGRES_DB: axion_audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axion -d axion_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm
      # Voir l'encadré du job `3 · unit` : `needs:` n'impose qu'un ORDRE, il ne
      # partage AUCUN artefact. Sans cette étape, les tests qui importent
      # `@axion/shared` par son nom de paquet échouent sur « Failed to resolve
      # entry » — vert en local où `dist/` traîne, rouge ici. (2026-08-29)
      - name: pnpm build (paquets uniquement)
        run: pnpm --recursive --filter "./packages/**" build

      # MinIO ne peut PAS être déclaré en `services:` : son entrypoint exige
      # l'argument `server /data`, que la clé `services` de GitHub Actions ne
      # permet pas de passer (elle n'expose que `options`, pas `command`).
      # On le démarre donc explicitement, avec un healthcheck réel — et non un
      # `sleep` optimiste.
      - name: Démarrer MinIO (11 §7 — service d'intégration)
        run: |
          set -euo pipefail
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
            -e "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
            --health-cmd "mc ready local || curl -fsS http://localhost:9000/minio/health/live" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            "${MINIO_IMAGE}" server /data --console-address ":9001"

      - name: Attendre que MinIO soit vivant (échec explicite après 60 s)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO prêt après ${i} tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO n'a pas démarré en 60 s — journal du conteneur ci-dessous."
          docker logs minio || true
          exit 1

      - name: pnpm test:integration
        env:
          # 11 §2 : MinIO n'est jamais exposé publiquement ; ici il s'agit d'un
          # conteneur éphémère de CI avec des identifiants FACTICES.
          DATABASE_URL: postgresql://axion:ci_factice_postgres@127.0.0.1:5432/axion_audit_test
          DATABASE_URL_TEST: postgresql://axion:ci_factice_postgres@127.0.0.1:5432/axion_audit_test
          REDIS_URL: redis://127.0.0.1:6379
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_PORT: '9000'
          MINIO_USE_SSL: 'false'
          MINIO_ACCESS_KEY: ci_factice_minio
          MINIO_SECRET_KEY: ci_factice_minio_secret
          APP_ENV: dev
          # Le seed du lot L1 crée le compte fondateur et REFUSE de démarrer si ces
          # deux variables manquent — c'est voulu (11 §5, §34.4 : sans
          # `habilitated_at` posé, le premier utilisateur ne peut pas s'affecter sa
          # propre première mission). En local elles viennent du `.env` ; en CI il
          # faut les fournir, sinon les tests d'intégration échouent sur un défaut
          # d'ENVIRONNEMENT et non de code. Valeurs FACTICES, comme le reste.
          SEED_ADMIN_EMAIL: ci-factice@example.invalid
          SEED_ADMIN_PASSWORD: ci_factice_mot_de_passe_admin_12
          SEED_ADMIN_FULL_NAME: Administrateur de CI
          TZ: UTC
        run: pnpm test:integration

      - name: Arrêter MinIO
        if: always()
        run: docker rm -f minio || true

  # ---------------------------------------------------------------------------
  # 5/8 — TESTS E2E (11 §7 : Playwright, chromium)
  # ---------------------------------------------------------------------------
  # LIMITE ASSUMÉE — CONTRAT 11 §7, CITÉE MOT POUR MOT :
  #   « `context.setOffline(true)` couvre les scénarios réseau ; LES SERVICE
  #   WORKERS SOUS iOS NE SONT PAS COUVERTS PAR PLAYWRIGHT — le mode avion RÉEL
  #   sur iPad se rejoue À LA MAIN aux portes P-C et P-E (checklist 07 §15).
  #   Documenté, pas contourné. »
  # Conséquence opératoire : un vert sur ce job ne vaut PAS preuve du mode avion
  # iPad. La preuve est humaine, tracée dans le fichier de porte (11 §9bis).
  # ---------------------------------------------------------------------------
  e2e:
    name: 5 · e2e (chromium)
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Installer le navigateur chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: pnpm test:e2e
        env:
          APP_ENV: dev
          TZ: UTC
        run: pnpm test:e2e

      - name: Conserver le rapport Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 6/8 — DIFF SCHÉMA-vs-04 (11 §7 · critère L1 07 §12 : « zéro écart »)
  # ---------------------------------------------------------------------------
  # 11 §7 : « le diff porte sur tables, colonnes, contraintes PK/FK/UNIQUE/CHECK
  # et index du §7.1, comparés à un manifeste `schema-manifest.json` EXTRAIT du
  # fichier 04, commité AU LOT L1 et relu ligne à ligne à la porte P-A ».
  #
  # ⚠️ CONTOURNEMENT TEMPORAIRE — DISPARAÎT AU LOT L1 ⚠️
  # Le manifeste `apps/api/schema-manifest.json` n'existe pas encore (livrable
  # L1, agent A12). Faire « passer » ce job au vert sans manifeste serait un
  # MENSONGE DE CI. La logique de décision vit dans `scripts/schema-diff.mjs`
  # (livré par A01) et se durcit TOUTE SEULE :
  #   · pas de manifeste ET pas de `apps/api/drizzle/` → L1 non livré : le script
  #     sort en 0 avec un avertissement explicite (« rien n'est déclaré conforme :
  #     le contrôle est sans objet ») ;
  #   · `apps/api/drizzle/` existe MAIS pas de manifeste → ÉCHEC BLOQUANT ;
  #   · manifeste présent → comparaison réelle, tout écart = build rouge.
  # Aucun `continue-on-error` et aucun `|| true` dans ce job : la tolérance est
  # une CONDITION D'EXISTENCE explicite, écrite dans un fichier relu en revue, et
  # elle s'éteint d'elle-même dès que L1 pose ses migrations.
  # Critère L1 (07 §12) : « diff automatisé schéma réel vs fichier 04 = ZÉRO ÉCART ».
  # ---------------------------------------------------------------------------
  schema-diff:
    name: 6 · schema-diff (vs fichier 04)
    runs-on: ubuntu-latest
    needs: [e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axion
          POSTGRES_PASSWORD: ci_factice_postgres
          POSTGRES_DB: axion_audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U axion -d axion_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-node-pnpm

      # Le lot L1 a livré les migrations : plus de garde conditionnelle ici. Si
      # `apps/api/drizzle/` venait à disparaître, `pnpm db:migrate` échoue — et
      # c'est le comportement voulu, pas un cas à contourner.
      - name: Appliquer les migrations
        env:
          DATABASE_URL: postgresql://axion:ci_factice_postgres@127.0.0.1:5432/axion_audit_test
          APP_ENV: dev
          TZ: UTC
        run: pnpm db:migrate

      - name: pnpm schema:diff (tout écart = build rouge)
        env:
          DATABASE_URL: postgresql://axion:ci_factice_postgres@127.0.0.1:5432/axion_audit_test
          APP_ENV: dev
          TZ: UTC
        run: pnpm schema:diff

      # Second verrou, INDÉPENDANT du comparateur. `schema:diff` est une liste
      # BLANCHE : il vérifie ce qu'il sait nommer, et déclare conforme tout ce que
      # le 11 §7 ne lui demande pas de regarder. Trois passes de revue croisée ont
      # montré que le territoire hors liste contient des objets qui font
      # DISPARAÎTRE des données en silence — une RULE `DO INSTEAD NOTHING` sur
      # `answers` fait RÉUSSIR l'insertion sans rien écrire, et la synchronisation
      # terrain rapporte un succès. Ce contrôle-ci est une liste NOIRE : il exige
      # que rien d'autre n'existe. Les deux échouent pour des raisons opposées, ce
      # qui est exactement le but.
      - name: pnpm check:schema-inventaire (aucun objet hors du fichier 04)
        env:
          DATABASE_URL: postgresql://axion:ci_factice_postgres@127.0.0.1:5432/axion_audit_test
          APP_ENV: dev
          TZ: UTC
        run: pnpm check:schema-inventaire

  # ---------------------------------------------------------------------------
  # COUVERTURE — DoD transverse 09 §3 : « ≥ 90 % sur les modules critiques
  # (sync, crypto locale, scoring, RBAC/propriété) — MESURÉE, PAS DÉCLARÉE »
  # ---------------------------------------------------------------------------
  # Les modules critiques n'existent pas encore au L0 : leur liste est un
  # fichier de configuration VERSIONNÉ (.github/coverage-critical-paths.json),
  # vide au L0, alimenté lot par lot. Le job ci-dessous refuse deux mensonges :
  #   · un chemin déclaré qui ne correspond à aucun fichier (config périmée) ;
  #   · un module critique DÉJÀ LIVRÉ qui n'est couvert par aucune entrée de
  #     `cheminsCritiques` (config non alimentée = seuil silencieusement
  #     contourné). Le contrôle est fait module par module : une liste
  #     PARTIELLEMENT alimentée est un mensonge aussi efficace qu'une liste vide.
  # ---------------------------------------------------------------------------
  coverage:
    name: couverture ≥ 90 % (modules critiques — 09 §3)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Contrôler la cohérence de la liste des modules critiques
        id: config
        run: |
          set -euo pipefail
          config=.github/coverage-critical-paths.json
          if [ ! -f "$config" ]; then
            echo "::error::${config} absent — la DoD transverse (09 §3) exige une couverture MESURÉE sur une liste de modules versionnée."
            exit 1
          fi

          seuil="$(jq -r '.seuilMinimalPourcent' "$config")"
          nb="$(jq -r '.cheminsCritiques | length' "$config")"
          echo "seuil=${seuil}" >> "$GITHUB_OUTPUT"
          echo "nb=${nb}" >> "$GITHUB_OUTPUT"

          if [ "$seuil" != "90" ]; then
            echo "::error::Le seuil déclaré (${seuil} %) diffère de la DoD transverse (90 %). Abaisser ce seuil est une décision humaine tracée dans DECISIONS.md, pas une modification de configuration."
            exit 1
          fi

          # Ceinture 1 — un chemin déclaré doit correspondre à du code réel.
          echec=0
          while IFS= read -r motif; do
            [ -z "$motif" ] && continue
            if [ -z "$(git ls-files -- "$motif")" ]; then
              echo "::error::Chemin critique déclaré mais introuvable : ${motif} (configuration périmée dans ${config})."
              echec=1
            fi
          done < <(jq -r '.cheminsCritiques[].glob' "$config")

          # -------------------------------------------------------------------
          # Ceinture 2 — CHAQUE module attendu est testé INDIVIDUELLEMENT.
          # -------------------------------------------------------------------
          # La forme initiale (`code existe ET nb == 0`) devenait INERTE dès la
          # PREMIÈRE entrée de `cheminsCritiques` : `nb` valant alors 1 ou plus,
          # la condition ne pouvait plus jamais être vraie. Au lot L2, déclarer
          # `apps/api/src/rbac/**` en oubliant `apps/api/src/auth/**` aurait fait
          # échapper l'AUTHENTIFICATION au seuil de 90 % — en silence, c'est-à-
          # dire exactement le scénario que cette ceinture existe pour empêcher.
          #
          # On compare des FICHIERS, pas des chaînes de globs : le mode d'emploi
          # de `${config}` autorise explicitement l'agent du lot à corriger le
          # glob quand l'arborescence réelle diffère. Un contrôle qui exigerait
          # le glob mot pour mot serait faux au premier renommage ; celui-ci
          # reste juste, et il répond à la seule question qui compte : « ce
          # fichier critique est-il soumis au seuil, oui ou non ? »
          couverts="$(mktemp)"
          attendus="$(mktemp)"
          restants="$(mktemp)"
          while IFS= read -r glob_critique; do
            [ -z "$glob_critique" ] && continue
            git ls-files -- "$glob_critique" >>"$couverts"
          done < <(jq -r '.cheminsCritiques[].glob' "$config")
          sort -u -o "$couverts" "$couverts"

          while IFS= read -r ligne; do
            [ -z "$ligne" ] && continue
            lot="$(printf '%s' "$ligne" | cut -f1)"
            motif="$(printf '%s' "$ligne" | cut -f2)"
            git ls-files -- "$motif" | sort -u >"$attendus"
            # Module non encore livré : rien à exiger.
            [ -s "$attendus" ] || continue
            comm -23 "$attendus" "$couverts" >"$restants"
            if [ -s "$restants" ]; then
              echo "::error::Module critique LIVRÉ mais NON SOUMIS AU SEUIL : ${motif} (lot ${lot}). Fichiers hors de .cheminsCritiques : $(tr '\n' ' ' <"$restants"). La DoD transverse (09 §3, ≥ 90 % sur les modules critiques) serait contournée en silence. Action : déplacer l'entrée du lot ${lot} de .cheminsAttendus vers .cheminsCritiques dans ${config} (en corrigeant le glob si l'arborescence réelle diffère)."
              echec=1
            fi
          done < <(jq -r '.cheminsAttendus[] | [.lot, .glob] | @tsv' "$config")

          rm -f "$couverts" "$attendus" "$restants"
          exit "$echec"

      - name: Aucun module critique encore livré (L0) — mesure sans seuil
        if: steps.config.outputs.nb == '0'
        run: |
          echo "::warning title=Seuil de couverture non applicable::La liste .cheminsCritiques est vide : aucun module critique (sync, crypto locale, scoring, RBAC/propriété) n'est encore livré. Le seuil de 90 % s'activera automatiquement dès la première entrée — voir .github/coverage-critical-paths.json (colonne « lot qui alimente »). Contrôle de cohérence passé : aucun code critique livré hors liste."

      - name: Mesurer la couverture et appliquer le seuil de 90 %
        if: steps.config.outputs.nb != '0'
        run: |
          set -euo pipefail
          pnpm test:coverage
          # `pnpm test:coverage` doit produire un rapport `coverage/coverage-summary.json`
          # (reporter `json-summary` de Vitest 3). La CI ne fait PAS confiance au
          # code de sortie seul : elle relit les chiffres et tranche elle-même.
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::coverage/coverage-summary.json absent — la couverture doit être MESURÉE (09 §3), pas déclarée. Configurer le reporter 'json-summary' de Vitest."
            exit 1
          fi
          node .github/scripts/check-coverage.mjs

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapport-couverture
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 7/8 — BUILD DES 4 IMAGES (02 §30.5 / §30.6)
  # ---------------------------------------------------------------------------
  # Le build proprement dit vit dans le workflow réutilisable build-images.yml
  # (source de vérité UNIQUE, partagée avec deploy-prod.yml — pas de copie).
  # Il dépend de TOUS les garde-fous : rien ne se construit sur une base non
  # vérifiée.
  # ---------------------------------------------------------------------------
  build:
    name: 7 · build (4 images GHCR)
    needs: [schema-diff, coverage, gitleaks, shellcheck, invariants, anti-skip]
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      pousser: ${{ github.event_name == 'push' }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 8/8 — DÉPLOIEMENT STAGING (11 §7 « (tag) déploiement staging » · 02 §30.6)
  # ---------------------------------------------------------------------------
  # « PR mergée → … → job deploy-staging ». Donc : AU MERGE SUR `main`
  # UNIQUEMENT. Jamais sur une PR (le code n'est pas encore accepté), jamais sur
  # une branche `lot/**`.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: 8 · deploy-staging (merge sur main uniquement)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-staging.yml
    permissions:
      contents: read
      packages: read
    with:
      tag_image: ${{ needs.build.outputs.tag_sha }}
    secrets: inherit
