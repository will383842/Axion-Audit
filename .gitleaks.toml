# =============================================================================
# GITLEAKS — détection de fuite de secret (02 §30.4-5, BLOQUANT en CI)
# =============================================================================
# Applique :
#   · 02 §30.4-5 — « Détection de fuite en CI : gitleaks à chaque push
#     (BLOQUANT) + secret scanning GitHub activé + garde-fou dans CLAUDE.md :
#     l'autopilote a interdiction d'écrire une valeur de secret dans un fichier
#     versionné, les tests utilisent des secrets factices. »
#   · 02 §30.4-1 — « Jamais dans Git : .env gitignoré ; un .env.example documente
#     CHAQUE variable SANS AUCUNE VALEUR RÉELLE. »
#   · 11 §2 — « Aucune valeur de secret dans un fichier versionné. »
#
# EMPLACEMENT : racine du dépôt (emplacement conventionnel de gitleaks, lu par
# défaut). Consommé par le job `gitleaks` de .github/workflows/ci.yml, qui
# analyse l'HISTORIQUE COMPLET en pull request (fetch-depth: 0) — un secret
# introduit puis « retiré » reste dans l'historique et doit être détecté.
#
# Traçabilité E36/E43 — lot L0 (07 §12 : « secrets §30.3 provisionnés »),
# agent A52.
# =============================================================================

title = "Axion Audit — configuration gitleaks"

# Toutes les règles par défaut de gitleaks sont ACTIVES (clés AWS/GCP, jetons
# GitHub/Slack/Telegram, clés privées, chaînes de connexion, JWT, etc.).
# Aucune règle n'est retirée : le pack ne prévoit aucune exemption.
[extend]
useDefault = true

# -----------------------------------------------------------------------------
# ALLOWLIST — VOLONTAIREMENT MINIMALE
# -----------------------------------------------------------------------------
# UNE SEULE exception : le marqueur littéral `__CHANGEME__` utilisé par
# `.env.example` (02 §30.4-1) pour dire « ici vit un secret, voici comment le
# générer » — sans jamais en porter la valeur.
#
# Pourquoi ce ciblage et rien d'autre :
#   · on N'ALLOWLISTE PAS le fichier `.env.example` en entier : un vrai secret
#     collé par erreur dans ce fichier DOIT continuer à faire rougir le build.
#     Exempter le fichier reviendrait à créer le seul endroit du dépôt où l'on
#     peut fuiter tranquillement — exactement l'inverse du but ;
#   · on allowliste la LIGNE contenant `__CHANGEME__`, ce qui couvre aussi les
#     valeurs composées (`postgresql://axion:__CHANGEME__@postgres:5432/...`,
#     `redis://:__CHANGEME__@redis:6379`) que les règles « chaîne de connexion »
#     signaleraient sinon ;
#   · une ligne portant un secret réel ne contient pas ce marqueur : la porte
#     reste fermée.
#
# ⚠️ TOUTE AUTRE ENTRÉE dans cette allowlist est une décision humaine tracée
# dans DECISIONS.md (11 §8-4 : « toucher à la sécurité autrement que spécifié »).
# Ajouter un chemin ici pour « faire passer la CI » est la définition même d'une
# CI qui ment (09 §5.7).
# -----------------------------------------------------------------------------
[allowlist]
description = "Placeholders __CHANGEME__ de .env.example (02 §30.4-1) — et rien d'autre."
# regexTarget = "match" ET NON "line" — corrigé le 2026-08-28 après ÉPREUVE.
#
# CE QUE « line » FAISAIT, ET QUE PERSONNE N’AVAIT VU : la regex était comparée à la
# LIGNE ENTIÈRE, sans aucune contrainte de chemin. Toute ligne, DANS N’IMPORTE QUEL
# FICHIER, contenant `__CHANGEME__` était donc exemptée de TOUTES les règles
# gitleaks. Quatorze fichiers suivis portent ce marqueur, dont quatre scripts
# shell d’infrastructure qui manipulent des secrets. La description ci-dessus
# disait « et rien d’autre » ; l’implémentation créait la faculté partout.
#
# ÉPREUVE, avec témoin — et le témoin a compté : une première tentative avait
# conclu à tort, faute de sonde valide (les règles par défaut ne détectaient pas
# le motif choisi, marqueur ou non). Sonde refaite avec un jeton réellement
# détecté, présent DEUX fois : une ligne nue, une ligne portant le marqueur.
#
#   regexTarget = "line"   ->  leaks found: 1   (le marqueur exempte le .sh)
#   regexTarget = "match"  ->  leaks found: 2   (les deux sont attrapés)
#
# Et le cas légitime tient : `.env.example` avec ses marqueurs, Y COMPRIS dans
# les chaînes composées (`postgresql://axion:__CHANGEME__@postgres:5432/...`),
# n’est pas signalé. La raison est simple : avec « match », la regex est comparée
# au SECRET DÉTECTÉ. Une chaîne de connexion qui contient le marqueur le contient
# encore ; un vrai secret sur la même ligne, non.
#
# Ce choix a une seconde vertu : il ne dépend d’aucune version. La syntaxe des
# listes multiples (`[[allowlists]]`) aurait été plus explicite, mais la CI épingle
# gitleaks v8.18.4, qui ne la connaît pas — elle aurait été ignorée en silence,
# c’est-à-dire le pire des deux mondes.
regexTarget = "match"
regexes = [
  '''__CHANGEME__''',
  # ---------------------------------------------------------------------------
  # DEUX LEURRES DE TEST, exemptés par leur VALEUR EXACTE — 2026-08-29.
  #
  # Le 02 §30.4-5 exige que « les tests utilisent des secrets factices ». Ces deux
  # valeurs SONT ces secrets factices : les exempter applique la spécification,
  # ça n'y déroge pas. Mais elles doivent l'être de la façon la plus étroite
  # possible, et voici pourquoi chaque option plus large a été écartée :
  #
  #   · PAS par chemin (`apps/api/**/*.test.ts`) : ce serait créer une zone du
  #     dépôt où l'on peut fuiter tranquillement — exactement ce que l'encadré
  #     ci-dessus refuse pour `.env.example` ;
  #   · PAS par règle (désactiver `jwt` et `private-key`) : la règle serait
  #     éteinte sur TOUT le dépôt, y compris le code de production ;
  #   · PAS par empreinte : elle contient le sha du commit et le numéro de ligne,
  #     donc elle se périme au premier déplacement du fichier — un garde-fou qui
  #     se désarme tout seul sans le dire.
  #
  # ON EXEMPTE DONC LA VALEUR, ET RIEN QU'ELLE. Un autre jeton, une autre clé,
  # dans ce même fichier, font toujours rougir le build.
  #
  # POURQUOI CES DEUX-LÀ SONT PROUVABLEMENT INOFFENSIVES :
  #   1. le jeton est l'exemple PUBLIC et canonique de la documentation JWT,
  #      tronqué de surcroît — il ne signe rien et n'ouvre rien ;
  #   2. la clé privée porte `leurre-de-test-sans-valeur` DANS SON CORPS, à la
  # ---------------------------------------------------------------------------
  # TROISIÈME LEURRE — le jeton de DÉMONSTRATION du verdict A51, 2026-09-01.
  #
  # Détecté DEUX FOIS (`generic-api-key`, entropie 4,19) dans
  # `docs/portes/VERDICT_A51_SECURITE_2026-08-31.md`, lignes 327 et 741. Les deux
  # trouvailles portent LA MÊME valeur : une seule entrée les couvre.
  #
  # CE QUE CETTE VALEUR EST, vérifiable sans rien croire sur parole :
  # `eyJhbGciOiJIUzI1NiJ9` décode `{"alg":"HS256"}`, `eyJzdWIiOiJ4In0` décode
  # `{"sub":"x"}`, et la signature est le mot `sig`. Ce jeton ne signe rien et
  # n'ouvre rien ; l'adresse qui l'accompagne (`jean.dupont@client.fr`) est
  # fictive. Ce n'est pas un secret retiré après coup : c'est la PREUVE de la
  # faille F-01 — la redaction laissait sortir en clair une URL portant e-mail ET
  # jeton. Supprimer l'exemple viderait le verdict de sa démonstration.
  #
  # POURQUOI PAS PAR EMPREINTE, alors que c'était l'arbitrage initial de Williams
  # (2026-09-01) : l'encadré des deux leurres ci-dessus a déjà tranché ce point le
  # 2026-08-29, et son argument tient ici — une empreinte porte le sha du commit
  # ET le numéro de ligne. Ce fichier de porte vit et grossit ; au premier ajout
  # au-dessus de la ligne 327, l'exemption cesse de correspondre et le garde se
  # désarme SANS LE DIRE. La valeur exacte, elle, ne se périme pas. L'intention de
  # l'arbitrage est tenue (le plus étroit possible, ni par chemin ni par règle) ;
  # seul le mécanisme est aligné sur le précédent maison.
  #
  # ÉPREUVE, avec témoin — 2026-09-01, gitleaks v8.18.4, historique complet.
  # Les chiffres sont dans DECISIONS.md, mesurés et non supposés.
  #
  # Trace : DECISIONS.md 2026-09-01 « Le jeton de démonstration d'A51 fait rougir
  # gitleaks ».
  # ---------------------------------------------------------------------------
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ4In0\.sig''',
  #      place du matériel cryptographique, et son fichier le dit déjà en
  #      commentaire.
  #
  # HISTORIQUE, ET C'EST UN AVEU : l'encadré ci-dessus annonçait déjà que passer
  # de `line` à `match` ferait passer les fuites détectées de 1 à 2. Le correctif
  # a été livré le 2026-08-28 SANS traiter les deux trouvailles qu'il révélait.
  # La CI en est restée ROUGE, et personne ne l'a regardée pendant que les verts
  # LOCAUX étaient rapportés comme des verts tout court. Un correctif qui ouvre
  # un rouge sans le refermer n'est livré qu'à moitié.
  #
  # Trace : DECISIONS.md 2026-08-29 « Deux leurres de test font rougir gitleaks ».
  # ---------------------------------------------------------------------------
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dBjftJeZ4CVPmB92K27uhbUJU1p1r''',
  '''leurre-de-test-sans-valeur''',
]

# SECONDE ENTRÉE — ajoutée après la PREMIÈRE EXÉCUTION RÉELLE de la CI, qui a
# bloqué sur `docs/.pack-integrity.json`.
#
# Ce que gitleaks a détecté : une chaîne hexadécimale de 64 caractères, classée
# `generic-api-key`. C'est une EMPREINTE SHA-256 d'un des 12 fichiers du pack,
# posée par `pnpm check:pack` pour détecter toute dérive de la spécification.
#
# Pourquoi ce n'est pas un secret : une empreinte est la sortie d'une fonction de
# hachage appliquée à un fichier VERSIONNÉ dans ce même dépôt. Quiconque lit le
# dépôt peut la recalculer en une commande. Elle ne donne accès à rien.
#
# CE QUE CETTE ENTRÉE COÛTE, dit sans enjoliver : gitleaks n'expose pas de moyen
# propre d'exempter UNE règle par défaut sur UN chemin — redéfinir la règle sans
# fournir sa regex la viderait sur tout le dépôt, ce qui serait bien pire. Ce
# fichier est donc exempté de TOUTES les règles. Le risque résiduel est qu'un
# secret y soit collé sans être détecté.
#
# Ce qui rend ce risque acceptable, et lui seul : le fichier est ENTIÈREMENT
# GÉNÉRÉ par `check-pack-integrity.mjs --sceller` — il ne contient que 12 chemins,
# 12 empreintes et une phrase d'explication. Personne ne l'édite à la main, et
# `pnpm check:pack` échoue si son contenu ne correspond plus au pack. Un secret
# n'y survivrait pas au prochain scellement.
#
# Trace : DECISIONS.md 2026-08-27 « Faux positif gitleaks sur le sceau du pack ».
paths = [
'''^docs/\.pack-integrity\.json$''',
]
